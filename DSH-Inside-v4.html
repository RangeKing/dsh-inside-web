xt and conversation pressure must meet the backend’s configured conditions.","字符数不等于 Token 数。窗口压力为示意；没有执行模型容量评测。":"Character counts are not token counts. Pressure is illustrative; no model context benchmark was run.","源码与研究依据":"SOURCE & RESEARCH BASIS","研究提示：检索到一个词并不能证明长文理解；本例要求关联三条证据并排除一个干扰项。":"Research motivation: finding one word is not proof of long-text understanding. This case links three pieces of evidence and rejects a distractor.","回到当前步骤":"Back to the current step","本地分账预览":"LOCAL CALCULATOR PREVIEW","这只是本页的算术组件，不会启动或修改 DSH 插件。":"This is an arithmetic component in this page. It does not start or modify a DSH plugin.","付款金额（元）":"Payments (CNY)","重新计算":"Recalculate","所有金额都应是非负数，最多两位小数。":"Use non-negative amounts with at most two decimal places.","合计":"Total","均摊":"Share","没有需要转账的差额。":"No transfers needed.","四种模式快速比较":"Compare four presets","匹配案例":"Matching cases","源材料类型":"Material type","官方源码节选":"Official source excerpt","本页原创样本":"Original teaching fixture","正文":"Text","图形只强调当前交接，详细数据留在侧栏。":"The scene highlights the current hand-off; full data stays in the inspector.","你的问题 → 工具与模型协作 → 有依据的结果":"Your question → model/tool collaboration → an evidenced result","再看这一步涉及的服务":"SERVICES IN THIS STEP","框架路径与示例数据分开标注。":"Framework paths and example data are labeled separately.","只保存语言与主题偏好；导入日志不落盘、不上传。":"Only language and theme preferences may be stored; imported traces are neither saved nor uploaded.","资料全文":"Full material","当前页":"Page","条记录":"records","字 / characters":"characters","搜索没有结果。":"No matches found.","暂无对应推荐案例。":"No recommended cases match.","精确引用前回查原文；有损摘要无法承诺保留所有细节。":"Check the original before exact quotation; lossy summaries cannot promise to retain every detail.","返回":"Back","调用方式":"Invocation path","资料与问题":"MATERIALS & QUESTION","观察重点":"WATCH FOR","任务提示词":"TASK PROMPT","当前示例没有绑定真实模型；能力与限制来自固定的官方源码。":"No live model is attached to this example. Capability descriptions are grounded in the pinned official source.","3D 导览":"3D Journey","个服务":"services","官方 README（节选）":"Official README (excerpt)","源码阅读地图.txt":"Source reading map.txt","小票-安安.txt":"Receipt-An.txt","小票-波波.txt":"Receipt-Bo.txt","小票-晨晨.txt":"Receipt-Chen.txt","照片清单.txt":"Photo list.txt","采购单-v1.txt":"Grocery-list-v1.txt","家人更新后的-v2.txt":"Family-update-v2.txt","预期-v3.txt":"Expected-v3.txt","班级-1-报名.csv":"Class-1-registrations.csv","班级-2-报名.csv":"Class-2-registrations.csv","班级-3-报名.csv":"Class-3-registrations.csv","活动方案.txt":"Event plan.txt","场地确认.txt":"Venue confirmation.txt","费用报价.txt":"Cost estimate.txt","档案说明.txt":"Archive guide.txt","面板需求.txt":"Panel requirements.txt","案例库与四种模式":"Case library and four presets","先看案例的资料、目标和能力标签。四种模式页用同一顿饭展示不同工具组织方式；分账案例内也能切换独立路线。长文案例提供可搜索的全文与两种摘要分支。":"Start with each case’s materials, goal and feature tags. The preset lab uses one dinner bill to compare tool organization; the bill case also offers independent routes. The long-document case includes a searchable full corpus and two summary branches.","DSH 是怎么完成一项任务的？":"How does DSH complete a task?","三人聚餐后，怎样算清转账？":"After dinner, how should three people settle up?","整理照片前先确认：用户拒绝后会发生什么？":"Before organizing photos: what happens after the user refuses?","修改共享采购单时，怎样保留家人的更新？":"How do you preserve a family member’s changes to a shared shopping list?","合并三张报名表，找出重复报名的人":"Merge three registration sheets and find duplicate sign-ups","迎新活动能否按计划举办？让两个子 Agent 分别核对":"Can the welcome event go ahead? Ask two subagents to verify it","从 1200 份航行档案中找出三条关键线索":"Find three key clues in 1,200 voyage records","创造模式：临时做一个分账工具":"Create mode: build a temporary bill-splitting tool","接收任务并建立会话":"Receive the task and open the session","记录结果并完成本轮任务":"Record the result and finish the turn","组装模型可用的工具与提示词":"Assemble the tools and prompt for the model","读取官方资料作为依据":"Read official material as evidence","把核心概念翻译成通俗说明":"Translate the core concepts into plain language","Minimal 只提供两种模型可见工具":"Minimal exposes only two model-visible tools","读取三张小票":"Read the three receipts","在持久 Shell 中计算均摊":"Calculate the split in the persistent shell","生成可核对的转账方案":"Generate a checkable transfer plan","读取照片清单并生成归档方案":"Read the photo list and prepare an archive plan","移动操作进入审批流程":"Send the move operation to approval","用户拒绝本次移动操作":"The user rejects this move","记录拒绝结果并返回主循环":"Record the denial and return to the loop","读取采购单并记录当前版本":"Read the shopping list and record its version","文件在写入前被其他人更新":"Another user updates the file before the write","检测到版本变化，阻止旧版本写入":"Detect the version change and block the stale write","重新读取最新版本，保留新增内容":"Reread the latest version and preserve the new item","基于最新版本只修改牛奶数量":"Change only the milk quantity on the latest version","PTC 只向模型暴露 run_code":"PTC exposes run_code as the model-facing entry","模型生成批处理程序":"The model writes a batch-processing program","程序通过工具 SDK 读取三张表":"The program reads three sheets through the tool SDK","在程序内合并并按学号去重":"Merge and deduplicate by student ID inside the program","只返回汇总结果，再生成答复":"Return only the summary, then write the answer","把任务拆成场地与预算两个子问题":"Split the task into venue and budget checks","分别启动两个子 Agent 会话":"Start two subagent sessions","子 Agent 1 核对场地容量":"Subagent 1 checks venue capacity","子 Agent 2 核对活动预算":"Subagent 2 checks the event budget","主 Agent 汇总两份子任务结果":"The parent agent combines both subtask results","先搜索相关编号，缩小查阅范围":"Search for relevant IDs first","读取审批记录并保存证据位置":"Read the approval record and preserve its source","多轮历史接近上下文窗口上限":"Conversation history approaches the context limit","先裁剪过长工具结果":"Prune oversized tool results first","压缩较早的会话历史":"Compact older conversation history","用压缩后的上下文继续任务":"Continue with the compacted context","读取后续记录，确认改道已经执行":"Read later records to confirm the reroute was executed","摘要缺少批准人姓名，暂停推断":"The summary omits the authorizer; stop and verify","按记录编号回查原文":"Reread the source record by ID","摘要保留关键信息，最终引用仍回查原文":"The summary kept the key evidence; still verify the source before quoting","检查当前运行时可用接口":"Inspect the interfaces available in the current runtime","定义临时工具，暂不运行":"Define the temporary tool without running it","运行临时界面前请求批准":"Request approval before running the temporary UI","批准后运行临时分账面板":"Run the temporary bill-splitting panel after approval","停止临时工具并保留定义记录":"Stop the temporary tool and keep its definition record","Standard 提供完整的原生工具集":"Standard exposes the full native toolset","用原生 read 工具读取三张小票":"Read the three receipts with the native read tool","用 Shell 核对均摊计算":"Verify the split with the shell","PTC 通过 run_code 组织底层工具":"PTC orchestrates underlying tools through run_code","程序内部完成读取与计算":"Read and calculate inside the program","判断重复任务是否值得创建临时工具":"Decide whether a repeated task deserves a temporary tool","创造模式":"Create mode","创造":"Create","在 Standard 基础上，检查运行时并定义、运行临时插件。":"Build on Standard by inspecting the runtime, then defining and running temporary plugins.","从一个具体问题开始认识 DSH。":"Start learning DSH with a concrete problem.","看清每一步是怎么发生的。":"See how every step actually happens.","每个案例都包含资料、过程和答案。可以按难度逐步探索，也可以直接进入感兴趣的能力。":"Every case includes materials, execution, and an answer. Follow the difficulty ladder or jump straight to a capability you care about.","同一个模型，换一套预设，能力组合会怎样变化？":"Same model, different preset: see how the capability mix changes.","四种预设，一眼看懂能力组合的差别。":"Four presets, with their capability differences visible at a glance.","这里比较工具组织方式，不对模型能力排序。流程阶段用于教学说明，不能用来推算真实调用次数或性能。":"This compares tool organization, not model intelligence. Teaching stages do not represent fixed call counts or performance.","阅读资料本身不会触发压缩。只有进入会话的内容和历史压力达到配置条件时，压缩后端才会介入。":"Reading a file alone does not trigger compaction. The backend becomes relevant when content has entered the conversation and configured pressure conditions are met.","流程示意（用于说明处理步骤，不能直接作为 SDK 程序运行）：\n读取 3 张报名表\n按 student_id 分组\n输出记录数、实际人数和重复学号":"Process sketch (illustrative, not executable SDK code):\nRead 3 registration sheets\nGroup by student_id\nReturn record count, unique people, and duplicate IDs","按需创建临时工具或界面":"Create a temporary tool or interface on demand","四种预设，一眼看清能力组合的差别。":"Four presets, with their capability differences visible at a glance.","提示词中的“先征求确认”需要由实际审批策略落实。本例把文件移动配置为必须先获批准，因此拒绝会在文件操作真正执行前生效。":"A prompt that asks for confirmation must be backed by an actual approval policy. Here, file moves require approval, so a denial takes effect before the file operation runs.","本次照片整理已取消，3 张照片仍保留在原来的位置。\n移动：0 张；删除：0 张；内容修改：0。\n\n如果之后决定继续，可以重新确认移动方案并发起操作。":"Photo organization was cancelled. All three photos remain in their original locations.\nMoved: 0; deleted: 0; contents changed: 0.\n\nIf you decide to continue later, confirm the move plan again and start a new operation.","检测到外部更新":"External update detected","重新核对并补全证据":"Evidence rechecked and completed","汇总结果返回主循环":"Summary returned to the main loop","采购单出现外部更新":"Shopping list changed externally","证据不足，暂停结论":"Insufficient evidence; pause the conclusion","从官方介绍出发，用一个完整任务认识模型、工具、执行循环和会话记录。":"Start with the official introduction and follow one complete task to understand the model, tools, execution loop, and session record.","理解 DSH 的基本分工：模型决定下一步，工具执行具体动作，Agent Loop 负责推进任务，会话保存过程与结果。":"Understand the basic division of work in DSH: the model chooses the next step, tools perform concrete actions, the Agent Loop advances the task, and the session preserves the process and result.","我不会编程。请读 DSH 的官方介绍，用“接收任务 → 读取资料 → 执行动作 → 汇报结果”解释它怎样完成一项任务。再告诉我每一步主要由哪个源码包负责。不要修改文件。":"I do not code. Read the official DSH introduction and explain one task as “receive task → read material → perform action → report result”. Then name the source package mainly responsible for each stage. Do not modify files.","当前步骤只突出参与这次交接的服务，并展示它们之间传递的数据。":"This step highlights only the services involved in the current handoff and the data passed between them.","高亮组件参与当前步骤；方向箭头表示这一次教学数据的传递方向。":"Highlighted components participate in this step; directional arrows show the teaching data flow for this handoff.","会话会持续记录任务过程；持久化插件负责把记录写入存储。本页仅在浏览器内播放教学数据。":"The session keeps recording task progress; a persistence plugin writes those records to storage. This page only plays teaching data in the browser.","读取三张小票，计算均摊金额，再生成一份可以直接照着转账的结果。":"Read three receipts, calculate the equal split, and produce a transfer plan that can be followed directly.","Minimal 只向模型提供两种工具，但仍能完成读取资料和简单计算；这个案例还可用来横向比较四种预设。":"Minimal exposes only two tools to the model, yet it can still read material and perform simple calculations. This case also compares the four presets side by side.","周末聚餐，安安付了 96 元，波波付了 54 元，晨晨付了 30 元。三人平摊。请读取三张小票，算出总额、每人应付金额和最终转账方案。请直接给出结果和核对过程，无需展示代码。":"At dinner, An paid CNY 96, Bo paid CNY 54, and Chen paid CNY 30. Split the cost equally. Read the three receipts, calculate the total and each person’s share, and provide the final transfer plan with a short verification. No code is needed.","临时面板教学演示 · 未启动真实 DSH 插件":"Temporary panel teaching demo · no live DSH plugin started","系统先列出移动方案并请求批准；用户拒绝后，文件操作停止在真正执行之前。":"The system first proposes the moves and requests approval. If the user declines, the file operation stops before execution.","请把三张旅行照片按拍摄月份整理到对应文件夹。先列出移动方案，等我明确同意后再执行。不要删除照片，也不要修改照片内容。":"Organize the three travel photos into folders by capture month. First show the move plan and wait for my explicit approval before executing. Do not delete or modify the photos.","用户拒绝 · 未执行文件移动":"User declined · no file move executed","用户回复：先不要移动，我要把方案发给朋友确认。":"User reply: Do not move anything yet. I want to send the plan to a friend for confirmation.","任务只要求把牛奶改成 4 盒，但家人同时加入了鸡蛋。系统需要先发现版本冲突，再基于最新内容重试。":"The task only changes milk to four cartons, while a family member adds eggs at the same time. The system must detect the version conflict and retry against the latest content.","展示文件观察策略与文件系统实现如何配合：先读取版本，写入前重新校验，发现变化后要求重新读取。":"See how the file-observation policy works with the filesystem provider: read a version, revalidate before writing, and require a reread if the file changed.","这里模拟另一位用户同时更新采购单。当前 Agent 还持有旧版本，因此下一次写入需要重新校验。":"This simulates another user updating the shopping list concurrently. The current agent still holds an older version, so the next write must be revalidated.","检测到版本冲突 · 重新读取最新文件":"Version conflict detected · reread the latest file","让一段程序连续读取、合并和去重三张表，只把最终统计结果交回主模型。":"Use one program to read, merge, and deduplicate three sheets, returning only the final statistics to the main model.","PTC 让模型通过 run_code 组织多个工具调用；程序可以在内部处理大量中间数据，再返回精简结果。":"PTC lets the model orchestrate multiple tool calls through run_code. The program can process large intermediate data internally and return a compact result.","去重在程序内部完成，主模型只接收汇总结果。Standard 也能通过 Shell 执行脚本；PTC 的重点是模型通过 run_code 和工具 SDK 组织数据流。":"Deduplication happens inside the program, so the main model receives only the summary. Standard can also run scripts through the shell; PTC specifically organizes the data flow through run_code and the tool SDK.","一个子 Agent 核对场地容量，另一个核对预算，主 Agent 最后汇总两份证据。":"One subagent checks venue capacity, another checks the budget, and the main agent combines both pieces of evidence.","主任务与子任务拥有各自的会话记录。任务描述可以要求子 Agent 只读，真正的权限限制仍由实际策略配置决定。":"The main task and subtasks have separate session records. A prompt can request read-only behavior, while actual permission boundaries still depend on the configured policies.","在大量记录中找到改道目的地、批准人和原因；当摘要漏掉细节时，回到原始记录重新核对。":"Find the reroute destination, approver, and reason across many records; if the summary omits a detail, return to the original record and verify it.","长文检索与上下文压缩是两类问题。本例先分批查阅原创档案，再展示会话历史接近窗口上限时的裁剪、摘要替换和原文回查。":"Long-document retrieval and context compaction are separate problems. This case first searches an original archive in batches, then demonstrates pruning, summary replacement, and source rereading as conversation history approaches the context limit.","完整会话日志保留 · 模型当前上下文已压缩":"Full session log retained · current model context compacted","先检查运行时提供的接口，再定义一个临时分账面板；得到批准后运行，演示结束后停止。":"Inspect the runtime interfaces first, define a temporary bill-splitting panel, run it after approval, and stop it when the demo is finished.","展示创造模式（Cordis preset）的动态扩展流程。模型可以检查、定义和运行临时能力；动态代码属于高信任操作，本页只演示状态变化。":"See the dynamic-extension flow of Create mode (the Cordis preset). The model can inspect, define, and run temporary capabilities. Dynamic code is a high-trust operation; this page only demonstrates state changes.","进入任务导览":"Open task walkthrough"}</script>

    document.addEventListener('keydown', e => { if ($('#modal').open || ['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName) || e.target.isContentEditable)

    function initFromHash(){
