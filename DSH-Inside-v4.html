<script type="application/json" id="locale-data">{"修复折扣计算":"Fix a discount bug","100 元打八折，代码却算出 −1900 元。":"A 20% discount on 100 returns −1900.","请修复 src/price.ts 中的折扣计算。discountPercent=20 表示八折，100 元应返回 80 元。先读源码和测试，只修改必要代码，运行 npm test，最后告诉我改了什么、测试是否通过。":"Fix the discount calculation in src/price.ts. discountPercent=20 means 20% off: 100 should become 80. Read the code and tests first, make the smallest change, run npm test, then report the change and test results.","示例工作区 /demo/shop · 2 个文件 · 3 个测试":"Example workspace /demo/shop · 2 files · 3 tests","已修复 src/price.ts：将折扣百分数除以 100 后参与计算。\n\n100 元，20% 折扣 → 80 元。\n测试结果：3 项通过，0 项失败。\n仅修改 1 行，未改动测试。":"Fixed src/price.ts by dividing the discount percentage by 100 before applying it.\n\n100 with a 20% discount → 80.\nTests: 3 passed, 0 failed.\nChanged one line; tests were left unchanged.","100 元，为什么算成了负数？":"Why did 100 become negative?","任务已提交":"Task submitted","为这次修复准备工具":"Assemble the repair toolkit","Agent 就绪":"Agent ready","记录本轮任务的开始":"Record the start of this turn","第 1 轮开始":"Turn 1 opened","把问题和工具清单交给模型":"Prepare the prompt and tools","上下文已组装":"Context assembled","模型收到折扣修复请求":"Send the repair request","请求 1 / 读取文件":"Request 1 / inspect files","模型要求读取两个文件":"Request two file reads","2 个调用等待检查":"2 calls awaiting checks","只读操作通过策略检查":"Allow the read-only operations","允许读取":"Reads allowed","本示例配置允许读取工作区文件。前置策略和守卫通过后，调度器才会执行工具；无需发起人工批准。":"This example policy allows workspace reads. The scheduler runs the tools only after pre-policy and guards pass; no human approval is requested.","文件里找到了出错的一行":"Locate the faulty line","文件读取完成":"Files read","测试先读完，也按 A、B 写回":"Commit A then B, even if B finishes first","B 已完成，等待 A 写回":"B finished; waiting for A","模型确认：百分数少除以 100":"Identify the missing division by 100","请求 2 / 生成修复":"Request 2 / plan the edit","只替换出错的表达式":"Replace only the faulty expression","1 行修改已应用":"One-line patch applied","示例中启用了读取后编辑检查：文件已经读过且未被其他操作修改，因此这次字面替换可以提交。文件提供方负责实际写入。":"The example enables read-before-edit checks. The file was read and has not changed, so the literal replacement can be committed. The filesystem provider performs the write.","启动 npm test 验证修复":"Run npm test to verify the fix","测试进程运行中":"Test process running","本场景使用本地命令执行器。bash 工具调用 shell，执行器再通过 subprocess 启动 npm test。受限执行器可额外接入 sandbox，本场景未演示该分支。":"This scenario uses a local shell executor. The bash tool calls shell, which starts npm test through subprocess. Sandboxed executors can also use sandbox; that branch is not shown here.","三个测试全部通过":"All three tests pass","测试结果已写回":"Test results committed","测试工具返回退出码 0。结果较短，后置策略直接保留，随后写入会话供下一次模型请求使用。":"The test tool returns exit code 0. The output is short, so post-policy keeps it inline and the result is committed for the next model request.","给用户一个可核对的答复":"Return a checkable answer","最终答复已生成":"Final response generated","保存完成状态":"Record completion","第 1 轮已完成":"Turn 1 completed","结果与过程都留下记录":"Keep the result and its history","任务完成":"Task complete","拒绝修改配置":"Deny a config change","修改生产配置前，用户点击了“拒绝”。":"The user denies a production config change.","将 config/production.json 中的 logLevel 从 \"info\" 改为 \"debug\"。这个文件受保护，修改前必须让我确认；我拒绝时保留原文件并说明结果。":"Change logLevel in config/production.json from \"info\" to \"debug\". This file is protected: ask me before changing it. If I deny approval, leave it unchanged and report the outcome.","示例策略：生产配置写入必须询问 · 用户选择拒绝":"Example policy: ask before writing production config · user denies","未修改 config/production.json。\n\n你拒绝了本次写入，logLevel 仍为 \"info\"。\n文件写入工具没有执行。需要启用调试日志时，请重新授权该操作。":"config/production.json was not changed.\n\nYou denied this write; logLevel remains \"info\".\nThe file-write tool body did not run. Authorize a new operation to enable debug logging.","提交受保护的配置修改":"Submit a protected config change","挂载询问式写入策略":"Mount an ask-before-write policy","策略已加载":"Policy loaded","开始这轮配置任务":"Open the config-change turn","把目标修改交给模型":"Assemble the requested change","上下文就绪":"Context ready","模型准备写入请求":"Prepare a write request","模型正在响应": t","模型请求出错位置附近的片段":"Request a window around the error","请求日志片段":"Requesting a log window","把读取请求交给文件工具":"Dispatch the windowed read","读取等待执行":"Read queued","读到连接池和超时记录":"Find pool exhaustion and timeout evidence","关键证据已读取":"Key evidence read","将证据写入会话":"Commit the evidence to the session","工具结果已记录":"Tool result recorded","步骤后压力检查触发整理":"Post-step pressure triggers compaction","先检查裁剪，再生成摘要":"Check pruning, then summarize","保留原问题与三条关键证据":"Keep the question and three key findings","摘要替换当前上下文":"Summary replaces current context","用整理后的内容继续组装":"Assemble a request from the condensed context","上下文空间已释放":"Context headroom restored","发出下一次正常模型请求":"Send the next normal model request","继续分析，无需错误重试":"Continue without an error retry","给出根因、证据和建议":"Report the cause, evidence, and next steps","结束这轮排查":"Close the investigation turn","保留完整日志和整理记录":"Keep the full history and replacements","这里演示步骤后压力触发的整理。下一步正常重新组装上下文并继续请求；请求报错后的重试是另外一条条件分支。":"This scenario shows post-step pressure compaction. The next step assembles the condensed context and makes a normal request. Retrying after a request error is a separate conditional path.","图中压力数值是讲解用的示例，未测量真实 token。":"Pressure values are illustrative; no real token measurement was taken.","委派一次安全检查":"Delegate a security review","子 Agent 查接口代码，主 Agent 汇总建议。":"A child reviews endpoint code; the parent reports back.","请检查 src/routes/user.ts 的输入校验。把代码审查交给一个只读子 Agent，要求它返回具体行号、风险和修复建议；你负责汇总，不要修改任何文件。":"Review input validation in src/routes/user.ts. Delegate the code review to a read-only child agent and ask for line numbers, risks, and fixes. Summarize the findings yourself; do not modify files.","示例 spawn 子会话 review-01 · 子 Agent 只有读取工具":"Example spawn session review-01 · child has read-only tools","审查完成，未修改文件。\n\n1. L12：name 缺少字符串类型与长度校验。建议限制为 1–80 个字符。\n2. L18：age 直接参与写入，缺少整数与范围校验。建议限定为 0–120 的整数。\n\n以上来自子 Agent review-01 的代码审查，主任务已汇总为两项可执行修改。":"Review complete. No files were changed.\n\n1. L12: name lacks type and length validation. Require a string of 1–80 characters.\n2. L18: age is written without integer or range validation. Require an integer from 0 to 120.\n\nFindings came from child agent review-01 and were summarized into two actionable changes.","提交只读代码审查任务":"Submit a read-only code review","主任务准备委派能力":"Prepare the parent delegation tools","父 Agent 就绪":"Parent agent ready","打开父任务这一轮":"Open the parent turn","父任务运行中":"Parent running","说明子任务的目标和限制":"Specify the child goal and constraints","只读约束已准备":"Read-only constraints prepared","模型决定委派审查":"The model delegates the review","委派已计划":"Delegation planned","委派工具进入统一管线":"Route delegation through the tool pipeline","等待委派检查":"Delegation awaiting checks","允许这次只读委派":"Allow the read-only delegation","委派获准":"Delegation allowed","创建独立的子会话":"Create a separate child session","子 Agent 已启动":"Child agent started","子 Agent 读取并检查代码":"The child reads and reviews the code","子任务发现 2 个问题":"Child found 2 issues","只把审查结论交还父任务":"Return findings to the parent","父任务收到结论":"Parent received findings","父模型结合子任务结论":"The parent uses the child findings","父任务整理答复":"Parent composing the response","输出两条可执行建议":"Return two actionable recommendations","结束父任务这一轮":"Close the parent turn","父子记录各自保留":"Keep parent and child histories separate","示例部署允许创建此只读子 Agent。工具集合限制它只能读取；实际部署还需要文件访问边界配合，才能限制读取范围。":"The example deployment allows this read-only child. Its tool set permits reads only; actual deployments also need filesystem access controls to constrain what it can read.","用程序汇总销售数据":"Summarize sales with a program","三个 CSV 文件，一次程序化调用算出总额。":"Aggregate three CSV files in one programmatic call.","读取 data/jan.csv、data/feb.csv、data/mar.csv，分别汇总 amount 列并计算季度总额。使用程序化工具调用完成，输出每月金额、总额和记录数，不要修改文件。":"Read data/jan.csv, data/feb.csv, and data/mar.csv. Sum each amount column and calculate the quarterly total using programmatic tool calling. Return monthly totals, the grand total, and the row count. Do not modify files.","示例 PTC 模式 · 3 个 CSV · 金额单位：元":"Example PTC mode · 3 CSV files · amounts in CNY","季度销售汇总（人民币）\n\n1 月：3,000 元（2 条）\n2 月：4,500 元（2 条）\n3 月：6,000 元（2 条）\n\n季度总额：13,500 元，共 6 条记录。\n三个原始 CSV 均未修改。":"Quarterly sales summary (CNY)\n\nJanuary: 3,000 (2 rows)\nFebruary: 4,500 (2 rows)\nMarch: 6,000 (2 rows)\n\nQuarterly total: 13,500 across 6 records.\nAll three source CSV files are unchanged.","提交三个月的数据汇总":"Submit a three-month aggregation","装配程序化调用环境":"Assemble the programmatic runtime","PTC 模式就绪":"PTC mode ready","打开汇总任务记录":"Open the aggregation turn","向模型提供程序接口说明":"Expose the generated program interface","工具 SDK 已准备":"Tool SDK prepared","模型计划一次程序化调用":"Plan a single programmatic call","模型正在编写程序":"Model drafting the program","提交 run_code 调用":"Submit run_code","程序等待检查":"Program awaiting checks","检查程序和工具访问边界":"Check program and tool access","允许读取数据":"Data reads allowed","程序读三个文件并汇总":"Read and aggregate three files","3 次读取，6 条记录":"3 reads, 6 records","把汇总值返回顶层调用":"Return the aggregation to the top-level call","程序结果已记录":"Program result recorded","模型只需整理结构化结果":"Use the structured program result","准备最终答复":"Preparing the final answer","输出季度销售汇总":"Return the quarterly summary","结束本轮汇总":"Close the aggregation turn","保留分层调用记录":"Keep nested and top-level records","程序内部的读取调用与顶层 run_code 返回值分开记录。本例只返回简短汇总，无需触发长结果外存。":"Nested reads and the top-level run_code result are recorded separately. This example returns a short summary and does not need oversized-result spill storage.","// 讲解用伪代码；实际工具绑定以运行时生成的 SDK 为准。\nconst files = [\"jan.csv\", \"feb.csv\", \"mar.csv\"];\nconst texts = await readWithGeneratedSDK(files);\nconst monthly = texts.map(sumAmountColumn);\nreturn { monthly, total: sum(monthly), rows: 6 };":"// Explanatory pseudocode; actual bindings come from the generated SDK.\nconst files = [\"jan.csv\", \"feb.csv\", \"mar.csv\"];\nconst texts = await readWithGeneratedSDK(files);\nconst monthly = texts.map(sumAmountColumn);\nreturn { monthly, total: sum(monthly), rows: 6 };","模型提出读取 checkout.log 指定行范围的调用。助手消息先写入会话，再将读取请求交给统一工具调度器。":"The model proposes a line-window read of checkout.log. The assistant message is committed before the read enters the shared tool scheduler.","本阶段只有一次日志读取。返回的 60 行片段写入会话，随后由步骤后压力检查决定是否需要整理上下文。":"This stage contains one log read. Its 60-line result is committed to the session before the post-step pressure check decides whether to compact the context.","主模型提出一次委派调用，要求只读审查 user.ts。调用先经过统一的工具管线，允许后才会创建子 Agent。":"The parent model proposes a delegation to review user.ts without edits. The call passes through the shared tool pipeline before a child agent can be created.","子 Agent 使用自己的模型、工具范围和会话。它通过工具管线读取 user.ts，找出两处校验缺失，再准备结构化结论；图中的箭头强调文件读取这一段。":"The child has its own model context, tool scope, and session. It reads user.ts through the tool pipeline, identifies two validation gaps, and prepares findings. The arrow highlights the filesystem read segment.","模型提交一次 run_code 顶层调用。程序将经生成的 SDK 请求三次文件读取；调用工具的具体绑定由实际装配的 SDK 决定。":"The model submits one top-level run_code call. Its program requests three reads through the generated SDK; the actual mounted SDK determines the binding signatures.","顶层 run_code 调用经过工具策略与守卫后进入代码运行时。程序随后使用主机绑定调用工具，每个嵌套调用仍受工具管线约束。":"After tool policy and guards pass, the top-level run_code call enters the code runtime. The program invokes tools through host bindings, and each nested call remains subject to the tool pipeline.","代码运行时通过生成的主机绑定调用读取工具，读取工具再访问 ctx.fs。每月金额在程序中汇总；箭头强调受工具管线约束的文件访问。":"The code runtime invokes read tools through generated host bindings; those tools access ctx.fs. The program sums monthly amounts. The arrow highlights filesystem access through the tool pipeline.","附件存储":"Attachment storage","保存图片等二进制附件。模型适配器把已授权的文件引用转换为对应模型能接收的内容。":"Stores binary attachments such as images. Model adapters translate authorized file references into the content format their provider accepts.","文件上传":"File uploads","接收上传流并管理暂存凭据；会话控制器在接受提交时绑定这些凭据。":"Accepts upload streams and manages staged receipts. The session controller binds these receipts when a submission is accepted.","模型接口":"Model interface","用统一的流式请求接口连接不同模型。模型适配器负责把请求和回复转换成各家协议。":"Connects models through a common streaming interface. Adapters translate requests and responses into each provider's protocol.","请求扩展":"Request extensions","插件分别准备 DeepSeek 请求的扩展字段，官方适配器合并，并在 HTTP 请求被接受后提交交付状态。":"Plugins prepare independent DeepSeek request fields. The official adapter merges them and commits delivery state after HTTP acceptance.","上下文计量":"Context measurement","按会话维护独立的重放计量，向压力判断提供带版本的只读测量结果。":"Maintains isolated per-session replay measurements and provides revisioned, read-only pressure readings.","工具结果裁剪":"Tool-result pruning","先替换当前上下文中过大的工具结果，再考虑摘要压缩；替换过程可以重放。":"Replaces oversized tool results on the current context surface before summary compaction. These replacements can be replayed.","会话日志":"Session log","保存只追加的会话事件，并从事件派生模型当前可见的消息。写入日志和模型可见内容有不同职责。":"Stores append-only session events and derives the messages currently visible to the model. The durable log and current context have distinct roles.","会话入口":"Session entry point","处理会话命令、历史读取和实时控制，并决定何时激活 Agent。":"Handles session commands, history reads, and live control, and decides when to activate an agent.","会话文件候选":"Session file candidates","沿会话控制器既有的 Agent 查找规则，提供文件引用发现。":"Discovers file references using the session controller's established agent lookup policy.","会话技能目录":"Session skill catalog","列出此会话配置中可由用户触发的技能，无需激活尚未运行的 Agent。":"Lists user-invocable skills in this session's composition without activating a cold agent.","凭据管理入口":"Credential management","把凭据服务映射到远程接口，负责批量分发、展示结果和拒绝原因。":"Exposes credential services through remote interfaces and handles batch fan-out, presentation, and refusals.","设置管理入口":"Settings management","向界面提供经过脱敏的分层设置，并将修改写入用户层。":"Serves redacted, layered settings to the UI and writes changes to the user layer.","工作区入口":"Workspace entry point","处理工作区命令，连接恢复后仍可向客户端交付工作区状态。":"Handles workspace commands and delivers workspace state across reconnects.","目录选择入口":"Directory selection entry","将目录选择能力暴露给客户端，处理取消、能力检查和结构化错误。":"Exposes directory selection to clients, including cancellation, capability checks, and structured errors.","运行规则检查":"Runtime invariant checks","集中管理由各个包声明的运行规则检查，保留失败所属的包和执行范围。":"Coordinates package-owned runtime checks and preserves the package and execution scope responsible for a failure.","运行时类型目录":"Runtime type registry","插件登记类型与反射信息，网关在调用边界读取描述符和对应服务。":"Plugins register types and reflection metadata. The gateway reads descriptors and service providers at invocation boundaries.","远程调用网关":"Remote invocation gateway","把生成的远程接口描述与运行中的 Cordis 服务关联，分发单次远程调用。":"Associates generated remote descriptors with live Cordis services and dispatches unary remote calls.","会话持久化":"Session persistence","把会话事件交给持久化后端。JSONL 实现按会话保存记录；内存中提交和磁盘刷写有各自边界。":"Passes session events to a durable backend. The JSONL implementation stores one artifact per session; memory commits and disk flushes have separate boundaries.","分层设置":"Layered settings","插件注册设置结构并解析分层配置，具体提供方负责保存原始文档。":"Plugins register setting schemas and resolve layered values. Providers store the raw settings document.","子任务模型偏好":"Child-model preference","维护默认关闭的模型选择设置；委派工具创建新顶层会话时读取它。":"Owns default-off model-selection settings sampled when delegation tools compose a new top-level session.","凭据读取":"Credential access","配置保存密钥引用，提供方保管密钥值。消费者每次操作重新解析，让轮换后的凭据用于下一次请求。":"Configuration holds secret references; providers own their values. Consumers resolve them per operation so rotation affects the next request.","凭据授权流程":"Credential authorization","插件登记获取凭据的授权流程；接口管理交互过程与同一键的一次尝试生命周期。":"Plugins register credential-acquisition flows. This service owns the conversation and one-attempt-per-key lifecycle.","会话遥测":"Session telemetry","捕获并脱敏会话记录，再交给一个遥测后端，输出会离开当前进程。":"Captures and redacts session records, then sends them to one telemetry backend outside the process.","通用存储":"General storage","按名称注册多个存储后端，为非会话数据提供底层存储单元。":"Registers named backends that provide low-level storage units for non-session data.","业务数据存储":"Domain storage","等待配置的存储后端就绪，再提供带类型的持久化业务数据服务。":"Waits for configured backends, then provides typed, durable domain-data operations.","回复反馈":"Response feedback","保存针对助手消息的本地反馈，校验目标和生命周期；不把反馈写进会话历史或遥测。":"Stores local feedback for assistant messages with target and lifecycle validation, outside session history and telemetry.","工作区目录":"Workspace registry","基于业务存储管理工作区实体，使用稳定的会话编号关联远程调用与界面。":"Manages workspace entities over domain storage and uses stable session identifiers for remote and UI projections.","会话检索":"Session search","读取历史、过滤、追踪和搜索。具体后端还负责全文检索、排序、摘要片段与游标。":"Provides history reads, filters, traces, and search. Backends also handle full-text ranking, snippets, and cursors.","文件引用发现":"File-reference discovery","只返回 Agent 工作目录中的候选路径，不读取文件内容；提供方负责路径访问与排序。":"Returns candidate paths in an agent's working directory without reading file contents. Providers own access and ranking.","跨会话引用":"Cross-session references","把其他会话当前可见的对话整理为有大小限制的快照，以不可信消息上下文的形式保存。":"Creates bounded snapshots of another session's current conversation and stores them as untrusted message context.","会话标题":"Session title","提供确定性的备用标题，并可接入一个异步标题生成提供方。":"Provides a deterministic fallback title and can register one asynchronous title provider.","提示词组装":"Prompt assembly","在每一步收集提示词片段和模型可见的工具定义。新的工具或限制变化可影响下一次组装。":"Collects prompt sections and model-visible tool schemas before every step. Tool registrations and restrictions can affect the next assembly.","工具执行管线":"Tool execution pipeline","登记工具、决定模型看到的调用形式，并依次处理前置策略、守卫、执行包装、后置策略和最终结果观察。":"Registers tools, controls their model-facing form, and routes execution through pre-policy, guards, wrappers, post-policy, and final-result observation.","向用户提问":"Ask the user","工具通过统一的 ask() 等待用户回答，实际交互由界面侧提供方负责。":"Tools await human answers through a common ask() promise. The UI supplies the actual interaction provider.","计划模式":"Plan mode","从日志还原计划模式，在轮次边界应用用户选择，并保持退出计划的工具结构稳定。":"Folds plan state from the log, applies user choices at turn boundaries, and keeps the plan-exit schema stable.","Agent 预设":"Agent presets","发现预设目录，在创建 Agent 时将一份 cordis.yml 挂载到该 Agent 的作用域。":"Discovers presets and mounts a cordis.yml composition inside the agent's scope during creation.","用户命令":"Human commands","登记由人直接调用的命令；这些命令调用无需先发送给模型。":"Registers commands people invoke directly, without first sending the invocation to the model.","会话状态投影":"Session state projections","从事件折叠出界面需要的状态，按会话维护进度，并推送变化。":"Folds events into UI state, tracks per-session watermarks, and pushes changes to clients.","会话状态缓存":"Projection cache","定期保存状态投影；冷读取使用缓存加后续日志，避免每次列出会话都载入完整历史。":"Checkpoints state projections. Cold reads combine cached state with the log tail instead of loading the complete history.","技能目录":"Skills","合并多个提供方的技能目录，由工具展示目录并按需载入完整技能正文。":"Merges provider catalogs. Tools present the catalog and load full skill bodies on demand.","Agent 生命周期":"Agent lifecycle","管理运行中的 Agent、创建与恢复入口，以及进程内的调用发起者身份。":"Owns live agents, creation and resumption entry points, and process-local initiator identity.","默认模型":"Default model","通过分层设置统一默认模型，让直接调用和主机入口共享同一状态来源。":"Uses layered settings to share a default model selection across direct and host-backed agent entry points.","主执行循环":"Main execution loop","组装具体的执行循环。扩展包依赖 Agent 的事件与服务，无需依赖这个循环实现包。":"Composes the concrete execution loop. Extensions depend on agent events and services rather than this implementation package.","持续目标":"Persistent goals","从会话日志还原带版本的目标；持续执行的激活状态保留在当前进程。":"Folds revisioned goals from the session log. Continuation activation stays local to the running process.","云端运行环境":"Cloud runtime","共享一个 E2B 句柄、远端工作目录和结束策略，让文件与进程提供方使用同一个 Linux 环境。":"Shares an E2B handle, remote directory, and disposal policy so file and process providers use the same Linux environment.","进程启动":"Process spawning","统一管理进程位置、输入输出、进程树生命周期、终端机制与终止升级。":"Owns process coordinates, input and output, process-tree lifetimes, terminal mechanics, and termination escalation.","命令执行":"Shell execution","上层工具提交命令，执行器决定如何运行。可在本地 Bash、受限 Bash 和 PowerShell 实现间选择。":"Tools submit commands; executors decide how to run them. Implementations include local Bash, sandboxed Bash, and PowerShell.","命令环境":"Shell environment","收集一次执行所需的可信 DSH_* 环境信息，由执行器重建这组环境变量。":"Collects a trusted DSH_* environment snapshot for one execution. The executor reconstructs this namespace.","持续终端":"Persistent terminals","按 Agent 管理持续存在的终端会话及清理，后端负责具体终端机制。":"Manages agent-owned terminal sessions and cleanup. Backends implement terminal mechanics.","进程隔离":"Process sandbox","接收即将执行的准确 argv，按本次策略包装命令并报告隔离是否真正生效。":"Accepts the exact argv about to run, wraps it under the per-call policy, and reports whether enforcement is active.","隔离策略":"Sandbox policy","统一保存默认隔离模式和工作区根目录，让文件与命令执行使用一致的限制边界。":"Owns the default isolation mode and workspace root so filesystem and command execution share the same boundary.","人工批准":"Human approval","通过 approval/request 依次寻找答复者，处理单次权限决定；没有答复者时返回 unavailable。":"Dispatches one-shot permission decisions through approval/request. If no answerer is available, it returns unavailable.","权限预设":"Permission presets","将隔离模式和批准策略组合为用户可选的权限预设，切换时写入相关事件。":"Combines sandbox mode and approval policy into user-facing presets and writes the associated events when switching.","程序化工具调用":"Programmatic tool calling","运行模型编写的程序，并提供主机侧异步工具绑定。PTC 模式通过它执行程序化工具调用。":"Runs a model-written program with host-provided async bindings. PTC mode uses it to execute programmatic tool calls.","文件系统":"Filesystem","工具通过统一接口读、写、编辑文件。提供方决定访问本地、受限文件系统或云端文件系统。":"Tools read, write, and edit through one interface. Providers choose local, sandboxed, or cloud filesystem access.","上下文压缩":"Context compaction","基础实现响应步骤后的上下文压力及请求错误恢复事件，必要时整理模型可见内容；没有面向模型的 compact 工具。":"The basic implementation responds to post-step pressure and request-error recovery, condensing model-visible context when needed. There is no model-facing compact tool.","子任务委派":"Delegation","提供方负责不同委派通道，服务还管理可选的持续子任务；一次委派和可继续对话有各自生命周期。":"Providers implement delegation transports. The service also manages optional continuations, with separate lifecycles for one-shot and continuable delegation.","多 Agent 协作":"Agent teams","实验功能：管理成员、持久化消息、共享任务依赖图及可继续运行的子 Agent。":"Experimental coordination for members, durable messages, shared task dependencies, and continuable child agents.","运行时检查":"Runtime inspection","提供运行时观察、Cordis 树查询和 Worker 承载的 CDP 目标。官方表中 owner 未附路径链接；这里仅保留文档入口。":"Provides runtime observation, Cordis-tree queries, and a Worker-hosted CDP target. The official owner has no package link in the table; this viewer preserves the documentation entry.","后台任务":"Background jobs","登记后台命令、终端发送和子任务委派等运行工作，模型可通过控制工具查看和终止。":"Registers background commands, terminal sends, and delegated work. Model-facing tools can inspect and terminate these jobs.","网页搜索与读取":"Web search and fetch","在同一个接口中登记搜索与网页读取提供方，上层工具保持稳定的模型调用名称。":"Registers search and fetch providers under one service, while tools retain stable model-facing names.","长结果外存":"Oversized-result storage","保存过长的工具文本并返回定位符和读取提示；是否外存由 tools/post-execute 阶段的策略决定。":"Stores long tool text and returns a locator and retrieval hint. A tools/post-execute policy decides when to spill.","选择工作目录":"Working-directory picker","可调用主机的系统目录选择器，也可提供应用内浏览所需的列目录和创建目录能力。":"Uses a host-native directory chooser or provides listing and creation primitives for an in-app browser.","网页服务":"Web server","提供 HTTP 路由登记、页面转换及静态页面回退，传输插件自行注册路由。":"Registers HTTP routes, page transforms, and static fallbacks. Transport plugins register their own routes.","客户端插件":"Client plugins","扫描并组装客户端插件入口图，提供插件包并通知重新构建或依赖变化。":"Scans and composes the client plugin entry graph, serves bundles, and notifies rebuild or dependency-graph changes.","工作流引擎":"Workflow engine","运行工作流脚本，脚本中的 agent() 通过子任务服务分发；每个上下文使用一个引擎。":"Runs scripts whose agent() calls delegate through subagents. Each context has one engine.","外部事件入口":"External event entry","接收已验证的外部事件，执行可信插件规则，并将结果转换为关联工作区的普通会话。":"Accepts authenticated deliveries, runs trusted plugin rules, and creates ordinary workspace-backed sessions.","代码导航":"Code navigation","提供四类标准化代码导航操作，后端将请求转换到具体语言服务器协议。":"Exposes four normalized code-navigation operations. Backends translate them into language-server requests and results.","动态插件运行":"Dynamic plugin execution","管理内存中的插件定义及主机侧 vm 执行环境，完成动态插件运行请求。":"Owns in-memory plugin definitions and the host-side VM environment for dynamic plugin requests.","动态插件检查":"Dynamic plugin inspection","登记主机检查提供方，镜像客户端检查目录，并路由客户端查询。":"Registers host inspect providers, mirrors client inspect catalogs, and routes client queries.","这里展示的是此提交中的接口职责与官方列出的直接消费者。静态依赖不表示每次任务都会调用它；实际参与情况取决于配置、插件及任务路径。":"This view shows the service contract and direct consumers listed at the pinned commit. Static dependencies do not mean every task invokes a service; participation depends on configuration, plugins, and the execution path.","执行循环和上下文压缩都使用这个接口。选择提供方不能自动证明模型能力、速度或成本发生了怎样的变化。":"The execution loop and context compaction both use this interface. Selecting a provider alone does not establish a change in model capability, speed, or cost.","扩展字段的交付状态在 HTTP 接受后提交；模型适配器的请求构造有自己的提交边界。":"Extension delivery state is committed after HTTP acceptance. The adapter has its own request-construction and delivery boundaries.","SessionEvent 使用 type、seq、time、data。持久化日志与当前消息 surface 分开维护，替换 surface 无需删除旧事件。":"SessionEvent uses type, seq, time, and data. The durable log and current message surface are maintained separately; replacing the surface does not require deleting earlier events.","session/event 是提交后的观察通知；session/flush 是等待各监听方完成的持久化检查点。不要把每次日志追加都画成一次同步磁盘写。":"session/event is a post-commit observation feed; session/flush is an awaited durability checkpoint. A log append should not be drawn as a synchronous disk write.","当前页面只展示职责与连接关系，不接受 API Key，不发起模型调用。":"This page shows responsibilities and connections only. It does not accept API keys or make model calls.","导出遥测与恢复会话有不同职责。当前网页不接入遥测后台，也不上传导入的日志。":"Telemetry export and session restoration have distinct roles. This page does not connect to telemetry services or upload imported logs.","preStep() 先 assemble()，再执行 agent/pre-step 的 waterfall。组装发生在每个 step 前。":"preStep() calls assemble() before the agent/pre-step waterfall. Assembly happens before each step.","执行可以重叠；前置策略、结果写入和附加上下文保持模型顺序。exclusive 调用形成屏障，parallel 调用进入有上限的滚动池。":"Dispatches may overlap; pre-policy, result commits, and additional context remain model-ordered. Exclusive calls form barriers; parallel calls enter a bounded rolling pool.","按 Agent 挂载预设；声明到 root service realm 的错误组合会被拒绝。":"Presets are mounted per agent. Invalid compositions that publish into the root service realm are rejected.","turn() 包含多个 step()。正常完成时没有工具调用会结束这一轮；有工具调用时执行工具，再进入下一步。异常、取消和 token 上限有独立结束原因。":"A turn() contains multiple step() calls. Normal completion without new tool calls ends the turn. Tool calls run before the next step. Errors, cancellation, and token limits have distinct outcomes.","持久化目标状态和进程内继续执行状态是两个层面。":"Durable goal state and process-local continuation state are separate layers.","文件隔离和 Bash 隔离共同使用该策略服务，避免各自认定不同的工作区根目录。":"Filesystem and Bash isolation share this policy service so they agree on the workspace root.","批准支持缺失时，ask 不能变成默认放行。批准与隔离分工不同，获得批准也不等于后端没有限制。":"Missing approval support must not turn ask into a default allow. Approval and isolation have distinct roles; approval does not remove backend restrictions.","tools 管理 PTC 的模型可见形式；codeRuntime 负责运行程序。程序内部的子调用和顶层工具结果属于不同记录。":"Tools owns the model-facing PTC form; codeRuntime runs the program. Nested dispatches and the top-level tool result are separate records.","fs-observation-policy 通过 fs/* 事件关卡加入已观察状态检查。更换提供方需要处理配置、生命周期和同一运行环境的约束。":"fs-observation-policy adds observed-state checks through fs/* event gates. Switching a provider also requires compatible configuration, lifecycles, and execution environments.","压缩属于条件分支。页面中的压缩场景用于解释机制，演示比例和播放时长均不代表真实 token 或耗时。":"Compaction is a conditional branch. The example explains the mechanism; its proportions and playback timing are not real token measurements or latency.","spawn、fork 和外部进程提供方不能简单视为同一种隔离。父子会话、继承前缀与继续执行需要分别表达。":"Spawn, fork, and out-of-process providers offer different isolation. Parent/child sessions, inherited prefixes, and continuations need separate treatment.","官方 owner 包含 experimental 前缀。界面保留实验标识，不将其视为稳定的全局基础能力。":"The owner package is explicitly experimental. This UI preserves that status rather than presenting it as a stable global primitive.","此目录记录了官方文档中的服务；本项目没有假定其存在一个已验证的公共插件路径。":"This entry comes from the official table. The viewer does not assume an independently verified public plugin path exists.","外存后的模型可见内容通常是预览和定位提示。完整内容的保存与上下文内的摘要需要分别呈现。":"After spilling, model-visible content is typically a preview and locator. Full-content storage and in-context summaries need separate views.","交互与入口":"Interaction & entry","上下文与记忆":"Context & memory","调度与模型":"Models & orchestration","权限与边界":"Permissions & boundaries","工具与执行":"Tools & execution","记录与扩展":"History & extensions","任务从哪里进入":"Where tasks enter","模型能看到什么":"What the model can see","决定下一步做什么":"Deciding the next action","哪些操作可以执行":"What may be executed","让动作真正发生":"Making actions happen","保存过程，支持扩展":"Saving history and extending the system","一句话，进入工作区":"A request enters the workspace","为任务装配 Agent":"Compose an agent for the task","打开这一轮的记录":"Open this turn's log","把模型能看的东西准备好":"Assemble model-visible context","模型收到一次完整请求":"Send a complete request to the model","模型提出工具调用":"The model proposes tool calls","执行前，先过检查":"Run checks before execution","接口不变，文件后端可以换":"One interface, different file backends","并行执行，按顺序写回":"Run concurrently, commit in order","带着结果，再问一次模型":"Ask the model again with the results","在允许的范围内修改":"Edit within the allowed boundary","启动测试进程":"Start the test process","处理工具返回的内容":"Process tool results","模型给出最终答复":"The model produces a final answer","这一轮，正式结束":"Close this turn","留下可读取的过程":"Keep a readable history","请求人工批准":"Request human approval","拒绝留在结果里":"Record the denial in the result","上下文出现压力":"Context pressure increases","替换模型看到的内容":"Replace the model-visible surface","重新构造请求":"Rebuild the request","把一部分工作交给子任务":"Delegate part of the task","子任务运行自己的循环":"The child runs its own loop","把子任务结果带回主任务":"Return the child's findings","把多次工具调用写成程序":"Put several tool calls in one program","入口和执行分开：换一个客户端，不必重新实现全部工具。":"Entry and execution are separate: changing clients does not require reimplementing every tool.","同一个主循环，可以搭配不同的工具和运行环境。":"The same loop can be composed with different tools and execution environments.","轮次 turn 和步骤 step 是两层边界，网页会分别标出来。":"Turn and step are distinct boundaries, shown separately in this viewer.","工具列表会重新组装，因此插件变化可以影响后续步骤。":"Tool schemas are assembled again, so plugin changes can affect later steps.","LLM 接口可以换实现；协议转换留在适配器这一侧。":"The LLM implementation is replaceable; protocol translation stays in the adapter.","模型提出调用，工具管线随后决定是否执行。":"The model proposes a call; the tool pipeline then decides whether it runs.","ask 缺少批准支持时会转为拒绝，不能当作已经获得授权。":"Without approval support, ask resolves to denial rather than implicit authorization.","点击右侧的提供方，可以观察哪些职责保持不变。":"Select a provider on the right to inspect the stable interface responsibilities.","“完成了”和“写入会话了”是两件事。":"Finishing execution and committing to the session are different events.","消息历史不会等同于一张不变的大字符串。":"Message history is not a single unchanging string.","此处展示一个允许修改的教学分支，实际权限由部署和提供方决定。":"This example follows an allowed-edit branch; actual permissions depend on deployment and providers.","shell 管“怎样执行命令”，subprocess 管进程与输入输出，sandbox 管隔离包装。":"Shell handles command execution, subprocess handles processes and I/O, and sandbox handles isolation wrapping.","过长结果可以由策略保存到外部存储，模型接收预览和定位提示。":"A policy may spill oversized output, leaving a preview and retrieval hint for the model.","普通完成、token 上限、取消、错误分别保留自己的结束原因。":"Completion, token limits, cancellation, and errors preserve distinct end reasons.","收尾也有明确边界，出错时仍需要记录发生了什么。":"Finalization has a boundary too; failures still need a recorded outcome.","右侧“运行记录”可以载入 SessionEvent 数据；动画本身没有调用 DSH。":"The Run logs tab can load SessionEvent data. The animation itself does not invoke DSH.","没有答复者也不会默许，接口会返回 unavailable。":"With no answerer, the interface returns unavailable instead of implicitly allowing the call.","下方执行层保持熄灭，表示这一分支没有执行工具本体。":"The execution layer stays inactive because this branch never dispatches the tool body.","界面中的条形长度用于解释，未读取真实 token 数。":"Bar lengths are illustrative; they do not reflect measured token counts.","当前上下文变短，追加式日志继续保留历史。":"The current context gets shorter while the append-only log retains its history.","压缩与重试都有触发条件，每次任务的实际路径可能不同。":"Compaction and retry have specific triggers; the actual path differs between tasks.","父任务与子任务有各自的生命周期，子任务内部也有模型—工具循环。":"Parent and child have separate lifecycles. A child also runs a model–tool loop.","进程内、外部进程和远端通道的隔离条件不同，不能只凭一个“子 Agent”标签判断。":"In-process, external-process, and remote providers have different isolation properties.","委派结果和完整子会话轨迹需要分开查看。":"The delegation result and full child-session trace should be inspected separately.","程序内部调用的记录与顶层返回值分层展示，避免把它们当成平铺的独立模型调用。":"Nested calls and the top-level return value are shown separately, rather than as independent model calls.","用户提交任务，会话入口找到对应工作区和 Agent。界面、命令行等入口可以不同，随后进入会话与 Agent 的执行流程。":"The session entry point associates the submitted task with a workspace and agent. Different clients feed the same session and agent lifecycle.","创建或恢复 Agent，按会话预设挂载插件。工具、提示词和具体提供方由配置决定。":"Create or resume an agent and mount its session preset. Configuration determines the tools, prompts, and providers.","执行循环写入 turn/start。一个用户任务可以经历多个 step，每一步对应一次模型交互和随后的工具处理。":"The loop records turn/start. A task can span multiple steps, each with model interaction and subsequent tool handling.","每一步重新收集提示词片段与可见工具定义，再经过 agent/pre-step 检查。这里使用本次任务需要的上下文。":"Each step collects prompt sections and visible tool schemas again, then runs agent/pre-step checks using this task's context.","执行循环派生当前消息，调用已准备的适配器，或走统一 llm.stream()。适配器负责模型协议和流式回复。":"The loop derives current messages and invokes a prepared adapter or the shared llm.stream(). The adapter owns provider protocol and streaming.","助手消息先写入会话。模型提出读取源码和测试文件的操作，执行循环将它们交给工具调度器。":"The assistant message is committed first. Its proposed reads are then passed to the tool scheduler.","工具调用依次经过前置策略与守卫。策略可能允许、拒绝或请求人工批准，然后才进入执行包装和工具本体。":"Calls pass pre-policy and guards before execution wrappers and the tool body. Policy can allow, deny, or ask for human approval.","文件工具调用 ctx.fs，实际提供方读取文件。此教学场景选择 fs-local；沙箱和云端实现也在官方表中。":"The file tool calls ctx.fs and its provider reads the file. This example uses fs-local; sandboxed and cloud implementations are also listed.","支持并行的调用进入有上限的滚动池，结果按模型给出的调用顺序提交。后完成的前序调用，会让后序结果等待写回。":"Parallel calls enter a bounded rolling pool. Results commit in model order, so a later result may wait for an earlier call to finish.","工具结果写入会话，附加上下文进入下一步的收件箱。循环重新组装提示词，再让模型根据读到的内容决定后续动作。":"Results enter the session and additional context enters the next-step inbox. The loop assembles a new prompt so the model can choose the next action.","此场景假设修改得到策略允许。工具通过文件接口写入；受限提供方还会检查工作区边界，观察策略可以参与文件事件检查。":"This scenario assumes policy allows the edit. The file provider writes it; a confining provider also checks the workspace boundary, and observation policy can add event-gate checks.","命令工具使用 shell，执行器再通过 subprocess 启动进程。受限执行器还会使用 sandbox 及共享的隔离策略。":"The command tool calls shell, whose executor uses subprocess. Sandboxed executors also use sandbox and a shared isolation policy.","执行包装返回标准化结果，后置策略可以接受、替换、补充或阻断结果。最终结果观察使用冻结后的快照。":"Execution wrappers return normalized results. Post-policy can accept, replace, enrich, or block them. Final observers receive a frozen snapshot.","工具结果再次进入模型请求。助手正常完成且没有新的工具调用时，这一步返回 completed。":"Results enter another model request. If the assistant completes without further tool calls, the step returns completed.","执行循环在 finally 中写入 turn/end，保存本轮的结束原因。仍有排队输入时，可以继续打开下一轮。":"The loop writes turn/end in finally, recording the outcome. Queued input can open another turn.","会话提交后的 session/event 可被持久化插件观察；session/flush 等待各持久化监听方完成。写入事件贯穿全程，刷写是另一个检查点。":"Persistence plugins observe post-commit session/event notifications. session/flush awaits durability listeners. Events are appended throughout; flushing is a separate checkpoint.","前置策略返回 ask，批准接口寻找一次性答复。此教学分支选择“拒绝”。":"Pre-policy returns ask and the approval interface seeks a one-shot answer. This example chooses Deny.","未获允许的工具不进入实际文件或进程操作。调用以相应结果结束，模型可以解释限制或选择其他可用路径。":"A denied tool never performs the file or process operation. The model receives the outcome and can explain the restriction or choose another path.","压缩基础实现响应步骤后的压力或请求错误恢复。先考虑裁剪过大的工具结果，再在需要时进行摘要压缩。":"The basic compaction implementation reacts to post-step pressure or request-error recovery. It considers pruning oversized tool results before summary compaction.","压缩生成新的可见内容，并通过消息 surface 的替换机制记录。旧日志保留，因此仍能追溯被替代的来源事件。":"Compaction creates new model-visible content using surface replacement. Earlier log events remain available for provenance.","请求错误处理器可以返回 retry，让循环重新构造请求。未经恢复的错误会保留结构化失败信息。":"A request-error handler can return retry so the loop rebuilds the request. Unrecovered errors preserve structured failure details.","委派工具选择提供方：进程内 spawn、fork 或外部 Agent 通道。此场景演示 spawn，创建子任务的独立会话。":"The delegation tool selects a provider such as in-process spawn, fork, or an external agent. This example uses spawn to create a separate child session.","子任务加载自己的组合并执行工作。可继续的委派与一次性委派有不同控制方式；页面用第二条小轨道帮助区分。":"The child loads its own composition and runs its work. One-shot and continuable delegation have different controls; a second track identifies the child.","结果回到委派工具，再经过主任务的工具结果处理。主任务继续自己的下一步，不会自动把子会话的全部事件当成普通消息合并。":"Findings return through the parent's tool-result pipeline. The parent continues its next step without automatically merging every child event into normal messages.","在 PTC 模式中，tools 负责模型可见的调用形式，codeRuntime 运行程序，并通过主机绑定调用其他工具。":"In PTC mode, tools owns the model-facing invocation form. codeRuntime runs the program, which reaches other tools through host bindings.","跳到文字说明": lated services · select to inspect","← 上一个":"← Previous","下一个 →":"Next →","导出阅读位置":"Export reading position","按":"Press","搜索":"to search","切换剖面":"to toggle focus","复位":"to reset","静态关系依据官方表 · 源码固定到一个提交":"Static relationships from the official table · source pinned to one commit","尚未载入会话记录":"No session log loaded","文件只在此浏览器页面内读取；切换到任务导览可以查看教学流程。":"Files are read in this browser tab only. Switch to Task journey to explore a teaching scenario.","导入日志":"Import a log","下载教学样本":"Download demo sample","支持单会话标准化事件 · 最大 8 MiB / 20,000 条":"Standardized events from one session · up to 8 MiB / 20,000 events","不上传、不执行、不重建会话":"No uploads, execution, or session reconstruction","上一步":"Previous step","下一步":"Next step","播放":"Play","暂停":"Pause","记录回放":"Log playback","源码导览":"Guided demo","教学播放速度":"Demo playback speed","选择步骤":"Select a step","拖动查看步骤":"Scrub through steps","按文件顺序呈现原始事件":"Original events in file order","教学播放速度，不代表真实运行耗时":"Demo timing; not measured execution latency","不推测未记录的调用":"Unrecorded calls are not inferred","亮起的连接仅属于当前讲解步骤":"Highlighted routes belong to this teaching step","← → 切换步骤":"← → Change step","SPACE 播放 / 暂停":"SPACE Play / pause","教学样本":"Demo sample","本地日志":"Local log","静态结构":"Static structure","调用方、接口、实现方，各就其位。":"Consumers, interface, implementations. Each in its place.","定位日志相关服务；未记录的调用不会补画。":"Find related services. Unrecorded calls are never filled in.","完成顺序":"Finished","写回顺序":"Committed","示例上下文压力":"Example pressure","原始日志保留":"Original log retained","独立子会话":"Separate child session","写入工具未执行 · 原文件未变":"Write did not run · original unchanged","当前浏览器的图形画布不可用，已切换为文字组件视图。全部导览、搜索、源码和日志功能仍可使用。":"Graphics are unavailable, so the text component view is active. Journey, search, source, and log features remain available.","此服务已收入图鉴；当前五个教学场景没有展开它的运行分支。":"This service is in the atlas, but its runtime branch is not covered by the five current scenarios.","关闭":"Close","继续探索":"Keep exploring","开始探索":"Start exploring","以下文件是本页编写的教学样本，不会读取或修改你的本地文件。":"These files are teaching fixtures created for this page. Your local files are not read or modified.","程序流程示意":"Program sketch","返回任务":"Back to the task","每种能力，":"Every capability","都有自己的模样。":"has its own identity.","轮廓区分组件类型，顶面图标表达职责，短标记区分具体服务。悬停显示名称，点击查看说明。":"Silhouettes distinguish component families, top-face icons describe their purpose, and short marks identify individual services. Hover for a name; click for details.","连线怎样阅读":"How to read the connections","任务导览中的箭头表示当前示例数据的传递方向。剖面中的实线表示消费与实现关系；声明包使用虚线。它们均附方向箭头。":"Journey arrows show the example data transfer direction. In Focus, solid lines show consumption and implementation relationships; the declaration link is dashed. All carry arrowheads.","灰色地面网格和层板轮廓仅用于空间定位。颜色沿用六个阅读分组，不表示官方固定执行层级。":"The ground grid and plate outlines are spatial guides. Colors indicate six reading groups, not an official fixed execution hierarchy.","组件图例":"Component key","当前传递方向":"Transfer direction","提示词已复制":"Prompt copied","浏览器未开放剪贴板，请选中文本后复制。":"Clipboard access is unavailable. Select the text and copy it manually.","切换亮色主题":"Switch to light theme","切换暗色主题":"Switch to dark theme","无已列出的直接消费者":"No listed direct consumers","核心服务 / 按插件扩展":"Core service / plugin extensions","具体循环组合":"Concrete loop composition","由运行时提供方或监听器接入":"Runtime provider or listener","视角已复位":"Camera reset","已从页面内存清除日志":"Log cleared from this tab's memory","这是官方列出的消费包。完整名单在右侧“源码”中。":"This consumer is listed in the official catalog. The full list is in the Source panel.","声明包定义这项服务的接口与职责。":"The declaring package defines this service contract and responsibilities.","已导出阅读位置，不包含导入的日志。":"Reading position exported. Imported logs are not included.","[嵌套过深，显示已折叠]":"[Deep nesting collapsed]","[已遮盖]":"[Redacted]","文件超过 8 MiB，请先导出更小的单会话片段。":"File exceeds 8 MiB. Export a smaller single-session excerpt first.","文件内容为空。":"The file is empty.","File mutation · 条件允许":"File mutation · allowed branch","条件分支：上下文压力":"Conditional branch: context pressure","Child session · 教学展开":"Child session · teaching view","把系统打开。":"Open the system.","让复杂性变得可读。":"Make complexity readable.","DSH Inside 是基于 DeepSeek Harness 官方源码制作的独立交互式导览。用逐步展开的任务流程与单服务剖面，代替默认展示所有连接。":"DSH Inside is an independent interactive guide based on the official DeepSeek Harness source. It reveals one task or one service at a time, keeping unrelated connections out of the way.","官方表中的服务":"Services in the official table","标为 seam 的接口":"Interfaces classified as seams","教学任务场景":"Teaching scenarios","证据与范围":"Evidence and scope","服务名称、角色、声明包、实现方及直接消费者来自 capability-seams.md。任务主链核对了 agent-loop、tools 和 session 的关键源码。六层空间分组、中文讲解、任务示例和播放速度为本项目设计。":"Service names, roles, owners, implementations, and consumers come from capability-seams.md. The task path follows key agent-loop, tools, and session code. Spatial groups, explanations, fixtures, and playback timing are designed for this viewer.","教学动画没有真实模型输出或性能测量。提供方切换仅改变结构示意。日志模式展示本地导入的事件，不代表拥有全部 seam 的实测调用轨迹，也不尝试恢复会话。":"Teaching animations contain no real model outputs or performance measurements. Provider selection changes the structural preview only. Log mode shows imported events without claiming complete seam traces or reconstructing sessions.","固定源码版本":"Pinned source version","提交时间：2026-09-04 09:16 UTC · 整理日期：2026-09-05":"Commit: 2026-09-04 09:16 UTC · Prepared: 2026-09-05","70 个服务的职责、角色、声明与实现":"Roles, owners, and implementations of 70 services","turn / step / request / tool-call 主执行链":"The turn / step / request / tool-call execution path","并行调度、屏障与按序写回":"Concurrent scheduling, barriers, and ordered commits","前置、执行包装、后置、最终结果事件":"Pre-policy, wrappers, post-policy, and final-result events","追加式会话、事件观察与刷写检查点":"Append-only sessions, observation, and flush checkpoints","SessionEvent 与 surface 元数据":"SessionEvent and surface metadata","本项目与 DeepSeek 官方无隶属关系。网页无需外部字体、脚本或模型密钥；只有主动打开源码链接时才访问 GitHub。":"This project is not affiliated with DeepSeek. It needs no external fonts, scripts, or model keys. GitHub is contacted only when you open a source link.","先看一次任务。":"Follow one task.","再拆开一个接口。":"Then inspect one interface.","01 / 任务导览":"01 / Task journey","选择场景并播放，跟随亮起的组件。拖动底部时间轴回到任一步；切换“源码”查看该步骤的代码依据。播放速度仅用于讲解。":"Choose a scenario and follow the highlighted components. Scrub the bottom timeline to any step; open Source for the supporting code. Playback timing is illustrative.","02 / 接口图鉴":"02 / Seam atlas","搜索中文、ctx key 或包名。在“剖面”中，左侧展示消费者、中心展示接口、右侧展示实现方。点击提供方只切换结构示意，不改变真实配置。":"Search by Chinese or English name, ctx key, or package. Focus puts consumers on the left, the interface in the center, and implementations on the right. Provider selection changes only the preview.","03 / 运行记录":"03 / Run logs","载入标准化的 SessionEvent。文件留在当前页面内存中，不上传、不自动保存。未知事件继续显示并提示解释限制。":"Load standardized SessionEvent data. Files remain in tab memory and are neither uploaded nor saved automatically. Unknown events stay visible with interpretation warnings.","3D 操作":"3D controls","拖动旋转，滚轮缩放，触屏双指缩放；点击小组件查看职责。“展开层级”调整六层的间距，“⊞”切换俯视，“↺”恢复初始视角。":"Drag to rotate, scroll or pinch to zoom, and click a component for details. Layer spacing separates the six groups. Use ⊞ for top view and ↺ to reset the camera.","播放 / 暂停":"Play / pause","前后步骤 / 前后服务":"Previous / next step or service","搜索接口":"Search services","总览 / 单接口剖面":"Overview / service focus","关闭说明 / 返回总览":"Close help / return to overview","可点击“减少动态”。没有 WebGL 时自动使用 Canvas 软件三维渲染；两种画布均不可用时提供文字视图。":"Use Reduce motion for a quieter view. If WebGL is unavailable, Canvas software 3D is used. A text view is available if neither graphics backend works.","这次，看看":"This time, explore","你的任务记录。":"your own task log.","在本地读取一个会话的事件文件。":"Read one session's event file locally.","保留原文，按文件顺序查看。":"Keep raw records and browse them in file order.","拖入 JSON / JSONL":"Drop JSON / JSONL","或点击选择文件":"or click to choose a file","选择日志文件":"Choose log file","支持标准化 SessionEvent 数据。":"Standardized SessionEvent data supported.","最大 8 MiB / 20,000 条。":"Up to 8 MiB / 20,000 events.","无需 API Key，文件不上传。":"No API key; files are not uploaded.","下载带标识的教学样本 ↗":"Download a labeled demo sample ↗","导入边界，先讲清楚。":"Know the import boundaries.","查看器接受一个会话的标准化事件数组、{ events: […] }，或一行一条事件的 JSONL。它验证外层结构，不校验每个插件事件的完整业务结构。":"The viewer accepts a single-session event array, { events: […] }, or event-per-line JSONL. It validates the outer envelope, not every plugin event's full business schema.","原始后端存储可能包含版本头、继承前缀或其他封装；出现不支持的结构时请先导出为上述事件形式。未知事件完整保留，不会默默丢弃。页面不会尝试恢复会话或推断未记录的 seam 调用。":"Raw backend storage may contain version headers, inherited prefixes, or other wrappers. Export unsupported formats into standardized events first. Unknown events are preserved. This page does not restore sessions or infer unrecorded seam calls.","日志可能含敏感内容。当前网页不发送任何日志网络请求；显示时会按字段名称遮盖常见密钥字段。重载或清除后，页面不保留导入记录。":"Logs may contain sensitive information. No log network requests are made; common secret fields are masked by name. Reloading or clearing removes the imported records from this tab.","教学样本仅供测试查看器，事件内容未经过完整 DSH schema 校验，不能用于恢复真实会话。":"The sample is for testing the viewer. Its event payloads are not fully validated against DSH schemas and cannot restore a real session.","事件未建立讲解映射，原文完整保留。":"events are unmapped; their raw records are retained.","包含未知的必需事件，无法据此重建会话；本页只作记录查看。":"Unknown required events prevent session reconstruction. This page only displays records.","载入其他文件":"Load another file","清除记录":"Clear log","事件列表显示当前位置附近的记录。底部滑块可以到达任意一条。":"The list shows records near the current position. Use the bottom slider to reach any event.","新一轮开始":"A new turn starts","会话记录了本轮开始的边界。":"The session records the start boundary of this turn.","这一轮结束":"The turn ends","查看原始 reason 字段，区分普通完成、错误、取消或其他结束原因。":"Inspect the raw reason field for completion, failure, cancellation, or another end reason.","步骤开始":"Step starts","这是会话中的步骤边界；具体工具与提供方需要更多事件才能判断。":"This is a session step boundary. More events are needed to identify tools and providers.","步骤结束":"Step ends","步骤结束已被记录，不等于整个用户任务已结束。":"The step has ended; the overall task may still be running.","用户消息进入日志":"User message committed","消息及其表面操作元数据按原样保留。":"The message and its surface-operation metadata are preserved as supplied.","助手消息进入日志":"Assistant message committed","这是一条已提交的助手消息。网页不从它推算所有模型请求或内部调用。":"This is a committed assistant message. The viewer does not infer all model requests or internal calls from it.","助手尝试记录":"Assistant attempt recorded","此类记录用于保存一次助手尝试，不能当作成功答复。":"This records an assistant attempt and should not be treated as a successful answer.","工具调用记录":"Tool call recorded","调用记录不保证工具本体已经执行。批准、守卫或取消仍可能改变结果。":"A call record does not guarantee the body ran. Approval, guards, or cancellation can still change the outcome.","工具结果记录":"Tool result recorded","原文保存这次调用的结果；页面不根据工具名称猜测具体文件或进程提供方。":"The record preserves the result. The viewer does not guess filesystem or process providers from the tool name.","程序内工具调用记录":"Nested program call recorded","这是 PTC 程序内部子调用的记录，与顶层工具结果分开阅读。":"This is a nested dispatch inside a PTC program, separate from the top-level tool result.","原始事件已保留。当前版本没有解释其语义，不推断它会改变哪些运行状态。":"The raw event is retained. Its semantics are not mapped in this version, so no state changes are inferred.","服务定位属于阅读辅助；本事件不证明一条完整的内部调用链。 此事件未标为 ignorable，不能据此重建会话。":"Service highlighting is a reading aid, not proof of a complete call chain. This event is not ignorable, so it cannot be used to reconstruct the session.","文件超过 8 MiB，请导出更小的片段。":"File exceeds 8 MiB. Export a smaller excerpt.","无法识别文件，请导入标准化 SessionEvent 数据。":"Unrecognized file. Import normalized SessionEvent data.","需要事件数组、{ events: […] } 或逐行 SessionEvent。":"Expected an event array, { events: […] }, or one SessionEvent per line.","文件没有可显示的事件。":"The file contains no events to display.","事件超过 20,000 条，请导出更小的单会话片段。":"More than 20,000 events. Export a smaller single-session excerpt.","检测到多个 sessionId。请分会话导出，避免把不同轨道拼成一条。":"Multiple sessionId values detected. Export sessions separately to keep their tracks distinct.","先把要办的事说清楚":"Start with a clear goal","本阶段只展示相关的服务及其输入、输出。":"This stage shows only the relevant services and their input and output.","亮起的组件参与当前教学阶段；箭头只显示标注的交接。":"Highlighted components participate in this teaching stage. Arrows show only the labeled hand-off.","我不会编程。请读 DSH 的官方介绍，用“收到任务 → 读资料 → 动手做 → 汇报结果”解释它怎么工作。再告诉我每一步由哪个源码包负责。不要修改文件。":"I do not code. Read the official DSH introduction and explain how it works as “receive a task → read information → act → report back”. Name the source package responsible for each part. Do not change files.","本页已准备好教学资料。接下来逐步展示处理过程，不会操作你的文件。":"The teaching materials are ready. Follow the steps without touching any of your files.","收到你的任务":"Task received","把工具箱交给模型":"Give the model its toolbox","选择 Standard；模型和工作区由宿主提供。":"Select Standard; the host supplies the model and workspace.","本轮工具目录包括读取、搜索、命令等工具；工具是否可执行还需经过策略。":"This step has read, search and shell tools. Actual execution still passes through policy.","Standard 预设已装配":"Standard preset composed","读官方资料，别凭空猜":"Read evidence rather than guess","read → README.md\nread → docs/capability-seams.md":"read → README.md\nread → docs/capability-seams.md","资料写明：Everything is a plugin。服务表分别列出声明包、实现方和消费者。":"The material says “Everything is a plugin”. The service table separates declarations, implementations and consumers.","正在读官方说明":"Reading the official description","给技术名词配上日常解释":"Translate technical terms into everyday roles","上下文：任务要求 + 官方节选 + 源码阅读地图。":"Context: the user request, official excerpts and source map.","Agent：处理任务的助手。\nTool：它能调用的具体动作。\nSeam：能力与具体实现之间的接口。\nSession：这次任务留下的记录。":"Agent: the assistant handling the task.\nTool: an action it can call.\nSeam: an interface between a capability and its implementation.\nSession: the record of this task.","模型正在组织解释":"The model is organizing the explanation","把答案与过程一并留下":"Keep the answer and its record","会话日志贯穿整个过程。持久化插件处理刷写；教学页面只在内存中播放。":"The session log spans the entire process. A persistence plugin handles flushing; this teaching page plays in memory only.","汇总已确认的结果，等待会话记录刷写。":"Collect confirmed results and wait for the session durability checkpoint.","DSH 像一个能调用工具的任务执行系统。\n\n1. 接收你的任务：会话入口找到 Agent。\n2. 准备资料：system-prompt 组装说明与工具目录。\n3. 模型提出动作：llm 对接模型；tools 调度工具。\n4. 完成后汇报：agent-loop 继续循环或结束；session 留下记录。\n\n源码入口：packages/core/{agent-loop,system-prompt,tools,session}。\n读取文件会用到 tool-fs 与 ctx.fs；具体存储实现可替换。":"DSH is a task execution system that can use tools.\n\n1. Receive the task: the session entry finds an Agent.\n2. Prepare context: system-prompt assembles guidance and the tool catalog.\n3. Propose an action: llm connects to a model; tools dispatches operations.\n4. Report back: agent-loop continues or ends; session keeps a record.\n\nSource entry points: packages/core/{agent-loop,system-prompt,tools,session}.\nFile reads use tool-fs and ctx.fs; the storage implementation can be replaced.","DSH 到底怎么帮我做事？":"How does DSH do things for me?","从官方自我介绍开始，不需要知道任何代码文件名。":"Start with the official introduction. No knowledge of source filenames required.","资料已放在本页：先点“看资料”，无需懂代码。":"Materials are included here. Open “Materials” first; no coding knowledge is needed.","入门":"Beginner","模型 + 工具":"Model + tools","一次任务的主循环":"The task loop","源码与日常语言对照":"Source-to-plain-language map","看见模型负责提出动作、工具负责执行、会话负责留下记录。":"See the model propose actions, tools carry them out, and the session keep the record.","只给两件工具":"Just two tools","固定提示词：You are a helpful software engineer assistant.":"Fixed prompt: You are a helpful software engineer assistant.","两个模型可见工具：持久 shell（POSIX 是 bash，Windows 是 pwsh）与 str_replace_editor。本预设没有自动压缩。":"Two model-visible tools: a persistent shell (bash on POSIX, pwsh on Windows) and str_replace_editor. This preset has no automatic compaction.","Minimal 已装配":"Minimal composed","看懂三张小票":"Read the three receipts","str_replace_editor：查看三张小票，暂不编辑。":"str_replace_editor: view all three receipts, without editing.","安安 96 元；波波 54 元；晨晨 30 元。":"An: CNY 96; Bo: CNY 54; Chen: CNY 30.","正在查看小票":"Viewing the receipts","在持久命令环境里计算":"Calculate in the persistent shell","通过 bash / pwsh 执行简单计算。\n总额 = 96 + 54 + 30；每人 = 总额 ÷ 3。":"Use bash / pwsh for simple arithmetic.\nTotal = 96 + 54 + 30; share = total / 3.","总额 180；均摊 60；差额为 +36、−6、−30。\n不会修改小票。":"Total 180; share 60; balances +36, −6, −30.\nThe receipts are unchanged.","计算完成":"Calculation complete","把数字变成转账建议":"Turn the numbers into transfer instructions","总額与差额已经核对。":"The total and balances have been checked.","这顿饭总共 180 元，每人应付 60 元。\n\n波波 → 安安：6 元\n晨晨 → 安安：30 元\n\n核对：安安最终支出 96 − 36 = 60；波波 54 + 6 = 60；晨晨 30 + 30 = 60。":"Dinner cost CNY 180; each person owes CNY 60.\n\nBo → An: CNY 6\nChen → An: CNY 30\n\nCheck: An pays 96 − 36 = 60; Bo pays 54 + 6 = 60; Chen pays 30 + 30 = 60.","聚餐后，谁该转多少钱？":"Who pays whom after dinner?","三张小票、三位朋友、一个能核对的答案。":"Three receipts, three friends, one verifiable answer.","Minimal 两个工具":"Minimal’s two tools","持久命令环境":"Persistent shell","同题比较四种模式":"Compare all four presets","工具少也能完成任务。Minimal 的两个工具足以读取资料与做计算。":"A small tool surface can still do useful work: Minimal can read evidence and calculate.","帮我把三张旅行照片按月份归档。先展示移动清单，得到我同意后才能移动。不要删除照片，也不要改动内容。":"Organize my three travel photos by month. Show the move list and wait for my approval before moving anything. Do not delete photos or change their contents.","先看照片清单":"Inspect the photo list first","3 张照片的文件名与拍摄月份。":"The filenames and capture months of three photos.","计划：海边.jpg → 2026-06/\n山顶.jpg、合影.jpg → 2026-07/\n此刻尚未移动任何文件。":"Proposal: beach.jpg → 2026-06/\nsummit.jpg and group.jpg → 2026-07/\nNothing has moved yet.","只读查看":"Read-only inspection","把计划送到审批边界":"Send the proposal to the approval boundary","移动命令已准备好；示例策略要求先批准。":"The move command is prepared; the example policy requires approval first.","tools/pre-execute 返回 ask；审批请求交给 ctx.approval。工具本体尚未调用。":"tools/pre-execute returns ask; ctx.approval handles the request. The tool body has not been called.","等待你的批准":"Waiting for your approval","你说：先不要移动":"You say: do not move them yet","用户回复：不要移动，我想先把清单发给朋友确认。":"User response: do not move them; I want a friend to check the list first.","拒绝结果返回工具管线。没有 shell 执行，也没有文件写入。":"A denial returns to the tool pipeline. No shell command executes and no file is written.","用户已拒绝":"User denied","用户拒绝 · 文件保持原样":"User denied · Files unchanged","把拒绝准确记下来":"Record the refusal accurately","工具调用结果：未获批准。":"Tool outcome: approval denied.","会话留下拒绝结果，模型据此解释任务为何没有执行。":"The session records the denial; the model uses it to explain why no action was taken.","记录拒绝结果":"Recording the denied result","看看用户拒绝批准时，动作怎样停在工具执行之前。":"Watch a refusal stop an action before the tool body runs.","基础":"Basic","用户审批":"User approval","拒绝也有结果":"A denial is a result","工具边界":"Tool boundary","自然语言要求配合实际审批规则。本例明确配置了对移动命令的前置审批。":"The request is backed by an explicit pre-execution approval rule for move commands in this example.","这是一份家里的共享采购单。请把牛奶从 2 盒改成 4 盒。家人可能同时修改它，请保留其他人的更新。":"This is our shared shopping list. Change milk from 2 cartons to 4. My family may edit it at the same time; preserve their changes.","记住刚刚读到的版本":"Remember the observed version","牛奶：2 盒\n大米：1 袋":"Milk: 2 cartons\nRice: 1 bag","read 成功后产生 fs/observed，记录当时的文件版本。":"A successful read emits fs/observed and records the version seen.","已观察版本 v1":"Observed version v1","家人在你动手前加了一项":"A family member adds an item","这里插入一次教学用并发更新；DSH 尚未重新读到它。":"This is a synthetic concurrent update. DSH has not reread it yet.","家人把“鸡蛋：12 个”加入同一份采购单。":"A family member adds “Eggs: 12” to the same list.","牛奶：2 盒\n大米：1 袋\n鸡蛋：12 个":"Milk: 2 cartons\nRice: 1 bag\nEggs: 12","外部更新插入":"External update interleaved","旧版本编辑被拦住":"Block the stale edit","edit：将“牛奶：2 盒”替换为“牛奶：4 盒”；携带旧的观察状态。":"edit: replace “Milk: 2 cartons” with “Milk: 4 cartons”, based on the old observed state.","FS_STALE_VERSION\n请重新读取文件，再重试。\n此次没有写入。":"FS_STALE_VERSION\nReread the file, then retry.\nThis attempt made no write.","发现版本冲突":"Stale version detected","发现冲突 · 先停下来重读":"Conflict found · Reread first","重新读取，看到新加的鸡蛋":"Reread and see the added eggs","按错误提示重新读取采购单。":"Reread the list as instructed by the error.","已观察版本 v2":"Observed version v2","只改自己负责的那一项":"Change only the requested item","基于 v2，把牛奶 2 盒改成 4 盒。":"Based on v2, change milk from 2 cartons to 4.","牛奶：4 盒\n大米：1 袋\n鸡蛋：12 个":"Milk: 4 cartons\nRice: 1 bag\nEggs: 12","编辑成功":"Edit successful","牛奶已改为 4 盒。\n\n牛奶：4 盒\n大米：1 袋\n鸡蛋：12 个\n\n第一次编辑遇到版本冲突后，我重新读取，再应用修改；家人新增的鸡蛋仍然保留。":"Milk is now 4 cartons.\n\nMilk: 4 cartons\nRice: 1 bag\nEggs: 12\n\nThe first edit hit a stale-version conflict. A fresh read preceded the retry, preserving the eggs added by your family.","共享采购单，别覆盖家人的修改":"Do not overwrite the family’s update","你改牛奶，家人加鸡蛋。先发现冲突，再安全重试。":"You change milk while a family member adds eggs. Detect the conflict, then retry safely.","进阶":"Intermediate","先读后改":"Read before edit","版本冲突":"Stale-version conflict","读新版本后重试":"Reread and retry","展示 fs-observation-policy 与文件系统实现的配合。该策略需要实际挂载，文件读写工具本身不会自动拥有它。":"This shows fs-observation-policy working with a filesystem provider. The policy must be mounted; file tools do not automatically supply it.","三个班分别发来了迎新活动报名表。请合并它们，用学号识别重复报名，告诉我总记录数、实际人数，以及哪些同学重复报名。表格已放在本页，不需要联网。":"Three classes sent registration sheets for a welcome event. Merge them, identify duplicate registrations by student ID, and report the row count, unique people, and duplicate IDs. The sheets are included here; no network is needed.","模型只看到一个原生入口":"The model sees one native entry","该预设加载工具呈现插件，mode: ptc。":"The preset mounts tool presentation with mode: ptc.","原生工具目录：run_code。\n原来的读取等能力以生成的 SDK 供程序调用。":"Native tool catalog: run_code.\nUnderlying read and other capabilities are exposed through a generated SDK.","PTC 预设已装配":"PTC preset composed","先写好处理流程":"Prepare the processing program","伪代码：读取三表 → 按学号分组 → 统计次数 → 只输出合并摘要。":"Pseudocode: read three sheets → group by student ID → count → emit a compact summary.","run_code 开始执行。它可以调用 SDK 中的工具；不会直接拿到无限制的宿主权限。":"run_code begins. It can call SDK tools; this does not grant unrestricted host access.","程序已提交":"Program submitted","程序内部读取三个表":"Read the sheets inside the program","通过 SDK 读取班级 1、2、3 的 CSV。":"Read the CSV for classes 1, 2 and 3 through the SDK.","各表 4 行，共 12 条原始报名。内部工具调用照常经过工具管线。":"Each sheet contains 4 rows: 12 registrations in total. Nested tool calls still pass through the tool pipeline.","3 次内部读取":"Three nested reads","在程序里完成去重":"Deduplicate within the program","这部分是程序内计算，无需把每行原始数据都送回主模型。Standard 也可以通过 shell 程序做批处理；PTC 的区别在工具接口与数据流。":"This is local computation within the program. Standard can also batch work using a shell program; PTC differs in its tool interface and data flow.","12 条报名记录；以 student_id 为键。":"12 registration rows; group by student_id.","计数：S02=2，S03=2，S07=2；其他学号各 1 次。\n唯一学号总数：9。":"Counts: S02=2, S03=2, S07=2; all others=1.\nUnique student IDs: 9.","统计完成":"Aggregation complete","返回简短结果，再写答复":"Return a compact result, then answer","程序只返回计数与重复者列表。":"The program returns only counts and duplicate IDs.","报名记录：12 条\n实际人数：9 人\n多余报名：3 条\n\n重复报名者：\nS02 周宁：2 次\nS03 许禾：2 次\nS07 叶雨：2 次\n\n去重依据是学号。没有删除原表。":"Registration rows: 12\nUnique people: 9\nExtra registrations: 3\n\nDuplicate IDs:\nS02 Zhou Ning: twice\nS03 Xu He: twice\nS07 Ye Yu: twice\n\nDeduplication uses student ID. The source sheets are unchanged.","摘要返回主循环":"Summary returned to the loop","伪代码（流程示意，不是可直接运行的 SDK 代码）：\n读取 3 张报名表\n按 student_id 分组\n输出行数、人数、重复学号":"Pseudocode (conceptual, not executable SDK code):\nRead 3 sheets\nGroup by student_id\nReturn row count, people and duplicate IDs","三张报名表，谁重复报名了？":"Who registered twice across three sheets?","把一连串“读表—合并—去重”交给一段程序。":"Give one program the sequence: read, merge and deduplicate.","PTC 程序调工具":"PTC programmatic calls","内部子调用":"Nested tool calls","只返回必要结果":"Return only needed results","run_code 是模型直接看到的工具入口；程序内部仍通过受控工具完成读取。程序可以在内部处理数据后返回摘要。":"run_code is the model-facing tool entry. Its program still reads through guarded tools and can process data before returning a summary.","我们计划办一场 120 人的迎新活动，预算 1500 元。请让两个子助手分工：一个检查场地容量，一个检查费用，最后告诉我活动能否按原计划举行。只读资料，不订场地、不付款。":"We are planning a welcome event for 120 people with a budget of CNY 1,500. Have two subagents split the checks: one checks venue capacity and the other costs. Tell me whether the plan is feasible. Read only; do not book or pay.","拆成两个可核对的问题":"Split the task into two verifiable checks","子任务 venue：人数是否超容量？\n子任务 budget：总价是否超预算？":"Child venue: does attendance exceed capacity?\nChild budget: does cost exceed budget?","已拆分子任务":"Subtasks planned","给子任务各自建立会话":"Create separate child sessions","新建 venue-01 和 budget-01。":"Create venue-01 and budget-01.","spawn 示例建立新的子会话。fork 则可以继承一段历史，二者用途不同。":"The spawn example creates fresh child sessions. A fork can inherit a history prefix; the two serve different purposes.","子任务已建立":"Child sessions created","第一位助手查场地":"The first child checks the venue","计划 120 人；场地最多 80 人。":"Planned attendance: 120; venue capacity: 80.","venue-01：容量不足，缺 40 个名额。依据：场地确认.txt。":"venue-01: capacity shortfall of 40 places. Evidence: venue confirmation.","场地检查完成":"Venue check complete","第二位助手查费用":"The second child checks the cost","餐费 12 元 × 120 人；固定物料费 120 元；预算 1500 元。":"Meals CNY 12 × 120; materials CNY 120; budget CNY 1,500.","budget-01：总额 1560 元，超出 60 元。依据：费用报价.txt。":"budget-01: total CNY 1,560, exceeding budget by CNY 60. Evidence: price quote.","预算检查完成":"Budget check complete","把两份结论交回主任务":"Bring both results back to the parent","venue-01 与 budget-01 的结论和引用。":"Conclusions and citations from venue-01 and budget-01.","主任务保留两个约束：容量不足；预算超额。不能只看其中一个就宣布可行。":"The parent preserves both constraints: insufficient capacity and excess cost. Either alone would be an incomplete feasibility check.","主任务收到子任务结果":"Parent receives the child results","按目前资料，原计划需要调整。\n\n场地：最多 80 人，比计划少 40 个名额。\n费用：120 × 12 元餐费 + 120 元物料 = 1560 元，超预算 60 元。\n\n建议：先确认是换更大场地还是缩小规模，再按新人数核算预算。\n没有预订场地，也没有付款。":"The current plan needs revision.\n\nVenue: capacity 80, short of the planned 120 by 40 places.\nCost: 120 × CNY 12 for meals + CNY 120 for materials = CNY 1,560, exceeding the budget by CNY 60.\n\nDecide whether to change venues or reduce attendance, then recalculate costs.\nNo booking or payment was made.","活动能办吗？让两位助手分工检查":"Can the event go ahead? Split the checks","一个查人数，一个查钱，主助手把证据拼在一起。":"One checks capacity, one checks money, and the parent combines the evidence.","子 Agent 委派":"Subagent delegation","独立会话":"Separate sessions","结果交叉核对":"Cross-check results","主任务和子任务各有记录，子任务通过提供方运行。给子任务写“只读”任务要求，还需实际权限配置来强制限制。":"Parent and children have separate records and run through providers. A read-only instruction must be backed by permissions to be an enforced boundary.","从本页 1200 份《远星号航行档案》中查清：D-17 改道把目的地改成了哪里、谁批准、为什么改？请引用记录编号与原句。可能遇到很长的历史；即使做了摘要，也不要猜测漏掉的细节。":"Use the 1,200 original Farstar voyage records included here to find where reroute D-17 changed the destination, who authorized it, and why. Cite record IDs and exact evidence. History may get long; do not guess details lost in a summary.","档案很多，先定位相关编号":"Locate relevant record IDs","档案有 1200 份。以 D-17 为目标，分批检索并读取上下文。":"There are 1,200 records. Search and read context for D-17 in batches.","#0187：D-17 拟改道去白鹭港；原因是海棠港航道封闭。":"Record #0187: D-17 proposes Egret Port because Begonia Port’s channel is closed.","正在分批查阅":"Reading in batches","读到批准，记下证据位置":"Read the approval and keep its location","#0674、#0675 相邻，但事件编号不同。":"#0674 and #0675 are adjacent but describe different events.","#0674：D-17 批准人林岚，目的地白鹭港。\n#0675：R-17 批准人孟舟，目的地青石港。":"#0674: D-17, authorizer Lin Lan, destination Egret Port.\n#0675: R-17, authorizer Meng Zhou, destination Bluestone Port.","已发现审批证据":"Approval evidence found","多轮历史挤满了当前窗口":"Several rounds fill the current window","历次请求、工具结果和新问题逐渐累积。":"Requests, tool outputs and follow-up questions have accumulated.","示意压力：86%。演示沿用 0.8 的压缩触发比例。\n这里只演示阈值，不把字符数当作 Token 数。":"Illustrative pressure: 86%. The example uses the 0.8 compaction ratio.\nThis is a threshold illustration, not a character-to-token measurement.","达到演示压力阈值":"Illustrative pressure threshold reached","演示压力 86% · 默认触发比例 80%":"Illustrative pressure 86% · default trigger ratio 80%","先剪长结果，仍然不够":"Prune large results first; pressure remains","可用的 toolResultPruner 先缩短过长工具结果。":"The optional toolResultPruner shortens oversized tool results first.","示意压力：86% → 82%。仍需摘要。\n若裁剪后已足够小，真实后端可以跳过摘要模型调用。":"Illustrative pressure: 86% → 82%. A summary is still needed.\nWhen pruning suffices, the real backend can skip a summarization model call.","裁剪后仍高于阈值":"Pressure still above threshold after pruning","给旧历史写摘要":"Summarize the older history","选取可安全替换的旧历史区间；保留近期内容。":"Select a safely replaceable old-history span and retain recent content.","D-17 因原港航道封闭而改道；申请见 #0187，审批见 #0674。继续检查后续执行记录。":"D-17 requests a reroute after the original channel closed. Request: #0187; approval: #0674. Check the later execution confirmation.","生成摘要":"Generating a summary","模型看摘要，完整日志仍在":"The model sees a summary; the log remains","旧区间由摘要消息替代；原始日志继续保留。示意压力降至 29%。\n摘要是有损信息，不能保证保留每一个姓名。":"A summary message replaces the old span in the current context; the original log remains. Illustrative pressure drops to 29%.\nSummaries are lossy and need not preserve every name.","当前上下文已替换":"Current context replaced","原始日志不删 · 模型当前上下文变短":"Original log retained · Current model context reduced","后续档案确认改道真正执行":"Later evidence confirms the reroute happened","继续查 #0801–#1200；重点验证申请是否已执行。":"Continue in records #0801–#1200 and verify that the request was executed.","#1109：D-17 已生效，远星号最终驶向白鹭港。":"#1109: D-17 is effective; Farstar is proceeding to Egret Port.","执行记录已找到":"Execution confirmation found","摘要里没有姓名，先别补答案":"The summary lacks a name; do not fill it in","已有目的地与原因；摘要没有保留批准人姓名。":"Destination and cause are known; the summary omitted the authorizer’s name.","不能借用旁边 R-17 的“孟舟”。先回到摘要保留的位置 #0674。":"Do not borrow “Meng Zhou” from neighboring R-17. Return to #0674, whose location survived in the summary.","发现证据缺口":"Evidence gap detected","按编号重读，只取需要的原句":"Reread the cited record, not the entire archive","再次读取 #0674 的审批句及上下文。":"Reread the approval sentence and context in #0674.","D-17 审批完成；批准人：林岚；批准目的地：白鹭港。":"D-17 approved; authorizer: Lin Lan; approved destination: Egret Port.","补回准确证据":"Exact evidence recovered","D-17 的最终目的地是白鹭港，批准人是林岚，原因是海棠港航道封闭。\n\n#0187：申请编号 D-17；原因：海棠港航道封闭；拟改目的地：白鹭港。\n#0674：D-17 审批完成；批准人：林岚；批准目的地：白鹭港。\n#1109：执行确认：D-17 已生效；远星号最终驶向白鹭港。\n\n#0675 属于 R-17，其批准人和目的地不能用于回答 D-17。\n摘要漏掉的姓名已通过重新读取 #0674 确认。":"D-17’s final destination is Egret Port, authorized by Lin Lan because Begonia Port’s channel was closed.\n\n#0187: Request D-17; cause: Begonia Port channel closure; proposed destination: Egret Port.\n#0674: D-17 approved; authorizer: Lin Lan; approved destination: Egret Port.\n#1109: Execution confirmed: D-17 is effective; Farstar is proceeding to Egret Port.\n\n#0675 concerns R-17, so its authorizer and destination do not answer the D-17 question.\nThe missing name was verified by rereading #0674.","1200 份航行档案，找回三条线索":"Find three linked clues in 1,200 voyage records","找目的地、批准人和原因。摘要漏掉姓名时，回原文补证据。":"Find the destination, authorizer and cause; reread when a summary loses the name.","挑战":"Advanced","超长多轮上下文":"Long multi-turn context","压缩 + 裁剪":"Compaction + pruning","摘要遗失后重查":"Recover from summary loss","长上下文检索与压缩是两回事。本例分批查阅原创档案，再演示历史压力、摘要替换和回查；不宣称完成模型长上下文评测。":"Long-context retrieval and compaction are distinct. This original corpus illustrates batched reading, pressure, replacement and rereading. It is not a model benchmark.","D-17 因海棠港航道封闭拟改到白鹭港；#0674 的批准人是林岚。保留原句和记录编号，继续查执行记录。":"D-17 proposes Egret Port because Begonia Port’s channel is closed. #0674 names Lin Lan as the authorizer. Keep the quote and record IDs, and check execution.","摘要保留了姓名，也要核对出处":"Even a complete summary needs a source check","摘要保留：林岚、白鹭港、#0674。":"Summary retained: Lin Lan, Egret Port and #0674.","三个字段都有来源。最终引用前，用 #0674 原句核对一次。":"All three fields have a source. Verify the original #0674 sentence before citing it.","关键字段保留":"Key fields retained","D-17 的最终目的地是白鹭港，批准人是林岚，原因是海棠港航道封闭。\n\n#0187：申请编号 D-17；原因：海棠港航道封闭；拟改目的地：白鹭港。\n#0674：D-17 审批完成；批准人：林岚；批准目的地：白鹭港。\n#1109：执行确认：D-17 已生效；远星号最终驶向白鹭港。\n\n#0675 属于 R-17，其批准人和目的地不能用于回答 D-17。\n摘要保留了关键字段，最终答复仍核对原句。":"D-17’s final destination is Egret Port, authorized by Lin Lan because Begonia Port’s channel was closed.\n\n#0187: Request D-17; cause: Begonia Port channel closure; proposed destination: Egret Port.\n#0674: D-17 approved; authorizer: Lin Lan; approved destination: Egret Port.\n#1109: Execution confirmed: D-17 is effective; Farstar is proceeding to Egret Port.\n\n#0675 concerns R-17, so its authorizer and destination do not answer the D-17 question.\nThe summary retained key fields; the final answer still verifies the original wording.","摘要漏掉姓名":"Summary loses the name","摘要保留关键线索":"Summary keeps key evidence","每次聚餐都要分账。请在当前会话里做一个临时分账面板，输入三个人各自付款金额就能算转账建议。先说明会用到的能力，等我批准再运行。演示后停止它，不修改仓库配置。":"We split dinner bills frequently. Build a temporary panel in this session that takes three payments and suggests transfers. Explain the capabilities first and run it only after my approval. Stop it after the demo; do not edit repository configuration.","先查看有哪些可用接口":"Inspect the available contracts first","cordis_inspect_list / cordis_inspect_query：查询可用服务、工具或浏览器插槽。":"cordis_inspect_list / cordis_inspect_query: query live services, tools or browser slots.","读取当前环境公开的接口后再写定义，不凭记忆编造可调用方法。":"Read the live exposed contract before authoring a definition; do not invent callable methods.","接口查询完成":"Contract inspection complete","写好定义，但还没有运行":"Define it without running it","cordis_define：保存一个含浏览器界面的新插件版本。":"cordis_define: record a new plugin version with a browser interface.","已通过参数与语法检查；仅保存在进程内。尚未运行，也未在此步骤申请批准。":"Parameters and syntax pass validation. The definition is in memory only; nothing runs or requests approval at this stage.","定义已保存":"Definition recorded","运行浏览器部分前等待批准":"Wait for approval before the browser half runs","cordis_run：请求激活刚定义的浏览器面板。":"cordis_run: request activation of the defined browser panel.","返回 awaiting-approval 收据。它表示已发起运行请求，不能当作面板已成功运行。":"Returns an awaiting-approval receipt. It confirms a request, not a successfully running panel.","等待用户批准":"Awaiting user approval","获准运行，在面板里试算":"After approval, try the panel","用户已批准本次运行；进入 running 状态。":"The user approves this run; it enters running state.","试算：96、54、30 元 → 总额 180 元；每人 60 元。\n点击“试用分账面板”，可以在本网页调整金额。":"Try 96, 54, 30 → total 180; each pays 60.\nUse “Try the calculator” to adjust amounts locally on this page.","临时面板运行中（教学）":"Temporary panel running (teaching)","临时面板示意 · 未实际启动 DSH 插件":"Temporary panel preview · No live DSH plugin","用完停下，保留可追溯的定义":"Stop after use and keep the definition","cordis_stop：停止当前插件运行，取消待处理审批。":"cordis_stop: stop the current run and cancel pending approval.","状态：stopped。定义和版本可继续保留；本次没有修改 cordis.yml，也没有安装包。":"State: stopped. Definitions and versions can remain. No cordis.yml edit or package installation occurred.","当前运行已停止":"Current run stopped","临时分账面板已完成一次演示，并已停止。\n\n96、54、30 元 → 总额 180 元，每人 60 元；转账 6 元和 30 元给安安。\n\ncordis_define 只保存定义；cordis_run 才激活。\ncordis_stop 停止当前运行，定义仍可保留；cordis_undefine 才移除插件。\n这些定义保存在进程内，重启后不会自动变成已安装插件。":"The temporary split-bill panel was demonstrated and then stopped.\n\nCNY 96, 54, 30 → total 180, share 60; transfer 6 and 30 to An.\n\ncordis_define records a definition; cordis_run activates it.\ncordis_stop stops the run but can keep its definition; cordis_undefine removes it.\nDefinitions are process-local and do not automatically become installed plugins after restart.","从使用现成工具，走到定义、批准、运行与停止临时面板。":"Go from using existing tools to defining, approving, running and stopping a panel.","开发者":"Developer","Cordis 动态扩展":"Cordis dynamic extension","先定义，再运行":"Define before running","生命周期与信任边界":"Lifecycle and trust boundary","展示当前七个 Cordis 工具的生命周期。动态代码可能影响同进程其他会话，必须按高信任操作对待；本网页只播放教学状态。":"This shows the current seven-tool Cordis lifecycle. Dynamic code may affect other sessions in the process and requires high trust; this page only plays teaching states.","打开现成的完整工具箱":"Open the standard toolbox","模型看到读取、搜索、shell 等原生工具。":"The model sees native read, search, shell and other tools.","本例只用读取与简单计算，不会为了展示功能强行调用子任务。":"This example only reads and calculates. It does not invoke a subagent just to demonstrate a feature.","Standard 已装配":"Standard composed","分别读取三张小票":"Read the three receipts","read：安安、波波、晨晨的小票。":"read: the receipts for An, Bo and Chen.","付款额：96、54、30 元。":"Payments: CNY 96, 54, 30.","读取完成":"Reads complete","用 shell 核对算术":"Check the arithmetic with the shell","bash / pwsh：汇总付款额并除以 3。":"bash / pwsh: sum the payments and divide by 3.","总额 180 元；每人 60 元；差额 +36、−6、−30。":"Total 180; share 60; balances +36, −6, −30.","用一个入口调用底层工具":"Call underlying tools through one entry","模型原生目录：run_code。":"Model-visible native catalog: run_code.","读取与计算流程编排在一段程序内；依然使用受控 SDK 工具。":"Reading and calculation are orchestrated within one program using guarded SDK tools.","PTC 已装配":"PTC composed","在程序内读取与计算":"Read and calculate inside the program","SDK 读取三张小票，然后在程序内计算均摊。":"Read three receipts through the SDK, then calculate the equal share within the program.","只输出必要结果：total=180, share=60, transfers=[6,30]。":"Return only the necessary result: total=180, share=60, transfers=[6,30].","内部处理完成":"Nested processing complete","先判断要不要新增工具":"Decide whether a new tool is useful","一次分账用现成工具即可。这里为对照，展示以后要反复分账时的临时面板路径。":"Existing tools suffice for one bill. For comparison, this route shows a temporary panel useful for repeated bills.","检查使用场景":"Checking the use case","只带两件工具":"Just two tools","极简":"Minimal","固定提示词 + 持久 shell + 文本编辑器。":"Fixed prompt, persistent shell, and text editor.","用少量工具完成读取、编辑与命令计算。":"Read, edit, and calculate with a small tool surface.","没有压缩、技能与子任务工具。编辑器使用局部 fs-local；不要把“极简”理解为最严格的文件隔离。":"No compaction, skills, or delegation tools in this preset. Its editor uses local fs-local; a minimal tool set does not imply the strictest filesystem isolation.","完整固定提示词；不注入运行时上下文。":"A complete fixed prompt; runtime-context snapshots are suppressed.","查看小票 → shell 计算 → 转账建议":"View receipts → shell calculation → transfers","2 个工具入口":"2 tool entries","完整固定":"Complete and fixed","未挂载":"Not mounted","无委派工具":"No
