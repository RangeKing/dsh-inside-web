":"Open the system.","让复杂性变得可读。":"Make complexity readable.","DSH Inside 是基于 DeepSeek Harness 官方源码制作的独立交互式导览。用逐步展开的任务流程与单服务剖面，代替默认展示所有连接。":"DSH Inside is an independent interactive guide based on the official DeepSeek Harness source. It reveals one task or one service at a time, keeping unrelated connections out of the way.","官方表中的服务":"Services in the official table","标为 seam 的接口":"Interfaces classified as seams","教学任务场景":"Teaching scenarios","证据与范围":"Evidence and scope","服务名称、角色、声明包、实现方及直接消费者来自 capability-seams.md。任务主链核对了 agent-loop、tools 和 session 的关键源码。六层空间分组、中文讲解、任务示例和播放速度为本项目设计。":"Service names, roles, owners, implementations, and consumers come from capability-seams.md. The task path follows key agent-loop, tools, and session code. Spatial groups, explanations, fixtures, and playback timing are designed for this viewer.","教学动画没有真实模型输出或性能测量。提供方切换仅改变结构示意。日志模式展示本地导入的事件，不代表拥有全部 seam 的实测调用轨迹，也不尝试恢复会话。":"Teaching animations contain no real model outputs or performance measurements. Provider selection changes the structural preview only. Log mode shows imported events without claiming complete seam traces or reconstructing sessions.","固定源码版本":"Pinned source version","提交时间：2026-09-04 09:16 UTC · 整理日期：2026-09-05":"Commit: 2026-09-04 09:16 UTC · Prepared: 2026-09-05","70 个服务的职责、角色、声明与实现":"Roles, owners, and implementations of 70 services","turn / step / request / tool-call 主执行链":"The turn / step / request / tool-call execution path","并行调度、屏障与按序写回":"Concurrent scheduling, barriers, and ordered commits","前置、执行包装、后置、最终结果事件":"Pre-policy, wrappers, post-policy, and final-result events","追加式会话、事件观察与刷写检查点":"Append-only sessions, observation, and flush checkpoints","SessionEvent 与 surface 元数据":"SessionEvent and surface metadata","本项目与 DeepSeek 官方无隶属关系。网页无需外部字体、脚本或模型密钥；只有主动打开源码链接时才访问 GitHub。":"This project is not affiliated with DeepSeek. It needs no external fonts, scripts, or model keys. GitHub is contacted only when you open a source link.","先看一次任务。":"Follow one task.","再拆开一个接口。":"Then inspect one interface.","01 / 任务导览":"01 / Task journey","选择场景并播放，跟随亮起的组件。拖动底部时间轴回到任一步；切换“源码”查看该步骤的代码依据。播放速度仅用于讲解。":"Choose a scenario and follow the highlighted components. Scrub the bottom timeline to any step; open Source for the supporting code. Playback timing is illustrative.","02 / 接口图鉴":"02 / Seam atlas","搜索中文、ctx key 或包名。在“剖面”中，左侧展示消费者、中心展示接口、右侧展示实现方。点击提供方只切换结构示意，不改变真实配置。":"Search by Chinese or English name, ctx key, or package. Focus puts consumers on the left, the interface in the center, and implementations on the right. Provider selection changes only the preview.","03 / 运行记录":"03 / Run logs","载入标准化的 SessionEvent。文件留在当前页面内存中，不上传、不自动保存。未知事件继续显示并提示解释限制。":"Load standardized SessionEvent data. Files remain in tab memory and are neither uploaded nor saved automatically. Unknown events stay visible with interpretation warnings.","3D 操作":"3D controls","拖动旋转，滚轮缩放，触屏双指缩放；点击小组件查看职责。“展开层级”调整六层的间距，“⊞”切换俯视，“↺”恢复初始视角。":"Drag to rotate, scroll or pinch to zoom, and click a component for details. Layer spacing separates the six groups. Use ⊞ for top view and ↺ to reset the camera.","播放 / 暂停":"Play / pause","前后步骤 / 前后服务":"Previous / next step or service","搜索接口":"Search services","总览 / 单接口剖面":"Overview / service focus","关闭说明 / 返回总览":"Close help / return to overview","可点击“减少动态”。没有 WebGL 时自动使用 Canvas 软件三维渲染；两种画布均不可用时提供文字视图。":"Use Reduce motion for a quieter view. If WebGL is unavailable, Canvas software 3D is used. A text view is available if neither graphics backend works.","这次，看看":"This time, explore","你的任务记录。":"your own task log.","在本地读取一个会话的事件文件。":"Read one session's event file locally.","保留原文，按文件顺序查看。":"Keep raw records and browse them in file order.","拖入 JSON / JSONL":"Drop JSON / JSONL","或点击选择文件":"or click to choose a file","选择日志文件":"Choose log file","支持标准化 SessionEvent 数据。":"Standardized SessionEvent data supported.","最大 8 MiB / 20,000 条。":"Up to 8 MiB / 20,000 events.","无需 API Key，文件不上传。":"No API key; files are not uploaded.","下载带标识的教学样本 ↗":"Download a labeled demo sample ↗","导入边界，先讲清楚。":"Know the import boundaries.","查看器接受一个会话的标准化事件数组、{ events: […] }，或一行一条事件的 JSONL。它验证外层结构，不校验每个插件事件的完整业务结构。":"The viewer accepts a single-session event array, { events: […] }, or event-per-line JSONL. It validates the outer envelope, not every plugin event's full business schema.","原始后端存储可能包含版本头、继承前缀或其他封装；出现不支持的结构时请先导出为上述事件形式。未知事件完整保留，不会默默丢弃。页面不会尝试恢复会话或推断未记录的 seam 调用。":"Raw backend storage may contain version headers, inherited prefixes, or other wrappers. Export unsupported formats into standardized events first. Unknown events are preserved. This page does not restore sessions or infer unrecorded seam calls.","日志可能含敏感内容。当前网页不发送任何日志网络请求；显示时会按字段名称遮盖常见密钥字段。重载或清除后，页面不保留导入记录。":"Logs may contain sensitive information. No log network requests are made; common secret fields are masked by name. Reloading or clearing removes the imported records from this tab.","教学样本仅供测试查看器，事件内容未经过完整 DSH schema 校验，不能用于恢复真实会话。":"The sample is for testing the viewer. Its event payloads are not fully validated against DSH schemas and cannot restore a real session.","事件未建立讲解映射，原文完整保留。":"events are unmapped; their raw records are retained.","包含未知的必需事件，无法据此重建会话；本页只作记录查看。":"Unknown required events prevent session reconstruction. This page only displays records.","载入其他文件":"Load another file","清除记录":"Clear log","事件列表显示当前位置附近的记录。底部滑块可以到达任意一条。":"The list shows records near the current position. Use the bottom slider to reach any event.","新一轮开始":"A new turn starts","会话记录了本轮开始的边界。":"The session records the start boundary of this turn.","这一轮结束":"The turn ends","查看原始 reason 字段，区分普通完成、错误、取消或其他结束原因。":"Inspect the raw reason field for completion, failure, cancellation, or another end reason.","步骤开始":"Step starts","这是会话中的步骤边界；具体工具与提供方需要更多事件才能判断。":"This is a session step boundary. More events are needed to identify tools and providers.","步骤结束":"Step ends","步骤结束已被记录，不等于整个用户任务已结束。":"The step has ended; the overall task may still be running.","用户消息进入日志":"User message committed","消息及其表面操作元数据按原样保留。":"The message and its surface-operation metadata are preserved as supplied.","助手消息进入日志":"Assistant message committed","这是一条已提交的助手消息。网页不从它推算所有模型请求或内部调用。":"This is a committed assistant message. The viewer does not infer all model requests or internal calls from it.","助手尝试记录":"Assistant attempt recorded","此类记录用于保存一次助手尝试，不能当作成功答复。":"This records an assistant attempt and should not be treated as a successful answer.","工具调用记录":"Tool call recorded","调用记录不保证工具本体已经执行。批准、守卫或取消仍可能改变结果。":"A call record does not guarantee the body ran. Approval, guards, or cancellation can still change the outcome.","工具结果记录":"Tool result recorded","原文保存这次调用的结果；页面不根据工具名称猜测具体文件或进程提供方。":"The record preserves the result. The viewer does not guess filesystem or process providers from the tool name.","程序内工具调用记录":"Nested program call recorded","这是 PTC 程序内部子调用的记录，与顶层工具结果分开阅读。":"This is a nested dispatch inside a PTC program, separate from the top-level tool result.","原始事件已保留。当前版本没有解释其语义，不推断它会改变哪些运行状态。":"The raw event is retained. Its semantics are not mapped in this version, so no state changes are inferred.","服务定位属于阅读辅助；本事件不证明一条完整的内部调用链。 此事件未标为 ignorable，不能据此重建会话。":"Service highlighting is a reading aid, not proof of a complete call chain. This event is not ignorable, so it cannot be used to reconstruct the session.","文件超过 8 MiB，请导出更小的片段。":"File exceeds 8 MiB. Export a smaller excerpt.","无法识别文件，请导入标准化 SessionEvent 数据。":"Unrecognized file. Import normalized SessionEvent data.","需要事件数组、{ events: […] } 或逐行 SessionEvent。":"Expected an event array, { events: […] }, or one SessionEvent per line.","文件没有可显示的事件。":"The file contains no events to display.","事件超过 20,000 条，请导出更小的单会话片段。":"More than 20,000 events. Export a smaller single-session excerpt.","检测到多个 sessionId。请分会话导出，避免把不同轨道拼成一条。":"Multiple sessionId values detected. Export sessions separately to keep their tracks distinct.","先把要办的事说清楚":"Start with a clear goal","本阶段只展示相关的服务及其输入、输出。":"This stage shows only the relevant services and their input and output.","亮起的组件参与当前教学阶段；箭头只显示标注的交接。":"Highlighted components participate in this teaching stage. Arrows show only the labeled hand-off.","我不会编程。请读 DSH 的官方介绍，用“收到任务 → 读资料 → 动手做 → 汇报结果”解释它怎么工作。再告诉我每一步由哪个源码包负责。不要修改文件。":"I do not code. Read the official DSH introduction and explain how it works as “receive a task → read information → act → report back”. Name the source package responsible for each part. Do not change files.","本页已准备好教学资料。接下来逐步展示处理过程，不会操作你的文件。":"The teaching materials are ready. Follow the steps without touching any of your files.","收到你的任务":"Task received","把工具箱交给模型":"Give the model its toolbox","选择 Standard；模型和工作区由宿主提供。":"Select Standard; the host supplies the model and workspace.","本轮工具目录包括读取、搜索、命令等工具；工具是否可执行还需经过策略。":"This step has read, search and shell tools. Actual execution still passes through policy.","Standard 预设已装配":"Standard preset composed","读官方资料，别凭空猜":"Read evidence rather than guess","read → README.md\nread → docs/capability-seams.md":"read → README.md\nread → docs/capability-seams.md","资料写明：Everything is a plugin。服务表分别列出声明包、实现方和消费者。":"The material says “Everything is a plugin”. The service table separates declarations, implementations and consumers.","正在读官方说明":"Reading the official description","给技术名词配上日常解释":"Translate technical terms into everyday roles","上下文：任务要求 + 官方节选 + 源码阅读地图。":"Context: the user request, official excerpts and source map.","Agent：处理任务的助手。\nTool：它能调用的具体动作。\nSeam：能力与具体实现之间的接口。\nSession：这次任务留下的记录。":"Agent: the assistant handling the task.\nTool: an action it can call.\nSeam: an interface between a capability and its implementation.\nSession: the record of this task.","模型正在组织解释":"The model is organizing the explanation","把答案与过程一并留下":"Keep the answer and its record","会话日志贯穿整个过程。持久化插件处理刷写；教学页面只在内存中播放。":"The session log spans the entire process. A persistence plugin handles flushing; this teaching page plays in memory only.","汇总已确认的结果，等待会话记录刷写。":"Collect confirmed results and wait for the session durability checkpoint.","DSH 像一个能调用工具的任务执行系统。\n\n1. 接收你的任务：会话入口找到 Agent。\n2. 准备资料：system-prompt 组装说明与工具目录。\n3. 模型提出动作：llm 对接模型；tools 调度工具。\n4. 完成后汇报：agent-loop 继续循环或结束；session 留下记录。\n\n源码入口：packages/core/{agent-loop,system-prompt,tools,session}。\n读取文件会用到 tool-fs 与 ctx.fs；具体存储实现可替换。":"DSH is a task execution system that can use tools.\n\n1. Receive the task: the session entry finds an Agent.\n2. Prepare context: system-prompt assembles guidance and the tool catalog.\n3. Propose an action: llm connects to a model; tools dispatches operations.\n4. Report back: agent-loop continues or ends; session keeps a record.\n\nSource entry points: packages/core/{agent-loop,system-prompt,tools,session}.\nFile reads use tool-fs and ctx.fs; the storage implementation can be replaced.","DSH 到底怎么帮我做事？":"How does DSH do things for me?","从官方自我介绍开始，不需要知道任何代码文件名。":"Start with the official introduction. No knowledge of source filenames required.","资料已放在本页：先点“看资料”，无需懂代码。":"Materials are included here. Open “Materials” first; no coding knowledge is needed.","入门":"Beginner","模型 + 工具":"Model + tools","一次任务的主循环":"The task loop","源码与日常语言对照":"Source-to-plain-language map","看见模型负责提出动作、工具负责执行、会话负责留下记录。":"See the model propose actions, tools carry them out, and the session keep the record.","只给两件工具":"Just two tools","固定提示词：You are a helpful software engineer assistant.":"Fixed prompt: You are a helpful software engineer assistant.","两个模型可见工具：持久 shell（POSIX 是 bash，Windows 是 pwsh）与 str_replace_editor。本预设没有自动压缩。":"Two model-visible tools: a persistent shell (bash on POSIX, pwsh on Windows) and str_replace_editor. This preset has no automatic compaction.","Minimal 已装配":"Minimal composed","看懂三张小票":"Read the three receipts","str_replace_editor：查看三张小票，暂不编辑。":"str_replace_editor: view all three receipts, without editing.","安安 96 元；波波 54 元；晨晨 30 元。":"An: CNY 96; Bo: CNY 54; Chen: CNY 30.","正在查看小票":"Viewing the receipts","在持久命令环境里计算":"Calculate in the persistent shell","通过 bash / pwsh 执行简单计算。\n总额 = 96 + 54 + 30；每人 = 总额 ÷ 3。":"Use bash / pwsh for simple arithmetic.\nTotal = 96 + 54 + 30; share = total / 3.","总额 180；均摊 60；差额为 +36、−6、−30。\n不会修改小票。":"Total 180; share 60; balances +36, −6, −30.\nThe receipts are unchanged.","计算完成":"Calculation complete","把数字变成转账建议":"Turn the numbers into transfer instructions","总額与差额已经核对。":"The total and balances have been checked.","这顿饭总共 180 元，每人应付 60 元。\n\n波波 → 安安：6 元\n晨晨 → 安安：30 元\n\n核对：安安最终支出 96 − 36 = 60；波波 54 + 6 = 60；晨晨 30 + 30 = 60。":"Dinner cost CNY 180; each person owes CNY 60.\n\nBo → An: CNY 6\nChen → An: CNY 30\n\nCheck: An pays 96 − 36 = 60; Bo pays 54 + 6 = 60; Chen pays 30 + 30 = 60.","聚餐后，谁该转多少钱？":"Who pays whom after dinner?","三张小票、三位朋友、一个能核对的答案。":"Three receipts, three friends, one verifiable answer.","Minimal 两个工具":"Minimal’s two tools","持久命令环境":"Persistent shell","同题比较四种模式":"Compare all four presets","工具少也能完成任务。Minimal 的两个工具足以读取资料与做计算。":"A small tool surface can still do useful work: Minimal can read evidence and calculate.","帮我把三张旅行照片按月份归档。先展示移动清单，得到我同意后才能移动。不要删除照片，也不要改动内容。":"Organize my three travel photos by month. Show the move list and wait for my approval before moving anything. Do not delete photos or change their contents.","先看照片清单":"Inspect the photo list first","3 张照片的文件名与拍摄月份。":"The filenames and capture months of three photos.","计划：海边.jpg → 2026-06/\n山顶.jpg、合影.jpg → 2026-07/\n此刻尚未移动任何文件。":"Proposal: beach.jpg → 2026-06/\nsummit.jpg and group.jpg → 2026-07/\nNothing has moved yet.","只读查看":"Read-only inspection","把计划送到审批边界":"Send the proposal to the approval boundary","移动命令已准备好；示例策略要求先批准。":"The move command is prepared; the example policy requires approval first.","tools/pre-execute 返回 ask；审批请求交给 ctx.approval。工具本体尚未调用。":"tools/pre-execute returns ask; ctx.approval handles the request. The tool body has not been called.","等待你的批准":"Waiting for your approval","你说：先不要移动":"You say: do not move them yet","用户回复：不要移动，我想先把清单发给朋友确认。":"User response: do not move them; I want a friend to check the list first.","拒绝结果返回工具管线。没有 shell 执行，也没有文件写入。":"A denial returns to the tool pipeline. No shell command executes and no file is written.","用户已拒绝":"User denied","用户拒绝 · 文件保持原样":"User denied · Files unchanged","把拒绝准确记下来":"Record the refusal accurately","工具调用结果：未获批准。":"Tool outcome: approval denied.","会话留下拒绝结果，模型据此解释任务为何没有执行。":"The session records the denial; the model uses it to explain why no action was taken.","记录拒绝结果":"Recording the denied result","看看用户拒绝批准时，动作怎样停在工具执行之前。":"Watch a refusal stop an action before the tool body runs.","基础":"Basic","用户审批":"User approval","拒绝也有结果":"A denial is a result","工具边界":"Tool boundary","自然语言要求配合实际审批规则。本例明确配置了对移动命令的前置审批。":"The request is backed by an explicit pre-execution approval rule for move commands in this example.","这是一份家里的共享采购单。请把牛奶从 2 盒改成 4 盒。家人可能同时修改它，请保留其他人的更新。":"This is our shared shopping list. Change milk from 2 cartons to 4. My family may edit it at the same time; preserve their changes.","记住刚刚读到的版本":"Remember the observed version","牛奶：2 盒\n大米：1 袋":"Milk: 2 cartons\nRice: 1 bag","read 成功后产生 fs/observed，记录当时的文件版本。":"A successful read emits fs/observed and records the version seen.","已观察版本 v1":"Observed version v1","家人在你动手前加了一项":"A family member adds an item","这里插入一次教学用并发更新；DSH 尚未重新读到它。":"This is a synthetic concurrent update. DSH has not reread it yet.","家人把“鸡蛋：12 个”加入同一份采购单。":"A family member adds “Eggs: 12” to the same list.","牛奶：2 盒\n大米：1 袋\n鸡蛋：12 个":"Milk: 2 cartons\nRice: 1 bag\nEggs: 12","外部更新插入":"External update interleaved","旧版本编辑被拦住":"Block the stale edit","edit：将“牛奶：2 盒”替换为“牛奶：4 盒”；携带旧的观察状态。":"edit: replace “Milk: 2 cartons” with “Milk: 4 cartons”, based on the old observed state.","FS_STALE_VERSION\n请重新读取文件，再重试。\n此次没有写入。":"FS_STALE_VERSION\nReread the file, then retry.\nThis attempt made no write.","发现版本冲突":"Stale version detected","发现冲突 · 先停下来重读":"Conflict found · Reread first","重新读取，看到新加的鸡蛋":"Reread and see the added eggs","按错误提示重新读取采购单。":"Reread the list as instructed by the error.","已观察版本 v2":"Observed version v2","只改自己负责的那一项":"Change only the requested item","基于 v2，把牛奶 2 盒改成 4 盒。":"Based on v2, change milk from 2 cartons to 4.","牛奶：4 盒\n大米：1 袋\n鸡蛋：12 个":"Milk: 4 cartons\nRice: 1 bag\nEggs: 12","编辑成功":"Edit successful","牛奶已改为 4 盒。\n\n牛奶：4 盒\n大米：1 袋\n鸡蛋：12 个\n\n第一次编辑遇到版本冲突后，我重新读取，再应用修改；家人新增的鸡蛋仍然保留。":"Milk is now 4 cartons.\n\nMilk: 4 cartons\nRice: 1 bag\nEggs: 12\n\nThe first edit hit a stale-version conflict. A fresh read preceded the retry, preserving the eggs added by your family.","共享采购单，别覆盖家人的修改":"Do not overwrite the family’s update","你改牛奶，家人加鸡蛋。先发现冲突，再安全重试。":"You change milk while a family member adds eggs. Detect the conflict, then retry safely.","进阶":"Advanced","先读后改":"Read before edit","版本冲突":"Stale-version conflict","读新版本后重试":"Reread and retry","展示 fs-observation-policy 与文件系统实现的配合。该策略需要实际挂载，文件读写工具本身不会自动拥有它。":"This shows fs-observation-policy working with a filesystem provider. The policy must be mounted; file tools do not automatically supply it.","三个班分别发来了迎新活动报名表。请合并它们，用学号识别重复报名，告诉我总记录数、实际人数，以及哪些同学重复报名。表格已放在本页，不需要联网。":"Three classes sent registration sheets for a welcome event. Merge them, identify duplicate registrations by student ID, and report the row count, unique people, and duplicate IDs. The sheets are included here; no network is needed.","模型只看到一个原生入口":"The model sees one native entry","该预设加载工具呈现插件，mode: ptc。":"The preset mounts tool presentation with mode: ptc.","原生工具目录：run_code。\n原来的读取等能力以生成的 SDK 供程序调用。":"Native tool catalog: run_code.\nUnderlying read and other capabilities are exposed through a generated SDK.","PTC 预设已装配":"PTC preset composed","先写好处理流程":"Prepare the processing program","伪代码：读取三表 → 按学号分组 → 统计次数 → 只输出合并摘要。":"Pseudocode: read three sheets → group by student ID → count → emit a compact summary.","run_code 开始执行。它可以调用 SDK 中的工具；不会直接拿到无限制的宿主权限。":"run_code begins. It can call SDK tools; this does not grant unrestricted host access.","程序已提交":"Program submitted","程序内部读取三个表":"Read the sheets inside the program","通过 SDK 读取班级 1、2、3 的 CSV。":"Read the CSV for classes 1, 2 and 3 through the SDK.","各表 4 行，共 12 条原始报名。内部工具调用照常经过工具管线。":"Each sheet contains 4 rows: 12 registrations in total. Nested tool calls still pass through the tool pipeline.","3 次内部读取":"Three nested reads","在程序里完成去重":"Deduplicate within the program","这部分是程序内计算，无需把每行原始数据都送回主模型。Standard 也可以通过 shell 程序做批处理；PTC 的区别在工具接口与数据流。":"This is local computation within the program. Standard can also batch work using a shell program; PTC differs in its tool interface and data flow.","12 条报名记录；以 student_id 为键。":"12 registration rows; group by student_id.","计数：S02=2，S03=2，S07=2；其他学号各 1 次。\n唯一学号总数：9。":"Counts: S02=2, S03=2, S07=2; all others=1.\nUnique student IDs: 9.","统计完成":"Aggregation complete","返回简短结果，再写答复":"Return a compact result, then answer","程序只返回计数与重复者列表。":"The program returns only counts and duplicate IDs.","报名记录：12 条\n实际人数：9 人\n多余报名：3 条\n\n重复报名者：\nS02 周宁：2 次\nS03 许禾：2 次\nS07 叶雨：2 次\n\n去重依据是学号。没有删除原表。":"Registration rows: 12\nUnique people: 9\nExtra registrations: 3\n\nDuplicate IDs:\nS02 Zhou Ning: twice\nS03 Xu He: twice\nS07 Ye Yu: twice\n\nDeduplication uses student ID. The source sheets are unchanged.","摘要返回主循环":"Summary returned to the loop","伪代码（流程示意，不是可直接运行的 SDK 代码）：\n读取 3 张报名表\n按 student_id 分组\n输出行数、人数、重复学号":"Pseudocode (conceptual, not executable SDK code):\nRead 3 sheets\nGroup by student_id\nReturn row count, people and duplicate IDs","三张报名表，谁重复报名了？":"Who registered twice across three sheets?","把一连串“读表—合并—去重”交给一段程序。":"Give one program the sequence: read, merge and deduplicate.","PTC 程序调工具":"PTC programmatic calls","内部子调用":"Nested tool calls","只返回必要结果":"Return only needed results","run_code 是模型直接看到的工具入口；程序内部仍通过受控工具完成读取。程序可以在内部处理数据后返回摘要。":"run_code is the model-facing tool entry. Its program still reads through guarded tools and can process data before returning a summary.","我们计划办一场 120 人的迎新活动，预算 1500 元。请让两个子助手分工：一个检查场地容量，一个检查费用，最后告诉我活动能否按原计划举行。只读资料，不订场地、不付款。":"We are planning a welcome event for 120 people with a budget of CNY 1,500. Have two subagents split the checks: one checks venue capacity and the other costs. Tell me whether the plan is feasible. Read only; do not book or pay.","拆成两个可核对的问题":"Split the task into two verifiable checks","子任务 venue：人数是否超容量？\n子任务 budget：总价是否超预算？":"Child venue: does attendance exceed capacity?\nChild budget: does cost exceed budget?","已拆分子任务":"Subtasks planned","给子任务各自建立会话":"Create separate child sessions","新建 venue-01 和 budget-01。":"Create venue-01 and budget-01.","spawn 示例建立新的子会话。fork 则可以继承一段历史，二者用途不同。":"The spawn example creates fresh child sessions. A fork can inherit a history prefix; the two serve different purposes.","子任务已建立":"Child sessions created","第一位助手查场地":"The first child checks the venue","计划 120 人；场地最多 80 人。":"Planned attendance: 120; venue capacity: 80.","venue-01：容量不足，缺 40 个名额。依据：场地确认.txt。":"venue-01: capacity shortfall of 40 places. Evidence: venue confirmation.","场地检查完成":"Venue check complete","第二位助手查费用":"The second child checks the cost","餐费 12 元 × 120 人；固定物料费 120 元；预算 1500 元。":"Meals CNY 12 × 120; materials CNY 120; budget CNY 1,500.","budget-01：总额 1560 元，超出 60 元。依据：费用报价.txt。":"budget-01: total CNY 1,560, exceeding budget by CNY 60. Evidence: price quote.","预算检查完成":"Budget check complete","把两份结论交回主任务":"Bring both results back to the parent","venue-01 与 budget-01 的结论和引用。":"Conclusions and citations from venue-01 and budget-01.","主任务保留两个约束：容量不足；预算超额。不能只看其中一个就宣布可行。":"The parent preserves both constraints: insufficient capacity and excess cost. Either alone would be an incomplete feasibility check.","主任务收到子任务结果":"Parent receives the child results","按目前资料，原计划需要调整。\n\n场地：最多 80 人，比计划少 40 个名额。\n费用：120 × 12 元餐费 + 120 元物料 = 1560 元，超预算 60 元。\n\n建议：先确认是换更大场地还是缩小规模，再按新人数核算预算。\n没有预订场地，也没有付款。":"The current plan needs revision.\n\nVenue: capacity 80, short of the planned 120 by 40 places.\nCost: 120 × CNY 12 for meals + CNY 120 for materials = CNY 1,560, exceeding the budget by CNY 60.\n\nDecide whether to change venues or reduce attendance, then recalculate costs.\nNo booking or payment was made.","活动能办吗？让两位助手分工检查":"Can the event go ahead? Split the checks","一个查人数，一个查钱，主助手把证据拼在一起。":"One checks capacity, one checks money, and the parent combines the evidence.","子 Agent 委派":"Subagent delegation","独立会话":"Separate sessions","结果交叉核对":"Cross-check results","主任务和子任务各有记录，子任务通过提供方运行。给子任务写“只读”任务要求，还需实际权限配置来强制限制。":"Parent and children have separate records and run through providers. A read-only instruction must be backed by permissions to be an enforced boundary.","从本页 1200 份《远星号航行档案》中查清：D-17 改道把目的地改成了哪里、谁批准、为什么改？请引用记录编号与原句。可能遇到很长的历史；即使做了摘要，也不要猜测漏掉的细节。":"Use the 1,200 original Farstar voyage records included here to find where reroute D-17 changed the destination, who authorized it, and why. Cite record IDs and exact evidence. History may get long; do not guess details lost in a summary.","档案很多，先定位相关编号":"Locate relevant record IDs","档案有 1200 份。以 D-17 为目标，分批检索并读取上下文。":"There are 1,200 records. Search and read context for D-17 in batches.","#0187：D-17 拟改道去白鹭港；原因是海棠港航道封闭。":"Record #0187: D-17 proposes Egret Port because Begonia Port’s channel is closed.","正在分批查阅":"Reading in batches","读到批准，记下证据位置":"Read the approval and keep its location","#0674、#0675 相邻，但事件编号不同。":"#0674 and #0675 are adjacent but describe different events.","#0674：D-17 批准人林岚，目的地白鹭港。\n#0675：R-17 批准人孟舟，目的地青石港。":"#0674: D-17, authorizer Lin Lan, destination Egret Port.\n#0675: R-17, authorizer Meng Zhou, destination Bluestone Port.","已发现审批证据":"Approval evidence found","多轮历史挤满了当前窗口":"Several rounds fill the current window","历次请求、工具结果和新问题逐渐累积。":"Requests, tool outputs and follow-up questions have accumulated.","示意压力：86%。演示沿用 0.8 的压缩触发比例。\n这里只演示阈值，不把字符数当作 Token 数。":"Illustrative pressure: 86%. The example uses the 0.8 compaction ratio.\nThis is a threshold illustration, not a character-to-token measurement.","达到演示压力阈值":"Illustrative pressure threshold reached","演示压力 86% · 默认触发比例 80%":"Illustrative pressure 86% · default trigger ratio 80%","先剪长结果，仍然不够":"Prune large results first; pressure remains","可用的 toolResultPruner 先缩短过长工具结果。":"The optional toolResultPruner shortens oversized tool results first.","示意压力：86% → 82%。仍需摘要。\n若裁剪后已足够小，真实后端可以跳过摘要模型调用。":"Illustrative pressure: 86% → 82%. A summary is still needed.\nWhen pruning suffices, the real backend can skip a summarization model call.","裁剪后仍高于阈值":"Pressure still above threshold after pruning","给旧历史写摘要":"Summarize the older history","选取可安全替换的旧历史区间；保留近期内容。":"Select a safely replaceable old-history span and retain recent content.","D-17 因原港航道封闭而改道；申请见 #0187，审批见 #0674。继续检查后续执行记录。":"D-17 requests a reroute after the original channel closed. Request: #0187; approval: #0674. Check the later execution confirmation.","生成摘要":"Generating a summary","模型看摘要，完整日志仍在":"The model sees a summary; the log remains","旧区间由摘要消息替代；原始日志继续保留。示意压力降至 29%。\n摘要是有损信息，不能保证保留每一个姓名。":"A summary message replaces the old span in the current context; the original log remains. Illustrative pressure drops to 29%.\nSummaries are lossy and need not preserve every name.","当前上下文已替换":"Current context replaced","原始日志不删 · 模型当前上下文变短":"Original log retained · Current model context reduced","后续档案确认改道真正执行":"Later evidence confirms the reroute happened","继续查 #0801–#1200；重点验证申请是否已执行。":"Continue in records #0801–#1200 and verify that the request was executed.","#1109：D-17 已生效，远星号最终驶向白鹭港。":"#1109: D-17 is effective; Farstar is proceeding to Egret Port.","执行记录已找到":"Execution confirmation found","摘要里没有姓名，先别补答案":"The summary lacks a name; do not fill it in","已有目的地与原因；摘要没有保留批准人姓名。":"Destination and cause are known; the summary omitted the authorizer’s name.","不能借用旁边 R-17 的“孟舟”。先回到摘要保留的位置 #0674。":"Do not borrow “Meng Zhou” from neighboring R-17. Return to #0674, whose location survived in the summary.","发现证据缺口":"Evidence gap detected","按编号重读，只取需要的原句":"Reread the cited record, not the entire archive","再次读取 #0674 的审批句及上下文。":"Reread the approval sentence and context in #0674.","D-17 审批完成；批准人：林岚；批准目的地：白鹭港。":"D-17 approved; authorizer: Lin Lan; approved destination: Egret Port.","补回准确证据":"Exact evidence recovered","D-17 的最终目的地是白鹭港，批准人是林岚，原因是海棠港航道封闭。\n\n#0187：申请编号 D-17；原因：海棠港航道封闭；拟改目的地：白鹭港。\n#0674：D-17 审批完成；批准人：林岚；批准目的地：白鹭港。\n#1109：执行确认：D-17 已生效；远星号最终驶向白鹭港。\n\n#0675 属于 R-17，其批准人和目的地不能用于回答 D-17。\n摘要漏掉的姓名已通过重新读取 #0674 确认。":"D-17’s final destination is Egret Port, authorized by Lin Lan because Begonia Port’s channel was closed.\n\n#0187: Request D-17; cause: Begonia Port channel closure; proposed destination: Egret Port.\n#0674: D-17 approved; authorizer: Lin Lan; approved destination: Egret Port.\n#1109: Execution confirmed: D-17 is effective; Farstar is proceeding to Egret Port.\n\n#0675 concerns R-17, so its authorizer and destination do not answer the D-17 question.\nThe missing name was verified by rereading #0674.","1200 份航行档案，找回三条线索":"Find three linked clues in 1,200 voyage records","找目的地、批准人和原因。摘要漏掉姓名时，回原文补证据。":"Find the destination, authorizer and cause; reread when a summary loses the name.","挑战":"Advanced","超长多轮上下文":"Long multi-turn context","压缩 + 裁剪":"Compaction + pruning","摘要遗失后重查":"Recover from summary loss","长上下文检索与压缩是两回事。本例分批查阅原创档案，再演示历史压力、摘要替换和回查；不宣称完成模型长上下文评测。":"Long-context retrieval and compaction are distinct. This original corpus illustrates batched reading, pressure, replacement and rereading. It is not a model benchmark.","D-17 因海棠港航道封闭拟改到白鹭港；#0674 的批准人是林岚。保留原句和记录编号，继续查执行记录。":"D-17 proposes Egret Port because Begonia Port’s channel is closed. #0674 names Lin Lan as the authorizer. Keep the quote and record IDs, and check execution.","摘要保留了姓名，也要核对出处":"Even a complete summary needs a source check","摘要保留：林岚、白鹭港、#0674。":"Summary retained: Lin Lan, Egret Port and #0674.","三个字段都有来源。最终引用前，用 #0674 原句核对一次。":"All three fields have a source. Verify the original #0674 sentence before citing it.","关键字段保留":"Key fields retained","D-17 的最终目的地是白鹭港，批准人是林岚，原因是海棠港航道封闭。\n\n#0187：申请编号 D-17；原因：海棠港航道封闭；拟改目的地：白鹭港。\n#0674：D-17 审批完成；批准人：林岚；批准目的地：白鹭港。\n#1109：执行确认：D-17 已生效；远星号最终驶向白鹭港。\n\n#0675 属于 R-17，其批准人和目的地不能用于回答 D-17。\n摘要保留了关键字段，最终答复仍核对原句。":"D-17’s final destination is Egret Port, authorized by Lin Lan because Begonia Port’s channel was closed.\n\n#0187: Request D-17; cause: Begonia Port channel closure; proposed destination: Egret Port.\n#0674: D-17 approved; authorizer: Lin Lan; approved destination: Egret Port.\n#1109: Execution confirmed: D-17 is effective; Farstar is proceeding to Egret Port.\n\n#0675 concerns R-17, so its authorizer and destination do not answer the D-17 question.\nThe summary retained key fields; the final answer still verifies the original wording.","摘要漏掉姓名":"Summary loses the name","摘要保留关键线索":"Summary keeps key evidence","每次聚餐都要分账。请在当前会话里做一个临时分账面板，输入三个人各自付款金额就能算转账建议。先说明会用到的能力，等我批准再运行。演示后停止它，不修改仓库配置。":"We split dinner bills frequently. Build a temporary panel in this session that takes three payments and suggests transfers. Explain the capabilities first and run it only after my approval. Stop it after the demo; do not edit repository configuration.","先查看有哪些可用接口":"Inspect the available contracts first","cordis_inspect_list / cordis_inspect_query：查询可用服务、工具或浏览器插槽。":"cordis_inspect_list / cordis_inspect_query: query live services, tools or browser slots.","读取当前环境公开的接口后再写定义，不凭记忆编造可调用方法。":"Read the live exposed contract before authoring a definition; do not invent callable methods.","接口查询完成":"Contract inspection complete","写好定义，但还没有运行":"Define it without running it","cordis_define：保存一个含浏览器界面的新插件版本。":"cordis_define: record a new plugin version with a browser interface.","已通过参数与语法检查；仅保存在进程内。尚未运行，也未在此步骤申请批准。":"Parameters and syntax pass validation. The definition is in memory only; nothing runs or requests approval at this stage.","定义已保存":"Definition recorded","运行浏览器部分前等待批准":"Wait for approval before the browser half runs","cordis_run：请求激活刚定义的浏览器面板。":"cordis_run: request activation of the defined browser panel.","返回 awaiting-approval 收据。它表示已发起运行请求，不能当作面板已成功运行。":"Returns an awaiting-approval receipt. It confirms a request, not a successfully running panel.","等待用户批准":"Awaiting user approval","获准运行，在面板里试算":"After approval, try the panel","用户已批准本次运行；进入 running 状态。":"The user approves this run; it enters running state.","试算：96、54、30 元 → 总额 180 元；每人 60 元。\n点击“试用分账面板”，可以在本网页调整金额。":"Try 96, 54, 30 → total 180; each pays 60.\nUse “Try the calculator” to adjust amounts locally on this page.","临时面板运行中（教学）":"Temporary panel running (teaching)","临时面板示意 · 未实际启动 DSH 插件":"Temporary panel preview · No live DSH plugin","用完停下，保留可追溯的定义":"Stop after use and keep the definition","cordis_stop：停止当前插件运行，取消待处理审批。":"cordis_stop: stop the current run and cancel pending approval.","状态：stopped。定义和版本可继续保留；本次没有修改 cordis.yml，也没有安装包。":"State: stopped. Definitions and versions can remain. No cordis.yml edit or package installation occurred.","当前运行已停止":"Current run stopped","临时分账面板已完成一次演示，并已停止。\n\n96、54、30 元 → 总额 180 元，每人 60 元；转账 6 元和 30 元给安安。\n\ncordis_define 只保存定义；cordis_run 才激活。\ncordis_stop 停止当前运行，定义仍可保留；cordis_undefine 才移除插件。\n这些定义保存在进程内，重启后不会自动变成已安装插件。":"The temporary split-bill panel was demonstrated and then stopped.\n\nCNY 96, 54, 30 → total 180, share 60; transfer 6 and 30 to An.\n\ncordis_define records a definition; cordis_run activates it.\ncordis_stop stops the run but can keep its definition; cordis_undefine removes it.\nDefinitions are process-local and do not automatically become installed plugins after restart.","从使用现成工具，走到定义、批准、运行与停止临时面板。":"Go from using existing tools to defining, approving, running and stopping a panel.","开发者":"Developer","Cordis 动态扩展":"Cordis dynamic extension","先定义，再运行":"Define before running","生命周期与信任边界":"Lifecycle and trust boundary","展示当前七个 Cordis 工具的生命周期。动态代码可能影响同进程其他会话，必须按高信任操作对待；本网页只播放教学状态。":"This shows the current seven-tool Cordis lifecycle. Dynamic code may affect other sessions in the process and requires high trust; this page only plays teaching states.","打开现成的完整工具箱":"Open the standard toolbox","模型看到读取、搜索、shell 等原生工具。":"The model sees native read, search, shell and other tools.","本例只用读取与简单计算，不会为了展示功能强行调用子任务。":"This example only reads and calculates. It does not invoke a subagent just to demonstrate a feature.","Standard 已装配":"Standard composed","分别读取三张小票":"Read the three receipts","read：安安、波波、晨晨的小票。":"read: the receipts for An, Bo and Chen.","付款额：96、54、30 元。":"Payments: CNY 96, 54, 30.","读取完成":"Reads complete","用 shell 核对算术":"Check the arithmetic with the shell","bash / pwsh：汇总付款额并除以 3。":"bash / pwsh: sum the payments and divide by 3.","总额 180 元；每人 60 元；差额 +36、−6、−30。":"Total 180; share 60; balances +36, −6, −30.","用一个入口调用底层工具":"Call underlying tools through one entry","模型原生目录：run_code。":"Model-visible native catalog: run_code.","读取与计算流程编排在一段程序内；依然使用受控 SDK 工具。":"Reading and calculation are orchestrated within one program using guarded SDK tools.","PTC 已装配":"PTC composed","在程序内读取与计算":"Read and calculate inside the program","SDK 读取三张小票，然后在程序内计算均摊。":"Read three receipts through the SDK, then calculate the equal share within the program.","只输出必要结果：total=180, share=60, transfers=[6,30]。":"Return only the necessary result: total=180, share=60, transfers=[6,30].","内部处理完成":"Nested processing complete","先判断要不要新增工具":"Decide whether a new tool is useful","一次分账用现成工具即可。这里为对照，展示以后要反复分账时的临时面板路径。":"Existing tools suffice for one bill. For comparison, this route shows a temporary panel useful for repeated bills.","检查使用场景":"Checking the use case","只带两件工具":"Just two tools","极简":"Minimal","固定提示词 + 持久 shell + 文本编辑器。":"Fixed prompt, persistent shell, and text editor.","用少量工具完成读取、编辑与命令计算。":"Read, edit, and calculate with a small tool surface.","没有压缩、技能与子任务工具。编辑器使用局部 fs-local；不要把“极简”理解为最严格的文件隔离。":"No compaction, skills, or delegation tools in this preset. Its editor uses local fs-local; a minimal tool set does not imply the strictest filesystem isolation.","完整固定提示词；不注入运行时上下文。":"A complete fixed prompt; runtime-context snapshots are suppressed.","查看小票 → shell 计算 → 转账建议":"View receipts → shell calculation → transfers","2 个工具入口":"2 tool entries","完整固定":"Complete and fixed","未挂载":"Not mounted","无委派工具":"No delegation tools","用现成工具办事":"Use the existing toolbox","标准":"Standard","模型直接选择读取、搜索、命令等原生工具。":"The model directly chooses native read, search, shell and other tools.","适合多步骤任务：文件、搜索、计划、委派、上下文整理。":"For multi-step work: files, search, planning, delegation and context management.","能力由预设与宿主共同提供。列出工具不表示已获执行许可。":"Capabilities come from both the preset and host. A listed tool does not imply permission to execute it.","可组合提示词；多项能力按需使用。":"Composable prompts; use the available capabilities as needed.","read 三张小票 → shell 计算 → 转账建议":"read three receipts → shell calculation → transfers","多个原生工具":"Multiple native tools","按插件组合":"Plugin-composed","已挂载":"Mounted","写程序来调用工具":"Orchestrate tools in a program","程序化":"Programmatic","模型调用 run_code，程序通过生成的 SDK 使用工具。":"The model calls run_code; the program uses tools through a generated SDK.","在程序内组合、循环、过滤或汇总，只返回需要的结果。":"Compose, loop, filter, or aggregate inside the program and return only needed results.","内部工具仍受执行管线约束。workflow 工具在该预设中禁用；工作流引擎仍可供 ralph 使用。":"Nested tools remain guarded. The workflow tool is disabled in this preset; its engine remains available for ralph.","主要继承 Standard 的能力；改变的是模型可见的工具呈现。":"Retains most Standard capabilities while changing the model-facing tool presentation.","run_code → SDK 读表 → 程序内计算 → 精简结果":"run_code → SDK reads → in-program calculation → compact result","仅 run_code":"run_code only","可组合 + 工具 SDK":"Composable + tool SDK","SDK 内调用":"Via the SDK","SDK 内 spawn / fork":"spawn / fork via SDK","工具禁用，保留引擎":"Tool disabled; engine retained","临时添加自己的工具":"Add a temporary capability","扩展":"Extensible","在 Standard 基础上，检查、定义、运行动态插件。":"Add dynamic-plugin inspection, definition and execution to Standard.","为重复任务制作临时工具或界面，也能编写新的预设副本。":"Build temporary tools or interfaces for repeated work, or author a copied preset.","属于高信任能力。动态代码可影响同进程其他会话；定义、运行与安装是不同操作。":"A high-trust capability: dynamic code can affect other sessions in the process. Defining, running and installing are distinct operations.","增加 Cordis 七工具及配置编写技能；不用废弃的 cordis_m t","小票-安安.txt":"Receipt-An.txt","小票-波波.txt":"Receipt-Bo.txt","小票-晨晨.txt":"Receipt-Chen.txt","照片清单.txt":"Photo list.txt","采购单-v1.txt":"Grocery-list-v1.txt","家人更新后的-v2.txt":"Family-update-v2.txt","预期-v3.txt":"Expected-v3.txt","班级-1-报名.csv":"Class-1-registrations.csv","班级-2-报名.csv":"Class-2-registrations.csv","班级-3-报名.csv":"Class-3-registrations.csv","活动方案.txt":"Event plan.txt","场地确认.txt":"Venue confirmation.txt","费用报价.txt":"Cost estimate.txt","档案说明.txt":"Archive guide.txt","面板需求.txt":"Panel requirements.txt","案例库与四种模式":"Case library and four presets","先看案例的资料、目标和能力标签。四种模式页用同一顿饭展示不同工具组织方式；分账案例内也能切换独立路线。长文案例提供可搜索的全文与两种摘要分支。":"Start with each case’s materials, goal and feature tags. The preset lab uses one dinner bill to compare tool organization; the bill case also offers independent routes. The long-document case includes a searchable full corpus and two summary branches.","DSH 是怎么完成一项任务的？":"How does DSH complete a task?","三人聚餐后，怎样算清转账？":"After dinner, how should three people settle up?","整理照片前先确认：用户拒绝后会发生什么？":"Before organizing photos: what happens after the user refuses?","修改共享采购单时，怎样保留家人的更新？":"How do you preserve a family member’s changes to a shared shopping list?","合并三张报名表，找出重复报名的人":"Merge three registration sheets and find duplicate sign-ups","迎新活动能否按计划举办？让两个子 Agent 分别核对":"Can the welcome event go ahead? Ask two subagents to verify it","从 1200 份航行档案中找出三条关键线索":"Find three key clues in 1,200 voyage records","创造模式：临时做一个分账工具":"Create mode: build a temporary bill-splitting tool","接收任务并建立会话":"Receive the task and open the session","记录结果并完成本轮任务":"Record the result and finish the turn","组装模型可用的工具与提示词":"Assemble the tools and prompt for the model","读取官方资料作为依据":"Read official material as evidence","把核心概念翻译成通俗说明":"Translate the core concepts into plain language","Minimal 只提供两种模型可见工具":"Minimal exposes only two model-visible tools","读取三张小票":"Read the three receipts","在持久 Shell 中计算均摊":"Calculate the split in the persistent shell","生成可核对的转账方案":"Generate a checkable transfer plan","读取照片清单并生成归档方案":"Read the photo list and prepare an archive plan","移动操作进入审批流程":"Send the move operation to approval","用户拒绝本次移动操作":"The user rejects this move","记录拒绝结果并返回主循环":"Record the denial and return to the loop","读取采购单并记录当前版本":"Read the shopping list and record its version","文件在写入前被其他人更新":"Another user updates the file before the write","检测到版本变化，阻止旧版本写入":"Detect the version change and block the stale write","重新读取最新版本，保留新增内容":"Reread the latest version and preserve the new item","基于最新版本只修改牛奶数量":"Change only the milk quantity on the latest version","PTC 只向模型暴露 run_code":"PTC exposes run_code as the model-facing entry","模型生成批处理程序":"The model writes a batch-processing program","程序通过工具 SDK 读取三张表":"The program reads three sheets through the tool SDK","在程序内合并并按学号去重":"Merge and deduplicate by student ID inside the program","只返回汇总结果，再生成答复":"Return only the summary, then write the answer","把任务拆成场地与预算两个子问题":"Split the task into venue and budget checks","分别启动两个子 Agent 会话":"Start two subagent sessions","子 Agent 1 核对场地容量":"Subagent 1 checks venue capacity","子 Agent 2 核对活动预算":"Subagent 2 checks the event budget","主 Agent 汇总两份子任务结果":"The parent agent combines both subtask results","先搜索相关编号，缩小查阅范围":"Search for relevant IDs first","读取审批记录并保存证据位置":"Read the approval record and preserve its source","多轮历史接近上下文窗口上限":"Conversation history approaches the context limit","先裁剪过长工具结果":"Prune oversized tool results first","压缩较早的会话历史":"Compact older conversation history","用压缩后的上下文继续任务":"Continue with the compacted context","读取后续记录，确认改道已经执行":"Read later records to confirm the reroute was executed","摘要缺少批准人姓名，暂停推断":"The summary omits the authorizer; stop and verify","按记录编号回查原文":"Reread the source record by ID","摘要保留关键信息，最终引用仍回查原文":"The summary kept the key evidence; still verify the source before quoting","检查当前运行时可用接口":"Inspect the interfaces available in the current runtime","定义临时工具，暂不运行":"Define the temporary tool without running it","运行临时界面前请求批准":"Request approval before running the temporary UI","批准后运行临时分账面板":"Run the temporary bill-splitting panel after approval","停止临时工具并保留定义记录":"Stop the temporary tool and keep its definition record","Standard 提供完整的原生工具集":"Standard exposes the full native toolset","用原生 read 工具读取三张小票":"Read the three receipts with the native read tool","用 Shell 核对均摊计算":"Verify the split with the shell","PTC 通过 run_code 组织底层工具":"PTC orchestrates underlying tools through run_code","程序内部完成读取与计算":"Read and calculate inside the program","判断重复任务是否值得创建临时工具":"Decide whether a repeated task deserves a temporary tool","创造模式":"Create mode","创造":"Create","在 Standard 基础上，检查运行时并定义、运行临时插件。":"Build on Standard by inspecting the runtime, then defining and running temporary plugins.","从一个具体问题开始认识 DSH。":"Start learning DSH with a concrete problem.","看清每一步是怎么发生的。":"See how every step actually happens.","每个案例都包含资料、过程和答案。可以按难度逐步探索，也可以直接进入感兴趣的能力。":"Every case includes materials, execution, and an answer. Follow the difficulty ladder or jump straight to a capability you care about.","同一个模型，换一套预设，能力组合会怎样变化？":"Same model, different preset: see how the capability mix changes.","四种预设，一眼看懂能力组合的差别。":"Four presets, with their capability differences visible at a glance.","这里比较工具组织方式，不对模型能力排序。流程阶段用于教学说明，不能用来推算真实调用次数或性能。":"This compares tool organization, not model intelligence. Teaching stages do not represent fixed call counts or performance.","阅读资料本身不会触发压缩。只有进入会话的内容和历史压力达到配置条件时，压缩后端才会介入。":"Reading a file alone does not trigger compaction. The backend becomes relevant when content has entered the conversation and configured pressure conditions are met.","流程示意（用于说明处理步骤，不能直接作为 SDK 程序运行）：\n读取 3 张报名表\n按 student_id 分组\n输出记录数、实际人数和重复学号":"Process sketch (illustrative, not executable SDK code):\nRead 3 registration sheets\nGroup by student_id\nReturn record count, unique people, and duplicate IDs","按需创建临时工具或界面":"Create a temporary tool or interface on demand","四种预设，一眼看清能力组合的差别。":"Four presets, with their capability differences visible at a glance.","提示词中的“先征求确认”需要由实际审批策略落实。本例把文件移动配置为必须先获批准，因此拒绝会在文件操作真正执行前生效。":"A prompt that asks for confirmation must be backed by an actual approval policy. Here, file moves require approval, so a denial takes effect before the file operation runs.","本次照片整理已取消，3 张照片仍保留在原来的位置。\n移动：0 张；删除：0 张；内容修改：0。\n\n如果之后决定继续，可以重新确认移动方案并发起操作。":"Photo organization was cancelled. All three photos remain in their original locations.\nMoved: 0; deleted: 0; contents changed: 0.\n\nIf you decide to continue later, confirm the move plan again and start a new operation.","检测到外部更新":"External update detected","重新核对并补全证据":"Evidence rechecked and completed","汇总结果返回主循环":"Summary returned to the main loop","采购单出现外部更新":"Shopping list changed externally","证据不足，暂停结论":"Insufficient evidence; pause the conclusion","从官方介绍出发，用一个完整任务认识模型、工具、执行循环和会话记录。":"Start with the official introduction and follow one complete task to understand the model, tools, execution loop, and session record.","理解 DSH 的基本分工：模型决定下一步，工具执行具体动作，Agent Loop 负责推进任务，会话保存过程与结果。":"Understand the basic division of work in DSH: the model chooses the next step, tools perform concrete actions, the Agent Loop advances the task, and the session preserves the process and result.","我不会编程。请读 DSH 的官方介绍，用“接收任务 → 读取资料 → 执行动作 → 汇报结果”解释它怎样完成一项任务。再告诉我每一步主要由哪个源码包负责。不要修改文件。":"I do not code. Read the official DSH introduction and explain one task as “receive task → read material → perform action → report result”. Then name the source package mainly responsible for each stage. Do not modify files.","读取三张小票，计算均摊金额，再生成一份可以直接照着转账的结果。":"Read three receipts, calculate the equal split, and produce a transfer plan that can be followed directly.","Minimal 只向模型提供两种工具，但仍能完成读取资料和简单计算；这个案例还可用来横向比较四种预设。":"Minimal exposes only two tools to the model, yet it can still read material and perform simple calculations. This case also compares the four presets side by side.","周末聚餐，安安付了 96 元，波波付了 54 元，晨晨付了 30 元。三人平摊。请读取三张小票，算出总额、每人应付金额和最终转账方案。请直接给出结果和核对过程，无需展示代码。":"At dinner, An paid CNY 96, Bo paid CNY 54, and Chen paid CNY 30. Split the cost equally. Read the three receipts, calculate the total and each person’s share, and provide the final transfer plan with a short verification. No code is needed.","临时面板教学演示 · 未启动真实 DSH 插件":"Temporary panel teaching demo · no live DSH plugin started","系统先列出移动方案并请求批准；用户拒绝后，文件操作停止在真正执行之前。":"The system first proposes the moves and requests approval. If the user declines, the file operation stops before execution.","请把三张旅行照片按拍摄月份整理到对应文件夹。先列出移动方案，等我明确同意后再执行。不要删除照片，也不要修改照片内容。":"Organize the three travel photos into folders by capture month. First show the move plan and wait for my explicit approval before executing. Do not delete or modify the photos.","用户拒绝 · 未执行文件移动":"User declined · no file move executed","用户回复：先不要移动，我要把方案发给朋友确认。":"User reply: Do not move anything yet. I want to send the plan to a friend for confirmation.","任务只要求把牛奶改成 4 盒，但家人同时加入了鸡蛋。系统需要先发现版本冲突，再基于最新内容重试。":"The task only changes milk to four cartons, while a family member adds eggs at the same time. The system must detect the version conflict and retry against the latest content.","展示文件观察策略与文件系统实现如何配合：先读取版本，写入前重新校验，发现变化后要求重新读取。":"See how the file-observation policy works with the filesystem provider: read a version, revalidate before writing, and require a reread if the file changed.","这里模拟另一位用户同时更新采购单。当前 Agent 还持有旧版本，因此下一次写入需要重新校验。":"This simulates another user updating the shopping list concurrently. The current agent still holds an older version, so the next write must be revalidated.","检测到版本冲突 · 重新读取最新文件":"Version conflict detected · reread the latest file","让一段程序连续读取、合并和去重三张表，只把最终统计结果交回主模型。":"Use one program to read, merge, and deduplicate three sheets, returning only the final statistics to the main model.","PTC 让模型通过 run_code 组织多个工具调用；程序可以在内部处理大量中间数据，再返回精简结果。":"PTC lets the model orchestrate multiple tool calls through run_code. The program can process large intermediate data internally and return a compact result.","去重在程序内部完成，主模型只接收汇总结果。Standard 也能通过 Shell 执行脚本；PTC 的重点是模型通过 run_code 和工具 SDK 组织数据流。":"Deduplication happens inside the program, so the main model receives only the summary. Standard can also run scripts through the shell; PTC specifically organizes the data flow through run_code and the tool SDK.","一个子 Agent 核对场地容量，另一个核对预算，主 Agent 最后汇总两份证据。":"One subagent checks venue capacity, another checks the budget, and the main agent combines both pieces of evidence.","主任务与子任务拥有各自的会话记录。任务描述可以要求子 Agent 只读，真正的权限限制仍由实际策略配置决定。":"The main task and subtasks have separate session records. A prompt can request read-only behavior, while actual permission boundaries still depend on the configured policies.","在大量记录中找到改道目的地、批准人和原因；当摘要漏掉细节时，回到原始记录重新核对。":"Find the reroute destination, approver, and reason across many records; if the summary omits a detail, return to the original record and verify it.","长文检索与上下文压缩是两类问题。本例先分批查阅原创档案，再展示会话历史接近窗口上限时的裁剪、摘要替换和原文回查。":"Long-document retrieval and context compaction are separate problems. This case first searches an original archive in batches, then demonstrates pruning, summary replacement, and source rereading as conversation history approaches the context limit.","完整会话日志保留 · 模型当前上下文已压缩":"Full session log retained · current model context compacted","先检查运行时提供的接口，再定义一个临时分账面板；得到批准后运行，演示结束后停止。":"Inspect the runtime interfaces first, define a temporary bill-splitting panel, run it after approval, and stop it when the demo is finished.","展示创造模式（Cordis preset）的动态扩展流程。模型可以检查、定义和运行临时能力；动态代码属于高信任操作，本页只演示状态变化。":"See the dynamic-extension flow of Create mode (the Cordis preset). The model can inspect, define, and run temporary capabilities. Dynamic code is a high-trust operation; this page only demonstrates state changes.","进入任务导览":"Open task walkthrough","配置热更新":"Configuration HMR","由 hmr 插件提供的服务。具体接口与边界见官方说明。":"A service owned by hmr. See the official reference for its contract and boundaries.","本图列出锁定版本的静态服务关系。是否调用取决于配置和任务；这些连线不是实测轨迹。":"Static service relationships at the pinned revision. Actual calls ions validate.","当前文件与已观察版本不同，写入被拒绝并返回 FS_STALE_VERSION，提示先重新读取。":"The file no longer matches the observed version. FS_STALE_VERSION refuses the mutation and requests a fresh read.","重新读取确认新增的鸡蛋仍在，再基于当前内容构造修改。":"Read again, retain the newly added eggs, and prepare the edit against current content.","三张表共 12 条报名记录，去重键是学号。先确定规则，再动数据。":"The three tables contain 12 rows. Student ID is the deduplication key.","PTC 把工具呈现为 run_code；内部工具仍存在，只是通过程序中的 SDK 绑定调用。":"PTC presents run_code. Internal tools still exist and are called through program SDK bindings.","顶层 run_code 与内部子调用都经过工具管线，子调用使用 tool/ptc-dispatch 记录。":"Both run_code and its sub-calls pass through the tool pipeline. Sub-calls use tool/ptc-dispatch records.","结果被记录，任务结束。网页里的去重演示不调用真实模型。":"Record the outcome and finish the task. This teaching page makes no real model call.","子 Agent 加入父级预设组合，同时有各自会话状态。画面中的两个岗位是教学角色。":"Child agents join the parent preset composition while keeping separate session state. The two roles are teaching labels.","场地只能容纳 80 人，而计划有 120 人：缺少 40 个位置。":"The venue holds 80 people, but 120 are planned: a shortfall of 40 places.","餐费 120 × 12 元，加 120 元材料费，共 1560 元，超出 1500 元预算 60 元。":"Meals cost 120 × 12 plus 120 for materials: 1560 total, 60 above the 1500 budget.","上下文压力百分比是讲解用数值；压缩阈值依配置与模型窗口而定。可选 pruner 可能让摘要调用不再必要。":"Pressure percentages are illustrative. Thresholds depend on configuration and model window; the optional pruner may avoid summarization.","把 DSH 变成一家像素风 AI 公司":"Turn DSH into a pixel-art AI company","大肥鲸开公司：办公室是插件，第一单是番茄钟。":"The Big Whale starts a company: an office plugin, then a Pomodoro order.","安装一个像素办公室插件，再用它讲清一项任务的分工与交付。":"Install a pixel-office plugin, then explain task delegation and delivery.","请把 DSH 变成一家像素风 AI 公司。先检查接口，制作并安装办公室插件，确认生效。第一单：给大肥鲸做一个能开始、暂停和复位的番茄钟网页，并检查暂停后倒计时是否停止。":"Turn DSH into a pixel-art AI company. Inspect APIs, create and install an office plugin, and confirm activation. First order: build a Pomodoro page with start, pause and reset; test that pause actually stops the countdown.","教学假设：Web Profile、Creator 预设、可用的 Plugin Manager 与客户端页面。所有安装和 Agent 状态均为编排示例。":"Teaching assumptions: Web profile, Creator preset, Plugin Manager and a connected client. All installation and agent states are scripted examples.","老板只带来一句需求，办公室却要忙起来。先把像素办公室装成插件，再让设计、开发、测试按任务板分工；发现一个暂停 bug，修好再交付。":"One request gets the office moving. Install the office plugin, then assign design, development and testing. Find a pause bug, fix it, and deliver.","持久插件":"Persistent plugins","岗位分工":"Role-based tasks","检查与返工":"Test and revise","区分检查接口、安装保存、运行时生效与实际使用。像素员工是教学状态的可视化，不是独立运行的真实 Agent。":"Separate API discovery, saved installation, runtime activation and actual use. Pixel employees visualize teaching states, not independent live agents.","示例办公室呈现任务分工；番茄钟示例支持开始、暂停、复位。实际 DSH 插件未在本网站安装。":"The sample office shows task roles. The timer supports start, pause and reset. This website does not install a real DSH plugin.","接单：先开公司，再做番茄钟":"Take the order: office first, timer next","检查当前 Host 与 Client 接口":"Inspect Host and Client APIs","制作办公室插件包":"Prepare the office plugin bundle","按检查到的接口制作客户端组件与 bundle 配置。此处的办公室图像是 AI 生成的教学素材，不是官方界面。":"Prepare client components and a bundle using verified APIs. This office image is AI-generated teaching art, not an official screenshot.","安装并检查应用状态":"Install and inspect application status","Plugin Manager 安装持久 bundle。保存成功和运行时生效分别检查；restart-required 表示仍需重启。":"Plugin Manager installs a persistent bundle. Check saved state separately from activation; restart-required still needs a restart.","确认办公室可用，再分派订单":"Confirm the office works; assign the order","本教学分支假设 application: applied，且浏览器组件已同步显示。主 Agent 再把设计、开发、测试的任务边界写清楚。":"This branch assumes application: applied and successful browser synchronization. The parent then defines design, development and testing tasks.","设计与开发：别把暂停键画成摆设":"Design and build: pause must actually pause","设计给出清楚的按钮和状态；开发实现番茄钟。岗位对应教学中的子任务，具体执行取决于配置的委派提供方。":"Design defines clear controls and states; development implements the timer. Roles are teaching subtasks; real delegation depends on the provider.","测试发现：暂停后还在偷偷倒数":"Test finds the countdown keeps running","修复后复测，交付可用示例":"Fix, retest, and deliver the sample","开发修正计时状态，再检查开始、暂停、复位。下方可打开本网站的实际番茄钟示例。":"Correct the timer state, then check start, pause and reset. Open this website’s working timer sample below.","下班：停用与移除也是生命周期":"Clock out: disable or remove the plugin","# PTC：tools 管理 run_code 呈现，ptcRuntime 运行程序。\n# 内部子调用仍通过工具执行管线。":"# PTC: tools owns run_code presentation; ptcRuntime executes programs.\n# Sub-calls still pass through the tool pipeline.","给 DSH 装上新本领":"Install new capabilities","检查运行时接口，通过 Plugin Manager 管理持久插件。":"Inspect runtime APIs and manage persistent plugins with Plugin Manager.","制作或安装可复用的工具与界面，例如像素办公室。":"Create or install reusable tools and interfaces, such as a pixel office.","变更属于当前 Profile；保存、Host 生效和浏览器同步分别检查。":"Changes belong to the current profile. Check saving, Host activation and browser synchronization separately.","Creator 增加只读检查与插件管理；安装能力不等于所有操作都已授权。":"Creator adds read-only inspection and plugin management. Available capabilities do not imply permission for every action.","读取小票 → 用现有工具计算 → 汇报；需要复用时再安装插件":"Read receipts → calculate with existing tools → report; install a plugin only when reuse warrants it","原生工具 + 检查 + 插件管理":"Native tools + inspection + plugin management","加入插件开发指导":"Plugin development guidance","只读检查与持久插件管理":"Read-only inspection and persistent plugin management","接口、提供方与使用方":"Contract, providers and consumers","本步骤参与的组件":"Components in this step","声明":"Definition","调用方":"Consumers","大肥鲸导览":"Meet the Big Whale","案例库 ↗":"Cases ↗","Creator 扩展工具":"Creator extensions","Creator 使用只读检查与 Plugin Manager 管理持久插件。":"Creator uses read-only inspection and Plugin Manager for persistent plugins.","关系图列出声明包、直接消费者和实现方；这些是结构关系，不表示实际调用时序。":"The diagram lists the declaration owner, direct consumers and providers. These are structural relationships, not runtime call order.","当前服务的职责、角色、声明与实现":"Current service responsibilities, roles, definitions and providers","工具策略、守卫与结果处理":"Tool policy, guards and result handling","SessionEvent 与持久记录边界":"SessionEvent and durable-record boundaries","DSH Inside 是基于 DeepSeek Harness 官方源码制作的独立交互式导览。通过逐步任务导览和单服务剖面，把复杂关系拆成可连续阅读的过程。":"DSH Inside is an independent interactive guide based on the official DeepSeek Harness source. Task walkthroughs and service views make complex relationships readable.","服务名称、角色、声明包、实现方及直接消费者来自 capability-seams.md。任务主链核对了 agent-loop、tools 和 session 的关键源码。大肥鲸的空间布局、中文讲解、任务示例和播放速度为本项目设计。":"Service names, roles, owners, providers and consumers come from capability-seams.md. The task flow is checked against agent-loop, tools and session. The whale layout, explanations, examples and playback timing are this project's teaching design.","可点击“减少动态”。模型无法显示时提供文字组件视图；平面关系图可随时使用。":"Choose Reduce motion for a quieter view. If models are unavailable, use the text components; the flat relationship view remains available.","3D 视图支持拖动旋转、滚轮缩放和触屏双指缩放；“平面”会显示本步骤的二维组件关系，适合连续阅读任务步骤。点击组件可查看职责，“展开层级”只影响 3D 视图。":"Rotate by dragging, zoom with the wheel or a two-finger gesture. Flat view shows the current step's components. Select a component for its role. Expansion affects only the 3D view.","搜索中文、ctx key 或包名。“剖面”列出所选服务的声明、消费者和实现方。点击提供方只切换结构示意，不改变真实配置。":"Search by name, ctx key or package. The service view lists definitions, consumers and providers. Selecting a provider changes only the teaching view, not a real configuration.","这个案例会展示什么":"What this case shows","模型与工具如何配合":"How models and tools work together","一次任务如何循环推进":"How a task progresses through the loop","源码结构与通俗概念对照":"Source structure in plain language","查看案例资料":"View case materials","直接查看最终结果":"Jump to the final result","选择案例":"Choose a case","开始播放导览":"Play the walkthrough","三维视图保留空间层级，并持续连接上一阶段与当前阶段。":"The 3D view connects each teaching step to the relevant components.","平面":"Flat","Minimal 的精简工具集":"Minimal’s compact toolset","持久 Shell 如何参与计算":"Calculating with a persistent shell","同一任务对比四种预设":"Compare four presets on one task","切换预设进行对照":"Compare preset routes","每条路线都是独立的教学演示，不会修改真实 DSH 配置。":"Each route is a separate teaching simulation; no real DSH configuration is changed.","用户审批如何进入工具管线":"Approval in the tool pipeline","拒绝结果如何返回主循环":"Returning a refusal to the loop","工具执行前的安全边界":"Boundaries before execution","先读后改的文件观察":"Read-before-edit observations","并发修改导致版本冲突":"Conflicts from concurrent edits","重新读取后安全重试":"Read again before retrying","PTC 程序化工具调用":"Programmatic tool calling with PTC","程序内部的多次子调用":"Sub-calls inside a program","减少返回给主模型的中间数据":"Return less intermediate data to the main model","子 Agent 分工协作":"Subagent delegation","主 Agent 汇总多路结果":"The parent combines results","工具结果裁剪与上下文压缩":"Tool-result pruning and compaction","摘要缺失细节后的原文回查":"Recover missing details from original records","可切换三维与平面视图的 Harness 架构。也可通过接口图鉴访问全部服务。":"Harness architecture in 3D and flat views. The atlas also lists every service.","切换三维总览":"Show 3D overview","三维总览":"3D overview","切换平面视图":"Show flat view","平面视图":"Flat view","平面模式":"Flat mode","平面视图固定布局与方向，适合逐步阅读完整任务流程。":"Flat view uses a stable layout for reading the task step by step.","把一个服务单独展开，查看它的调用方、声明包和实现方。":"Inspect one service, its consumers, definition and providers.","只定位日志能够支持的相关服务，不补画日志中没有的调用。":"Show only services supported by the log; do not invent unrecorded calls.","全部":"All","任务与资料":"Task & materials","八件小事。":"Eight small jobs.","分账、整理照片、改共享采购单……每个案例都从一句话开始，逐步展示 DSH 读了什么、调了哪个工具、在哪里停下来等你。":"Splitting a bill, sorting photos, editing a shared shopping list: each case starts from one request and shows, step by step, what DSH read, which tool it called, and where it stopped to wait for you.","同一个模型，换一套预设，能用的工具就不一样。":"Same model, different preset, different tools.","亮起的是这一步用到的组件，箭头指向这次数据交给谁。":"Lit components take part in this step; the arrow shows where this step’s data goes.","这一步只点亮参与交接的服务，并列出它们之间传了什么数据。":"Only the services in this handoff are lit, with the data they pass shown alongside.","会话一直在记录任务过程，由持久化插件写入存储。本页只在浏览器里播放教学数据。":"The session keeps recording the task, and a persistence plugin writes it to storage. This page only plays teaching data in your browser.","任务进来后，会话记录和 Agent 执行各管一件事。这里用的是预先编排好的任务，不会读你的文件。":"Once a task arrives, the session log and agent execution each have their own job. This is a prepared task; it does not read your files.","提示词和工具声明都由插件拼出来。模型只能用这次请求里交给它的工具，不能凭空调用别的能力。":"Plugins assemble the prompt and tool declarations. The model can only use the tools exposed in this request.","模型根据读到的资料写答复。页面只显示结果和工具交接，不显示隐藏的思考过程。":"The model writes its answer from what it read. The page shows results and tool handoffs, not hidden reasoning.","工具结果和助手输出会作为持久事实留在会话里。没有待处理的工作，本轮就结束；写入存储由相应插件负责。":"Tool results and assistant output stay in the session as durable facts. With nothing left to do, the turn ends; the matching plugin handles persistence.","本例假设已经配置了“移动前询问”的执行策略。只在提示词里写“先问我”，并不能强制审批。":"This case assumes an “ask before moving” policy is configured. Writing “ask me first” in a prompt does not enforce approval by itself.","拒绝结果照样经过结果处理，形成一条 tool/result，但它记录的不是“文件移动成功”。":"The refusal still goes through result handling and becomes a tool/result, but what it records is not “files moved”.","助手说明移动没有执行，原有文件都还在。教学时间线播完，不代表真实 DSH 执行完了。":"The assistant says the move did not happen and the existing files are untouched. The end of this teaching timeline is not a real DSH run finishing.","任务是改一份共享采购单。本例启用了文件观察策略；没有启用这项策略的配置，就没有下面这层保护。":"The task edits a shared shopping list. This case enables the file-observation policy; setups without it do not get the protection shown below.","另一位家人加了鸡蛋。这是教学里安排的外部修改，不是当前 Agent 写的。":"Another family member adds eggs. This outside edit is staged for the lesson; the current agent did not write it.","只改目标那一行。这层保护属于文件工具的修改；用 Shell 写文件，不能默认有同样的保证。":"Only the target line changes. This protection belongs to the file tools; writing files from the shell does not automatically come with it.","回复：牛奶数量已更新，鸡蛋还在。回复里的文字可以对照资料面板核对。":"Reply: the milk quantity is updated and the eggs are still there. You can check the wording against the materials panel.","程序由模型写，PTC 运行时负责执行并接上异步工具绑定。这样做并不是绕开工具权限。":"The model writes the program; the PTC runtime runs it and wires up the async tool bindings. That is not a way around tool permissions.","程序汇总得到 9 个不同学号，S02、S03、S07 重复。Standard 用 Shell 脚本也能算出来；这里不比较谁更快。":"The program finds 9 distinct student IDs, with S02, S03 and S07 repeated. Standard could compute this with a shell script too; speed is not compared here.","程序把需要的汇总交回模型，模型再写最终说明。示例数据可以在资料面板里自己算一遍。":"The program hands the needed summary back to the model, which then writes the final explanation. You can recompute the sample data in the materials panel.","这场活动要查场地和预算两件事，先把两边的资料和目标定清楚。":"The event needs two checks, venue and budget. First, pin down the materials and goal for each.","主 Agent 通过已配置的 subagents 提供方委派。本例用的是内置的进程内子 Agent，其他提供方的行为不一定相同。":"The main agent delegates through the configured subagents provider. This case uses the built-in in-process subagent; other providers may not behave the same.","主 Agent 汇总两份结果。两段动画同时亮起只是画面安排，不能据此说真实调用是并行的。":"The main agent combines both results. The two animations lighting up together is staging; it does not show that the real calls ran in parallel.","交付时写明容量和预算两个问题，并给出调整建议；问题没解决，就不写成“可以如期举办”。":"The delivery states both the capacity and budget problems with suggested changes; unresolved problems are not reported as “good to go”.","插件安装和业务任务分两段讲：办公室出现了，不等于番茄钟做完了。":"Plugin installation and the order itself are told separately: the office appearing does not mean the timer is done.","用只读检查找出实际可用的接口；查询客户端需要一个已连接的页面。挂载槽位不能靠猜。":"Read-only inspection finds the interfaces that actually exist; client queries need a connected page. Mount slots are not guessed.","测试按写明的条件复查暂停，发现旧实现暂停后还在计时。这是编排好的失败分支，画面上如实显示失败。":"Testing rechecks pause against stated conditions and finds the old version still counting. This failure branch is staged, and it is shown as a failure.","Plugin Manager 可以停用 bundle，停用时保留依赖；移除会卸载并改动依赖。页面上的按钮不会操作你电脑上的 DSH。":"Plugin Manager can disable a bundle, which keeps the dependency; removal unloads it and changes dependencies. The buttons on this page do not touch DSH on your computer.","Creator 也能直接用现有工具。算一顿饭不必装插件，同样的需求反复出现时再考虑扩展。":"Creator can use the existing tools directly. One dinner does not need a plugin; consider extending when the same need keeps coming back.","第一次下水：大肥鲸怎么把一件事办完？":"First dive: how does the whale get a job done?","从官方介绍出发，跟一个完整任务走一遍：模型出主意，工具动手，执行循环催进度，会话记录记账。":"Start from the official introduction and follow one complete task: the model decides, tools act, the loop keeps it moving, and the session log keeps the books.","饭吃完了，账怎么算？三个人，三张小票":"Dinner’s done. Who owes whom? Three people, three receipts","读三张小票，算出每人该摊多少，再给出一份照着转就行的转账方案，一分钱也算得清。":"Read three receipts, work out each share, and produce a transfer plan you can follow as is, down to the cent.","它想挪你的照片，你说“不行”，然后呢？":"It wants to move your photos. You say no. Then what?","系统先列出移动方案、请你批准；你一拒绝，文件操作就停在真正执行之前，一张照片都不动。":"It proposes the moves and asks for approval. Once you decline, the file operation stops before it runs; not a single photo moves.","共享采购单撞车：你改牛奶，家人加鸡蛋":"Shared-list collision: you change the milk, family adds eggs","任务只要把牛奶改成 4 盒，偏偏家人同时加了鸡蛋。系统得先发现版本冲突，再基于最新内容重试，鸡蛋一个都不能丢。":"The task only changes milk to four cartons, but a family member adds eggs at the same moment. The system has to catch the version conflict and retry on the latest content, without losing a single egg.","三张报名表，谁报了两次？":"Three sign-up sheets. Who signed up twice?","让一段程序一口气读完、合并、去重三张表，只把最后的统计交回主模型，中间数据留在程序里。":"One program reads, merges and dedupes all three sheets in one go; only the final tally goes back to the main model, and the intermediate data stays inside the program.","迎新会办得成吗？派两个子 Agent 去摸底":"Can the welcome party happen? Send two subagents to find out","一个子 Agent 查场地坐不坐得下，一个查预算够不够，主 Agent 把两份证据汇总。剧透：两边都有问题。":"One subagent checks whether the venue fits everyone, another checks the budget, and the main agent combines both. Spoiler: both come back with problems.","1200 份航行档案里，藏着三条关键线索":"Three key clues hidden in 1,200 voyage records","找出改道目的地、批准人和原因；摘要漏了细节，就回原始记录再核一遍，不凭印象破案。":"Find the reroute destination, approver and reason; when the summary drops a detail, go back to the original record instead of solving the case from memory.","大肥鲸开公司：像素办公室接到第一单":"The whale opens a company: a pixel office takes its first order","老板只带来一句需求，办公室就忙开了：先把像素办公室装成插件，再让设计、开发、测试按任务板分工；测出一个暂停 bug，修好再交付。":"The boss brings one request and the office gets busy: install the pixel office as a plugin, split the work among design, development and testing, catch a pause bug, fix it, then deliver.","大肥鲸一件件拆给你看。":"Taken apart by one big whale.","第一次下水？从这里开始":"First dive? Start here","跳进这个案例":"Jump into this case"}</script>
<script>/* Offline localization using source-text message IDs. User logs and code stay untouched.

(() => {
 'use strict';
 const messages=JSON.parse(document.getElementById('locale-data').textContent);
 const original=new WeakMap();const attributeSource=new WeakMap();
 const pref=(k,fallback)=>{try{return localStorage.getItem('dsh-inside-'+k)||fallback;}catch{return fallback;}};
 let language=pref('language','zh');if(!['zh','en'].includes(language))language='zh';

 const missing=new Set();
 function english(text){
   if(messages[text]!==undefined)return messages[text];

   if((m=text.match(/^\+(\d+) 个调用方$/)))return `+${m[1]} consumers`;
   if((m=text.match(/^声明 · (.*)$/)))return `Declaration · ${m[1]}`;
   if((m=text.match(/^(\d+) 个服务$/)))return `${m[1]} services`;
   if((m=text.match(/^官方类型：(.*) · (\d+) 个直接消费者 · 结构关系按需展开$/)))return `Official role: ${english(m[1])} · ${m[2]} direct consumers · connections on demand`;
   if((m=text.match(/^保持：ctx\.(.*) 的接口职责$/)))return `Unchanged: the ctx.${m[1]} contract`;
   if((m=text.match(/^观察：(.*) 的实现位置$/)))return `Inspecting the ${m[1]} implementation`;
   if((m=text.match(/^正在观察 (.*)。这是结构演示，未更改真实配置。$/)))return `Inspecting ${m[1]}. This is a structural preview; your real configuration is unchanged.`;
   if((m=text.match(/^结构示意：(.*)。没有安装或切换真实插件。$/)))return `Structure preview: ${m[1]}. No real plugins were installed or switched.`;
   if((m=text.match(/^(\d+) \/ (\d+)，(.*)$/)))return `${m[1]} / ${m[2]}, ${english(m[3])}`;

   if((m=text.match(/^事件 · (\d+) 条未映射$/)))return `events · ${m[1]} unmapped`;
   if((m=text.match(/^文件已载入：(\d+) 条事件，全部留在本页内存中。$/)))return `Loaded ${m[1]} events. All remain in this tab's memory.`;

   if((m=text.match(/^(\d+) 条事件未建立讲解映射，原文完整保留。$/)))return `${m[1]} unmapped events; raw records preserved.`;

   if((m=text.match(/^教学样本已载入：(\d+) 条事件，全部留在本页内存中。$/)))return `Teaching sample loaded: ${m[1]} events remain in this tab's memory.`;
   if((m=text.match(/^第 (\d+) 条不符合 SessionEvent：需要 type、非负整数 seq、毫秒 time、对象 data。原始存储封装请先转换为事件数组。$/)))return `Record ${m[1]} is not a valid SessionEvent: expected type, a non-negative integer seq, time in milliseconds, and an object data field. Convert native storage envelopes to an event array first.`;
   if((m=text.match(/^(\d+) · (.+)$/s)))return `${m[1]} · ${english(m[2])}`;
   if((m=text.match(/^(\d+) 个服务 · (.*)$/)))return `${m[1]} services · ${m[2]}`;

        $('#modal').close(); });
    document.addEventListener('keydown', e => { if ($('#modal').open || ['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName) || e.target.isContentEditable)
        return; if (e.ctrlKey || e.metaKey || e.altKey)

    function initFromHash(){
