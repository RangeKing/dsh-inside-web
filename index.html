/* Semantic labels share the 3D camera; lesson controls remain in reading order. */
.model-annotations{position:absolute;inset:0;pointer-events:none;overflow:hidden}

.annotation-lines path{fill:none;stroke:#a9c1dc70;stroke-width:1}

.model-callout[hidden]{display:none}.model-callout.active{border-color:#e8bc7966;color:#fff0d9}
.callout-number{font:10px/1.2 var(--mono);color:#92a7c2;flex-shrink:0}.active .callout-number{color:#ffd298}

/* Keep stills inside a definite media box; intrinsic image height must not size the grid track. */
.case-art{flex:0 0 205px;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.case-art img{display:block;position:absolute;inset:0;width:100%;height:100%;min-width:0;min-height:0;object-fit:contain}
.case-card[data-company="true"] .case-art img{left:7.5%;right:7.5%;object-fit:contain}
/* Names have their own strip, outside the canvas. Small numbers identify the actual components. */
.case-model-viewport{position:absolute;inset:112px 18px 132px;min-width:0;min-height:0}
.case-model-viewport .projected-labels{overflow:visible}
.case-label-list{position:absolute;left:20px;right:20px;bottom:65px;height:56px;display:flex;justify-content:center;align-content:flex-start;flex-wrap:wrap;gap:5px 12px;overflow-y:auto;z-index:6;padding:4px 0;background:var(--surface)}

.case-label-item>span{font:9px var(--mono);color:var(--muted)}.case-label-item[aria-pressed="true"]{background:var(--study-raise);color:var(--text)}
.case-model-marker{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font:9px var(--mono);background:var(--glass);color:var(--text);border:1px solid var(--line);pointer-events:none}

/* One request threads through the homepage: asked in the hero, tracked per chapter, answered at the end. */
.request-bubble{margin:0 auto 22px;max-width:520px;text-align:left}
.request-bubble figcaption,.request-result figcaption{font-size:12px;color:var(--sea-muted);margin:0 0 8px;text-align:center;letter-spacing:.01em}
.request-bubble p{margin:0;display:flex;flex-direction:column;gap:6px;padding:14px 20px;border-radius:22px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);font-size:17px;line-height:1.45;color:var(--paper)}
.request-files{font:11px var(--mono);color:var(--sea-muted)}
.request-thread{display:flex;gap:10px;align-items:baseline;margin:0 0 16px;font-size:14px;line-height:1.55;color:var(--paper);text-align:left}
.request-thread>span{flex:none;font-size:11px;padding:3px 9px;border-radius:20px;background:var(--study-raise);color:var(--sea-muted)}
.chapter-1 .request-thread,.chapter-4 .request-thread,.chapter-6 .request-thread{position:absolute;left:50%;top:calc(13% + clamp(64px,6.4vw,100px));transform:translateX(-50%);width:min(640px,86%);justify-content:center;pointer-events:auto}
.chapter-2 .request-thread,.chapter-3 .request-thread,.chapter-5 .request-thread{margin:22px 0 0}
.request-result{margin:0 auto 18px;max-width:520px;padding:16px 20px;border-radius:24px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);text-align:left}

ription":"在同一个接口中登记搜索与网页读取提供方，上层工具保持稳定的模型调用名称。","owner":"web","docIndex":140,"detail":"本图列出锁定版本的静态服务关系。是否调用取决于配置和任务；这些连线不是实测轨迹。","sourceLine":612,"upstreamNote":"Search and fetch providers register into one ctx.web seam; tool-web owns the stable model-facing names."},{"id":"spillStore","role":"seam","group":5,"title":"长结果外存","path":"packages/spill/spill","implementations":["spill-local"],"consumers":["spill-policy"],"description":"保存过长的工具文本并返回定位符和读取提示；是否外存由 tools/post-execute 阶段的策略决定。","owner":"spill","docIndex":141,"detail":"本图列出锁定版本的静态服务关系。是否调用取决于配置和任务；这些连线不是实测轨迹。","sourceLine":613,"upstreamNote":"The backend saves oversized tool text and returns a model-facing locator plus retrieval hint; spill-policy is the tools/post-execute consumer that decides when to spill."},{"id":"directoryPicker","role":"seam","group":0,"title":"选择工作目录","path":"packages/host/directory-picker","implementations":["host-directory-picker-native","host-directory-picker-browse"],"consumers":["api-workspace-controller"],"description":"可调用主机的系统目录选择器，也可提供应用内浏览所需的列目录和创建目录能力。","owner":"host-directory-picker","docIndex":142,"detail":"本图列出锁定版本的静态服务关系。是否调用取决于配置和任务；这些连线不是实测轨迹。","sourceLine":614,"upstreamNote":"Discriminated interaction capability: the native backend opens one OS chooser on the host display, the browse backend serves listing/creation primitives for the in-app browser; dual-face backends fill ui-workspace directory-flow slots from their browser halves (no wire advertisement)."},{"id":"webServer","role":"core","group":0,"title":"网页服务","path":"packages/host/webserver","implementations":[],"consumers":["client-connection","client-modules","client-hmr"],"description":"提供 HTTP 路由登记、页面转换及静态页面回退，传输插件自行注册路由。","owner":"host-webserver","docIndex":143,"detail":"本图列出锁定版本的静态服务关系。是否调用取决于配置和任务；这些连线不是实测轨迹。","sourceLine":615,"upstreamNote":"Plain node:http carrier: named-route registry, index transform taps, and the static dist fallback; web-transport plugins register their own routes."},{"id":"clientMod <script type="application/json" id="locale-data">{"修复折扣计算":"Fix a discount bug","100 元打八折，代码却算出 −1900 元。":"A 20% discount on 100 returns −1900.","请修复 src/price.ts 中的折扣计算。discountPercent=20 表示八折，100 元应返回 80 元。先读源码和测试，只修改必要代码，运行 npm test，最后告诉我改了什么、测试是否通过。":"Fix the discount calculation in src/price.ts. discountPercent=20 means 20% off: 100 should become 80. Read the code and tests first, make the smallest change, run npm test, then report the change and test results.","示例工作区 /demo/shop · 2 个文件 · 3 个测试":"Example workspace /demo/shop · 2 files · 3 tests","已修复 src/price.ts：将折扣百分数除以 100 后参与计算。\n\n100 元，20% 折扣 → 80 元。\n测试结果：3 项通过，0 项失败。\n仅修改 1 行，未改动测试。":"Fixed src/price.ts by dividing the discount percentage by 100 before applying it.\n\n100 with a 20% discount → 80.\nTests: 3 passed, 0 failed.\nChanged one line; tests were left unchanged.","100 元，为什么算成了负数？":"Why did 100 become negative?","任务已提交":"Task submitted","为这次修复准备工具":"Assemble the repair toolkit","Agent 就绪":"Agent ready","记录本轮任务的开始":"Record the start of this turn","第 1 轮开始":"Turn 1 opened","把问题和工具清单交给模型":"Prepare the prompt and tools","上下文已组装":"Context assembled","模型收到折扣修复请求":"Send the repair request","请求 1 / 读取文件":"Request 1 / inspect files","模型要求读取两个文件":"Request two file reads","2 个调用等待检查":"2 calls awaiting checks","只读操作通过策略检查":"Allow the read-only operations","允许读取":"Reads allowed","本示例配置允许读取工作区文件。前置策略和守卫通过后，调度器才会执行工具；无需发起人工批准。":"This example policy allows workspace reads. The scheduler runs the tools only after pre-policy and guards pass; no human approval is requested.","文件里找到了出错的一行":"Locate the faulty line","文件读取完成":"Files read","测试先读完，也按 A、B 写回":"Commit A then B, even if B finishes first","B 已完成，等待 A 写回":"B finished; waiting for A","模型确认：百分数少除以 100":"Identify the missing division by 100","请求 2 / 生成修复":"Request 2 / plan the edit","只替换出错的表达式":"Replace only the faulty expression","1 行修改已应用":"One-line patch applied","示例中启用了读取后编辑检查：文件已经读过且未被其他操作修改，因此这次字面替换可以提交。文件提供方负责实际写入。":"The example enables read-before-edit checks. The file was read and has not changed, so the literal replacement can be committed. The filesystem provider performs the write.","启动 npm test 验证修复":"Run npm test to verify the fix","测试进程运行中":"Test process running","本场景使用本地命令执行器。bash 工具调用 shell，执行器再通过 subprocess 启动 npm test。受限执行器可额外接入 sandbox，本场景未演示该分支。":"This scenario uses a local shell executor. The bash tool calls shell, which starts npm test through subprocess. Sandboxed executors can also use sandbox; that branch is not shown here.","三个测试全部通过":"All three tests pass","测试结果已写回":"Test results committed","测试工具返回退出码 0。结果较短，后置策略直接保留，随后写入会话供下一次模型请求使用。":"The test tool returns exit code 0. The output is short, so post-policy keeps it inline and the result is committed for the next model request.","给用户一个可核对的答复":"Return a checkable answer","最终答复已生成":"Final response generated","保存完成状态":"Record completion","第 1 轮已完成":"Turn 1 completed","结果与过程都留下记录":"Keep the result and its history","任务完成":"Task complete","拒绝修改配置":"Deny a config change","修改生产配置前，用户点击了“拒绝”。":"The user denies a production config change.","将 config/production.json 中的 logLevel 从 \"info\" 改为 \"debug\"。这个文件受保护，修改前必须让我确认；我拒绝时保留原文件并说明结果。":"Change logLevel in config/production.json from \"info\" to \"debug\". This file is protected: ask me before changing it. If I deny approval, leave it unchanged and report the outcome.","示例策略：生产配置写入必须询问 · 用户选择拒绝":"Example policy: ask before writing production config · user denies","未修改 config/production.json。\n\n你拒绝了本次写入，logLevel 仍为 \"info\"。\n文件写入工具没有执行。需要启用调试日志时，请重新授权该操作。":"config/production.json was not changed.\n\nYou denied this write; logLevel remains \"info\".\nThe file-write tool body did not run. Authorize a new operation to enable debug logging.","提交受保护的配置修改":"Submit a protected config change","挂载询问式写入策略":"Mount an ask-before-write policy","策略已加载":"Policy loaded","开始这轮配置任务":"Open the config-change turn","把目标修改交给模型":"Assemble the requested change","上下文就绪":"Context ready","模型准备写入请求":"Prepare a write request","模型正在响应":"Model responding","产生一次配置写入调用":"Propose one config write","写入尚未执行":"Write has not run","前置策略要求人工确认":"Pre-policy requests human approval","等待批准":"Waiting for approval","用户点击“拒绝”":"The user clicks Deny","用户拒绝":"User denied","拒绝结果返回主循环":"Return the denial to the loop","原文件保持不变":"Original file unchanged","说明没有修改文件":"Explain that nothing changed","保存本轮结束原因":"Record the turn outcome","保留拒绝和解释记录":"Keep the denial and explanation","模型提出替换配置文件的写入操作，调用先进入工具管线。本示例没有启用读取后写入检查，重点展示前置批准策略。":"The model proposes replacing the config file, and the call enters the tool pipeline. Read-before-write checks are not enabled in this example, which isolates the pre-policy approval path.","长日志中找到根因":"Find the cause in a long log","读完大量日志后，保留线索继续排查。":"Keep the key evidence while condensing a long log.","请根据 logs/checkout.log 排查结算接口的 502 错误，引用关键日志，给出根因和两条建议。日志很长，请保留已发现的证据，不要丢失最初的问题。":"Investigate checkout 502 errors using logs/checkout.log. Cite the key log lines, identify the cause, and give two recommendations. The log is long: preserve evidence already found and keep the original question in scope.","示例已有多轮读取历史 · 本次演示步骤后压力压缩":"Example includes prior reads · post-step pressure triggers compaction","根因：结算服务的数据库连接池耗尽，导致请求等待超时并返回 502。\n\n证据：\nL8401 pool active=20 idle=0 waiters=47\nL8403 DB acquire timeout after 5000ms\nL8404 POST /checkout → 502\n\n建议：① 确认连接在异常路径也会释放；② 对等待队列设置上限并监控连接占用。":"Cause: the checkout database connection pool is exhausted, causing acquisition timeouts and 502 responses.\n\nEvidence:\nL8401 pool active=20 idle=0 waiters=47\nL8403 DB acquire timeout after 5000ms\nL8404 POST /checkout → 502\n\nRecommendations: (1) Ensure connections are released on error paths. (2) Bound the wait queue and monitor connection usage.","带着一个明确问题读日志":"Read the log with a concrete question","接入日志读取和压缩能力":"Load log-reading and compaction support","打开本轮排查记录":"Open the investigation turn","准备已有证据和下一段日志":"Prepare previous evidence and the next window","上下文接近示例预算":"Context nearing the example budget","模型请求出错位置附近的片段":"Request a window around the error","请求日志片段":"Requesting a log window","把读取请求交给文件工具":"Dispatch the windowed read","读取等待执行":"Read queued","读到连接池和超时记录":"Find pool exhaustion and timeout evidence","关键证据已读取":"Key evidence read","将证据写入会话":"Commit the evidence to the session","工具结果已记录":"Tool result recorded","步骤后压力检查触发整理":"Post-step pressure triggers compaction","先检查裁剪，再生成摘要":"Check pruning, then summarize","保留原问题与三条关键证据":"Keep the question and three key findings","摘要替换当前上下文":"Summary replaces current context","用整理后的内容继续组装":"Assemble a request from the condensed context","上下文空间已释放":"Context headroom restored","发出下一次正常模型请求":"Send the next normal model request","继续分析，无需错误重试":"Continue without an error retry","给出根因、证据和建议":"Report the cause, evidence, and next steps","结束这轮排查":"Close the investigation turn","保留完整日志和整理记录":"Keep the full history and replacements","这里演示步骤后压力触发的整理。下一步正常重新组装上下文并继续请求；请求报错后的重试是另外一条条件分支。":"This scenario shows post-step pressure compaction. The next step assembles the condensed context and makes a normal request. Retrying after a request error is a separate conditional path.","图中压力数值是讲解用的示例，未测量真实 token。":"Pressure values are illustrative; no real token measurement was taken.","委派一次安全检查":"Delegate a security review","子 Agent 查接口代码，主 Agent 汇总建议。":"A child reviews endpoint code; the parent reports back.","请检查 src/routes/user.ts 的输入校验。把代码审查交给一个只读子 Agent，要求它返回具体行号、风险和修复建议；你负责汇总，不要修改任何文件。":"Review input validation in src/routes/user.ts. Delegate the code review to a read-only child agent and ask for line numbers, risks, and fixes. Summarize the findings yourself; do not modify files.","示例 spawn 子会话 review-01 · 子 Agent 只有读取工具":"Example spawn session review-01 · child has read-only tools","审查完成，未修改文件。\n\n1. L12：name 缺少字符串类型与长度校验。建议限制为 1–80 个字符。\n2. L18：age 直接参与写入，缺少整数与范围校验。建议限定为 0–120 的整数。\n\n以上来自子 Agent review-01 的代码审查，主任务已汇总为两项可执行修改。":"Review complete. No files were changed.\n\n1. L12: name lacks type and length validation. Require a string of 1–80 characters.\n2. L18: age is written without integer or range validation. Require an integer from 0 to 120.\n\nFindings came from child agent review-01 and were summarized into two actionable changes.","提交只读代码审查任务":"Submit a read-only code review","主任务准备委派能力":"Prepare the parent delegation tools","父 Agent 就绪":"Parent agent ready","打开父任务这一轮":"Open the parent turn","父任务运行中":"Parent running","说明子任务的目标和限制":"Specify the child goal and constraints","只读约束已准备":"Read-only constraints prepared","模型决定委派审查":"The model delegates the review","委派已计划":"Delegation planned","委派工具进入统一管线":"Route delegation through the tool pipeline","等待委派检查":"Delegation awaiting checks","允许这次只读委派":"Allow the read-only delegation","委派获准":"Delegation allowed","创建独立的子会话":"Create a separate child session","子 Agent 已启动":"Child agent started","子 Agent 读取并检查代码":"The child reads and reviews the code","子任务发现 2 个问题":"Child found 2 issues","只把审查结论交还父任务":"Return findings to the parent","父任务收到结论":"Parent received findings","父模型结合子任务结论":"The parent uses the child findings","父任务整理答复":"Parent composing the response","输出两条可执行建议":"Return two actionable recommendations","结束父任务这一轮":"Close the parent turn","父子记录各自保留":"Keep parent and child histories separate","示例部署允许创建此只读子 Agent。工具集合限制它只能读取；实际部署还需要文件访问边界配合，才能限制读取范围。":"The example deployment allows this read-only child. Its tool set permits reads only; actual deployments also need filesystem access controls to constrain what it can read.","用程序汇总销售数据":"Summarize sales with a program","三个 CSV 文件，一次程序化调用算出总额。":"Aggregate three CSV files in one programmatic call.","读取 data/jan.csv、data/feb.csv、data/mar.csv，分别汇总 amount 列并计算季度总额。使用程序化工具调用完成，输出每月金额、总额和记录数，不要修改文件。":"Read data/jan.csv, data/feb.csv, and data/mar.csv. Sum each amount column and calculate the quarterly total using programmatic tool calling. Return monthly totals, the grand total, and the row count. Do not modify files.","示例 PTC 模式 · 3 个 CSV · 金额单位：元":"Example PTC mode · 3 CSV files · amounts in CNY","季度销售汇总（人民币）\n\n1 月：3,000 元（2 条）\n2 月：4,500 元（2 条）\n3 月：6,000 元（2 条）\n\n季度总额：13,500 元，共 6 条记录。\n三个原始 CSV 均未修改。":"Quarterly sales summary (CNY)\n\nJanuary: 3,000 (2 rows)\nFebruary: 4,500 (2 rows)\nMarch: 6,000 (2 rows)\n\nQuarterly total: 13,500 across 6 records.\nAll three source CSV files are unchanged.","提交三个月的数据汇总":"Submit a three-month aggregation","装配程序化调用环境":"Assemble the programmatic runtime","PTC 模式就绪":"PTC mode ready","打开汇总任务记录":"Open the aggregation turn","向模型提供程序接口说明":"Expose the generated program interface","工具 SDK 已准备":"Tool SDK prepared","模型计划一次程序化调用":"Plan a single programmatic call","模型正在编写程序":"Model drafting the program","提交 run_code 调用":"Submit run_code","程序等待检查":"Program awaiting checks","检查程序和工具访问边界":"Check program and tool access","允许读取数据":"Data reads allowed","程序读三个文件并汇总":"Read and aggregate three files","3 次读取，6 条记录":"3 reads, 6 records","把汇总值返回顶层调用":"Return the aggregation to the top-level call","程序结果已记录":"Program result recorded","模型只需整理结构化结果":"Use the structured program result","准备最终答复":"Preparing the final answer","输出季度销售汇总":"Return the quarterly summary","结束本轮汇总":"Close the aggregation turn","保留分层调用记录":"Keep nested and top-level records","程序内部的读取调用与顶层 run_code 返回值分开记录。本例只返回简短汇总，无需触发长结果外存。":"Nested reads and the top-level run_code result are recorded separately. This example returns a short summary and does not need oversized-result spill storage.","// 讲解用伪代码；实际工具绑定以运行时生成的 SDK 为准。\nconst files = [\"jan.csv\", \"feb.csv\", \"mar.csv\"];\nconst texts = await readWithGeneratedSDK(files);\nconst monthly = texts.map(sumAmountColumn);\nreturn { monthly, total: sum(monthly), rows: 6 };":"// Explanatory pseudocode; actual bindings come from the generated SDK.\nconst files = [\"jan.csv\", \"feb.csv\", \"mar.csv\"];\nconst texts = await readWithGeneratedSDK(files);\nconst monthly = texts.map(sumAmountColumn);\nreturn { monthly, total: sum(monthly), rows: 6 };","模型提出读取 checkout.log 指定行范围的调用。助手消息先写入会话，再将读取请求交给统一工具调度器。":"The model proposes a line-window read of checkout.log. The assistant message is committed before the read enters the shared tool scheduler.","本阶段只有一次日志读取。返回的 60 行片段写入会话，随后由步骤后压力检查决定是否需要整理上下文。":"This stage contains one log read. Its 60-line result is committed to the session before the post-step pressure check decides whether to compact the context.","主模型提出一次委派调用，要求只读审查 user.ts。调用先经过统一的工具管线，允许后才会创建子 Agent。":"The parent model proposes a delegation to review user.ts without edits. The call passes through the shared tool pipeline before a child agent can be created.","子 Agent 使用自己的模型、工具范围和会话。它通过工具管线读取 user.ts，找出两处校验缺失，再准备结构化结论；图中的箭头强调文件读取这一段。":"The child has its own model context, tool scope, and session. It reads user.ts through the tool pipeline, identifies two validation gaps, and prepares findings. The arrow highlights the filesystem read segment.","模型提交一次 run_code 顶层调用。程序将经生成的 SDK 请求三次文件读取；调用工具的具体绑定由实际装配的 SDK 决定。":"The model submits one top-level run_code call. Its program requests three reads through the generated SDK; the actual mounted SDK determines the binding signatures.","顶层 run_code 调用经过工具策略与守卫后进入代码运行时。程序随后使用主机绑定调用工具，每个嵌套调用仍受工具管线约束。":"After tool policy and guards pass, the top-level run_code call enters the code runtime. The program invokes tools through host bindings, and each nested call remains subject to the tool pipeline.","代码运行时通过生成的主机绑定调用读取工具，读取工具再访问 ctx.fs。每月金额在程序中汇总；箭头强调受工具管线约束的文件访问。":"The code runtime invokes read tools through generated host bindings; those tools access ctx.fs. The program sums monthly amounts. The arrow highlights filesystem access through the tool pipeline.","附件存储":"Attachment storage","保存图片等二进制附件。模型适配器把已授权的文件引用转换为对应模型能接收的内容。":"Stores binary attachments such as images. Model adapters translate authorized file references into the content format their provider accepts.","文件上传":"File uploads","接收上传流并管理暂存凭据；会话控制器在接受提交时绑定这些凭据。":"Accepts upload streams and manages staged receipts. The session controller binds these receipts when a submission is accepted.","模型接口":"Model interface","用统一的流式请求接口连接不同模型。模型适配器负责把请求和回复转换成各家协议。":"Connects models through a common streaming interface. Adapters translate requests and responses into each provider's protocol.","请求扩展":"Request extensions","插件分别准备 DeepSeek 请求的扩展字段，官方适配器合并，并在 HTTP 请求被接受后提交交付状态。":"Plugins prepare independent DeepSeek request fields. The official adapter merges them and commits delivery state after HTTP acceptance.","上下文计量":"Context measurement","按会话维护独立的重放计量，向压力判断提供带版本的只读测量结果。":"Maintains isolated per-session replay measurements and provides revisioned, read-only pressure readings.","工具结果裁剪":"Tool-result pruning","先替换当前上下文中过大的工具结果，再考虑摘要压缩；替换过程可以重放。":"Replaces oversized tool results on the current context surface before summary compaction. These replacements can be replayed.","会话日志":"Session log","保存只追加的会话事件，并从事件派生模型当前可见的消息。写入日志和模型可见内容有不同职责。":"Stores append-only session events and derives the messages currently visible to the model. The durable log and current context have distinct roles.","会话入口":"Session entry point","处理会话命令、历史读取和实时控制，并决定何时激活 Agent。":"Handles session commands, history reads, and live control, and decides when to activate an agent.","会话文件候选":"Session file candidates","沿会话控制器既有的 Agent 查找规则，提供文件引用发现。":"Discovers file references using the session controller's established agent lookup policy.","会话技能目录":"Session skill catalog","列出此会话配置中可由用户触发的技能，无需激活尚未运行的 Agent。":"Lists user-invocable skills in this session's composition without activating a cold agent.","凭据管理入口":"Credential management","把凭据服务映射到远程接口，负责批量分发、展示结果和拒绝原因。":"Exposes credential services through remote interfaces and handles batch fan-out, presentation, and refusals.","设置管理入口":"Settings management","向界面提供经过脱敏的分层设置，并将修改写入用户层。":"Serves redacted, layered settings to the UI and writes changes to the user layer.","工作区入口":"Workspace entry point","处理工作区命令，连接恢复后仍可向客户端交付工作区状态。":"Handles workspace commands and delivers workspace state across reconnects.","目录选择入口":"Directory selection entry","将目录选择能力暴露给客户端，处理取消、能力检查和结构化错误。":"Exposes directory selection to clients, including cancellation, capability checks, and structured errors.","运行规则检查":"Runtime invariant checks","集中管理由各个包声明的运行规则检查，保留失败所属的包和执行范围。":"Coordinates package-owned runtime checks and preserves the package and execution scope responsible for a failure.","运行时类型目录":"Runtime type registry","插件登记类型与反射信息，网关在调用边界读取描述符和对应服务。":"Plugins register types and reflection metadata. The gateway reads descriptors and service providers at invocation boundaries.","远程调用网关":"Remote invocation gateway","把生成的远程接口描述与运行中的 Cordis 服务关联，分发单次远程调用。":"Associates generated remote descriptors with live Cordis services and dispatches unary remote calls.","会话持久化":"Session persistence","把会话事件交给持久化后端。JSONL 实现按会话保存记录；内存中提交和磁盘刷写有各自边界。":"Passes session events to a durable backend. The JSONL implementation stores one artifact per session; memory commits and disk flushes have separate boundaries.","分层设置":"Layered settings","插件注册设置结构并解析分层配置，具体提供方负责保存原始文档。":"Plugins register setting schemas and resolve layered values. Providers store the raw settings document.","子任务模型偏好":"Child-model preference","维护默认关闭的模型选择设置；委派工具创建新顶层会话时读取它。":"Owns default-off model-selection settings sampled when delegation tools compose a new top-level session.","凭据读取":"Credential access","配置保存密钥引用，提供方保管密钥值。消费者每次操作重新解析，让轮换后的凭据用于下一次请求。":"Configuration holds secret references; providers own their values. Consumers resolve them per operation so rotation affects the next request.","凭据授权流程":"Credential authorization","插件登记获取凭据的授权流程；接口管理交互过程与同一键的一次尝试生命周期。":"Plugins register credential-acquisition flows. This service owns the conversation and one-attempt-per-key lifecycle.","会话遥测":"Session telemetry","捕获并脱敏会话记录，再交给一个遥测后端，输出会离开当前进程。":"Captures and redacts session records, then sends them to one telemetry backend outside the process.","通用存储":"General storage","按名称注册多个存储后端，为非会话数据提供底层存储单元。":"Registers named backends that provide low-level storage units for non-session data.","业务数据存储":"Domain storage","等待配置的存储后端就绪，再提供带类型的持久化业务数据服务。":"Waits for configured backends, then provides typed, durable domain-data operations.","回复反馈":"Response feedback","保存针对助手消息的本地反馈，校验目标和生命周期；不把反馈写进会话历史或遥测。":"Stores local feedback for assistant messages with target and lifecycle validation, outside session history and telemetry.","工作区目录":"Workspace registry","基于业务存储管理工作区实体，使用稳定的会话编号关联远程调用与界面。":"Manages workspace entities over domain storage and uses stable session identifiers for remote and UI projections.","会话检索":"Session search","读取历史、过滤、追踪和搜索。具体后端还负责全文检索、排序、摘要片段与游标。":"Provides history reads, filters, traces, and search. Backends also handle full-text ranking, snippets, and cursors.","文件引用发现":"File-reference discovery","只返回 Agent 工作目录中的候选路径，不读取文件内容；提供方负责路径访问与排序。":"Returns candidate paths in an agent's working directory without reading file contents. Providers own access and ranking.","跨会话引用":"Cross-session references","把其他会话当前可见的对话整理为有大小限制的快照，以不可信消息上下文的形式保存。":"Creates bounded snapshots of another session's current conversation and stores them as untrusted message context.","会话标题":"Session title","提供确定性的备用标题，并可接入一个异步标题生成提供方。":"Provides a deterministic fallback title and can register one asynchronous title provider.","提示词组装":"Prompt assembly","在每一步收集提示词片段和模型可见的工具定义。新的工具或限制变化可影响下一次组装。":"Collects prompt sections and model-visible tool schemas before every step. Tool registrations and restrictions can affect the next assembly.","工具执行管线":"Tool execution pipeline","登记工具、决定模型看到的调用形式，并依次处理前置策略、守卫、执行包装、后置策略和最终结果观察。":"Registers tools, controls their model-facing form, and routes execution through pre-policy, guards, wrappers, post-policy, and final-result observation.","向用户提问":"Ask the user","工具通过统一的 ask() 等待用户回答，实际交互由界面侧提供方负责。":"Tools await human answers through a common ask() promise. The UI supplies the actual interaction provider.","计划模式":"Plan mode","从日志还原计划模式，在轮次边界应用用户选择，并保持退出计划的工具结构稳定。":"Folds plan state from the log, applies user choices at turn boundaries, and keeps the plan-exit schema stable.","Agent 预设":"Agent presets","发现预设目录，在创建 Agent 时将一份 cordis.yml 挂载到该 Agent 的作用域。":"Discovers presets and mounts a cordis.yml composition inside the agent's scope during creation.","用户命令":"Human commands","登记由人直接调用的命令；这些命令调用无需先发送给模型。":"Registers commands people invoke directly, without first sending the invocation to the model.","会话状态投影":"Session state projections","从事件折叠出界面需要的状态，按会话维护进度，并推送变化。":"Folds events into UI state, tracks per-session watermarks, and pushes changes to clients.","会话状态缓存":"Projection cache","定期保存状态投影；冷读取使用缓存加后续日志，避免每次列出会话都载入完整历史。":"Checkpoints state projections. Cold reads combine cached state with the log tail instead of loading the complete history.","技能目录":"Skills","合并多个提供方的技能目录，由工具展示目录并按需载入完整技能正文。":"Merges provider catalogs. Tools present the catalog and load full skill bodies on demand.","Agent 生命周期":"Agent lifecycle","管理运行中的 Agent、创建与恢复入口，以及进程内的调用发起者身份。":"Owns live agents, creation and resumption entry points, and process-local initiator identity.","默认模型":"Default model","通过分层设置统一默认模型，让直接调用和主机入口共享同一状态来源。":"Uses layered settings to share a default model selection across direct and host-backed agent entry points.","主执行循环":"Main execution loop","组装具体的执行循环。扩展包依赖 Agent 的事件与服务，无需依赖这个循环实现包。":"Composes the concrete execution loop. Extensions depend on agent events and services rather than this implementation package.","持续目标":"Persistent goals","从会话日志还原带版本的目标；持续执行的激活状态保留在当前进程。":"Folds revisioned goals from the session log. Continuation activation stays local to the running process.","云端运行环境":"Cloud runtime","共享一个 E2B 句柄、远端工作目录和结束策略，让文件与进程提供方使用同一个 Linux 环境。":"Shares an E2B handle, remote directory, and disposal policy so file and process providers use the same Linux environment.","进程启动":"Process spawning","统一管理进程位置、输入输出、进程树生命周期、终端机制与终止升级。":"Owns process coordinates, input and output, process-tree lifetimes, terminal mechanics, and termination escalation.","命令执行":"Shell execution","上层工具提交命令，执行器决定如何运行。可在本地 Bash、受限 Bash 和 PowerShell 实现间选择。":"Tools submit commands; executors decide how to run them. Implementations include local Bash, sandboxed Bash, and PowerShell.","命令环境":"Shell environment","收集一次执行所需的可信 DSH_* 环境信息，由执行器重建这组环境变量。":"Collects a trusted DSH_* environment snapshot for one execution. The executor reconstructs this namespace.","持续终端":"Persistent terminals","按 Agent 管理持续存在的终端会话及清理，后端负责具体终端机制。":"Manages agent-owned terminal sessions and cleanup. Backends implement terminal mechanics.","进程隔离":"Process sandbox","接收即将执行的准确 argv，按本次策略包装命令并报告隔离是否真正生效。":"Accepts the exact argv about to run, wraps it under the per-call policy, and reports whether enforcement is active.","隔离策略":"Sandbox policy","统一保存默认隔离模式和工作区根目录，让文件与命令执行使用一致的限制边界。":"Owns the default isolation mode and workspace root so filesystem and command execution share the same boundary.","人工批准":"Human approval","通过 approval/request 依次寻找答复者，处理单次权限决定；没有答复者时返回 unavailable。":"Dispatches one-shot permission decisions through approval/request. If no answerer is available, it returns unavailable.","权限预设":"Permission presets","将隔离模式和批准策略组合为用户可选的权限预设，切换时写入相关事件。":"Combines sandbox mode and approval policy into user-facing presets and writes the associated events when switching.","程序化工具调用":"Programmatic tool calling","运行模型编写的程序，并提供主机侧异步工具绑定。PTC 模式通过它执行程序化工具调用。":"Runs a model-written program with host-provided async bindings. PTC mode uses it to execute programmatic tool calls.","文件系统":"Filesystem","工具通过统一接口读、写、编辑文件。提供方决定访问本地、受限文件系统或云端文件系统。":"Tools read, write, and edit through one interface. Providers choose local, sandboxed, or cloud filesystem access.","上下文压缩":"Context compaction","基础实现响应步骤后的上下文压力及请求错误恢复事件，必要时整理模型可见内容；没有面向模型的 compact 工具。":"The basic implementation responds to post-step pressure and request-error recovery, condensing model-visible context when needed. There is no model-facing compact tool.","子任务委派":"Delegation","提供方负责不同委派通道，服务还管理可选的持续子任务；一次委派和可继续对话有各自生命周期。":"Providers implement delegation transports. The service also manages optional continuations, with separate lifecycles for one-shot and continuable delegation.","多 Agent 协作":"Agent teams","实验功能：管理成员、持久化消息、共享任务依赖图及可继续运行的子 Agent。":"Experimental coordination for members, durable messages, shared task dependencies, and continuable child agents.","运行时检查":"Runtime inspection","提供运行时观察、Cordis 树查询和 Worker 承载的 CDP 目标。官方表中 owner 未附路径链接；这里仅保留文档入口。":"Provides runtime observation, Cordis-tree queries, and a Worker-hosted CDP target. The official owner has no package link in the table; this viewer preserves the documentation entry.","后台任务":"Background jobs","登记后台命令、终端发送和子任务委派等运行工作，模型可通过控制工具查看和终止。":"Registers background commands, terminal sends, and delegated work. Model-facing tools can inspect and terminate these jobs.","网页搜索与读取":"Web search and fetch","在同一个接口中登记搜索与网页读取提供方，上层工具保持稳定的模型调用名称。":"Registers search and fetch providers under one service, while tools retain stable model-facing names.","长结果外存":"Oversized-result storage","保存过长的工具文本并返回定位符和读取提示；是否外存由 tools/post-execute 阶段的策略决定。":"Stores long tool text and returns a locator and retrieval hint. A tools/post-execute policy decides when to spill.","选择工作目录":"Working-directory picker","可调用主机的系统目录选择器，也可提供应用内浏览所需的列目录和创建目录能力。":"Uses a host-native directory chooser or provides listing and creation primitives for an in-app browser.","网页服务":"Web server","提供 HTTP 路由登记、页面转换及静态页面回退，传输插件自行注册路由。":"Registers HTTP routes, page transforms, and static fallbacks. Transport plugins register their own routes.","客户端插件":"Client plugins","扫描并组装客户端插件入口图，提供插件包并通知重新构建或依赖变化。":"Scans and composes the client plugin entry graph, serves bundles, and notifies rebuild or dependency-graph changes.","工作流引擎":"Workflow engine","运行工作流脚本，脚本中的 agent() 通过子任务服务分发；每个上下文使用一个引擎。":"Runs scripts whose agent() calls delegate through subagents. Each context has one engine.","外部事件入口":"External event entry","接收已验证的外部事件，执行可信插件规则，并将结果转换为关联工作区的普通会话。":"Accepts authenticated deliveries, runs trusted plugin rules, and creates ordinary workspace-backed sessions.","代码导航":"Code navigation","提供四类标准化代码导航操作，后端将请求转换到具体语言服务器协议。":"Exposes four normalized code-navigation operations. Backends translate them into language-server requests and results.","动态插件运行":"Dynamic plugin execution","管理内存中的插件定义及主机侧 vm 执行环境，完成动态插件运行请求。":"Owns in-memory plugin definitions and the host-side VM environment for dynamic plugin requests.","动态插件检查":"Dynamic plugin inspection","登记主机检查提供方，镜像客户端检查目录，并路由客户端查询。":"Registers host inspect providers, mirrors client inspect catalogs, and routes client queries.","这里展示的是此提交中的接口职责与官方列出的直接消费者。静态依赖不表示每次任务都会调用它；实际参与情况取决于配置、插件及任务路径。":"This view shows the service contract and direct consumers listed at the pinned commit. Static dependencies do not mean every task invokes a service; participation depends on configuration, plugins, and the execution path.","执行循环和上下文压缩都使用这个接口。选择提供方不能自动证明模型能力、速度或成本发生了怎样的变化。":"The execution loop and context compaction both use this interface. Selecting a provider alone does not establish a change in model capability, speed, or cost.","扩展字段的交付状态在 HTTP 接受后提交；模型适配器的请求构造有自己的提交边界。":"Extension delivery state is committed after HTTP acceptance. The adapter has its own request-construction and delivery boundaries.","SessionEvent 使用 type、seq、time、data。持久化日志与当前消息 surface 分开维护，替换 surface 无需删除旧事件。":"SessionEvent uses type, seq, time, and data. The durable log and current message surface are maintained separately; replacing the surface does not require deleting earlier events.","session/event 是提交后的观察通知；session/flush 是等待各监听方完成的持久化检查点。不要把每次日志追加都画成一次同步磁盘写。":"session/event is a post-commit observation feed; session/flush is an awaited durability checkpoint. A log append should not be drawn as a synchronous disk write.","当前页面只展示职责与连接关系，不接受 API Key，不发起模型调用。":"This page shows responsibilities and connections only. It does not accept API keys or make model calls.","导出遥测与恢复会话有不同职责。当前网页不接入遥测后台，也不上传导入的日志。":"Telemetry export and session restoration have distinct roles. This page does not connect to telemetry services or upload imported logs.","preStep() 先 assemble()，再执行 agent/pre-step 的 waterfall。组装发生在每个 step 前。":"preStep() calls assemble() before the agent/pre-step waterfall. Assembly happens before each step.","执行可以重叠；前置策略、结果写入和附加上下文保持模型顺序。exclusive 调用形成屏障，parallel 调用进入有上限的滚动池。":"Dispatches may overlap; pre-policy, result commits, and additional context remain model-ordered. Exclusive calls form barriers; parallel calls enter a bounded rolling pool.","按 Agent 挂载预设；声明到 root service realm 的错误组合会被拒绝。":"Presets are mounted per agent. Invalid compositions that publish into the root service realm are rejected.","turn() 包含多个 step()。正常完成时没有工具调用会结束这一轮；有工具调用时执行工具，再进入下一步。异常、取消和 token 上限有独立结束原因。":"A turn() contains multiple step() calls. Normal completion without new tool calls ends the turn. Tool calls run before the next step. Errors, cancellation, and token limits have distinct outcomes.","持久化目标状态和进程内继续执行状态是两个层面。":"Durable goal state and process-local continuation state are separate layers.","文件隔离和 Bash 隔离共同使用该策略服务，避免各自认定不同的工作区根目录。":"Filesystem and Bash isolation share this policy service so they agree on the workspace root.","批准支持缺失时，ask 不能变成默认放行。批准与隔离分工不同，获得批准也不等于后端没有限制。":"Missing approval support must not turn ask into a default allow. Approval and isolation have distinct roles; approval does not remove backend restrictions.","tools 管理 PTC 的模型可见形式；ptcRuntime 负责运行程序。程序内部的子调用和顶层工具结果属于不同记录。":"Tools owns the model-facing PTC form; ptcRuntime runs the program. Nested dispatches and the top-level tool result are separate records.","fs-observation-policy 通过 fs/* 事件关卡加入已观察状态检查。更换提供方需要处理配置、生命周期和同一运行环境的约束。":"fs-observation-policy adds observed-state checks through fs/* event gates. Switching a provider also requires compatible configuration, lifecycles, and execution environments.","压缩属于条件分支。页面中的压缩场景用于解释机制，演示比例和播放时长均不代表真实 token 或耗时。":"Compaction is a conditional branch. The example explains the mechanism; its proportions and playback timing are not real token measurements or latency.","spawn、fork 和外部进程提供方不能简单视为同一种隔离。父子会话、继承前缀与继续执行需要分别表达。":"Spawn, fork, and out-of-process providers offer different isolation. Parent/child sessions, inherited prefixes, and continuations need separate treatment.","官方 owner 包含 experimental 前缀。界面保留实验标识，不将其视为稳定的全局基础能力。":"The owner package is explicitly experimental. This UI preserves that status rather than presenting it as a stable global primitive.","此目录记录了官方文档中的服务；本项目没有假定其存在一个已验证的公共插件路径。":"This entry comes from the official table. The viewer does not assume an independently verified public plugin path exists.","外存后的模型可见内容通常是预览和定位提示。完整内容的保存与上下文内的摘要需要分别呈现。":"After spilling, model-visible content is typically a preview and locator. Full-content storage and in-context summaries need separate views.","交互与入口":"Interaction & entry","上下文与记忆":"Context & memory","调度与模型":"Models & orchestration","权限与边界":"Permissions & boundaries","工具与执行":"Tools & execution","记录与扩展":"History & extensions","任务从哪里进入":"Where tasks enter","模型能看到什么":"What the model can see","决定下一步做什么":"Deciding the next action","哪些操作可以执行":"What may be executed","让动作真正发生":"Making actions happen","保存过程，支持扩展":"Saving history and extending the system","一句话，进入工作区":"A request enters the workspace","为任务装配 Agent":"Compose an agent for the task","打开这一轮的记录":"Open this turn's log","把模型能看的东西准备好":"Assemble model-visible context","模型收到一次完整请求":"Send a complete request to the model","模型提出工具调用":"The model proposes tool calls","执行前，先过检查":"Run checks before execution","接口不变，文件后端可以换":"One interface, different file backends","并行执行，按顺序写回":"Run concurrently, commit in order","带着结果，再问一次模型":"Ask the model again with the results","在允许的范围内修改":"Edit within the allowed boundary","启动测试进程":"Start the test process","处理工具返回的内容":"Process tool results","模型给出最终答复":"The model produces a final answer","这一轮，正式结束":"Close this turn","留下可读取的过程":"Keep a readable history","请求人工批准":"Request human approval","拒绝留在结果里":"Record the denial in the result","上下文出现压力":"Context pressure increases","替换模型看到的内容":"Replace the model-visible surface","重新构造请求":"Rebuild the request","把一部分工作交给子任务":"Delegate part of the task","子任务运行自己的循环":"The child runs its own loop","把子任务结果带回主任务":"Return the child's findings","把多次工具调用写成程序":"Put several tool calls in one program","入口和执行分开：换一个客户端，不必重新实现全部工具。":"Entry and execution are separate: changing clients does not require reimplementing every tool.","同一个主循环，可以搭配不同的工具和运行环境。":"The same loop can be composed with different tools and execution environments.","轮次 turn 和步骤 step 是两层边界，网页会分别标出来。":"Turn and step are distinct boundaries, shown separately in this viewer.","工具列表会重新组装，因此插件变化可以影响后续步骤。":"Tool schemas are assembled again, so plugin changes can affect later steps.","LLM 接口可以换实现；协议转换留在适配器这一侧。":"The LLM implementation is replaceable; protocol translation stays in the adapter.","模型提出调用，工具管线随后决定是否执行。":"The model proposes a call; the tool pipeline then decides whether it runs.","ask 缺少批准支持时会转为拒绝，不能当作已经获得授权。":"Without approval support, ask resolves to denial rather than implicit authorization.","点击右侧的提供方，可以观察哪些职责保持不变。":"Select a provider on the right to inspect the stable interface responsibilities.","“完成了”和“写入会话了”是两件事。":"Finishing execution and committing to the session are different events.","消息历史不会等同于一张不变的大字符串。":"Message history is not a single unchanging string.","此处展示一个允许修改的教学分支，实际权限由部署和提供方决定。":"This example follows an allowed-edit branch; actual permissions depend on deployment and providers.","shell 管“怎样执行命令”，subprocess 管进程与输入输出，sandbox 管隔离包装。":"Shell handles command execution, subprocess handles processes and I/O, and sandbox handles isolation wrapping.","过长结果可以由策略保存到外部存储，模型接收预览和定位提示。":"A policy may spill oversized output, leaving a preview and retrieval hint for the model.","普通完成、token 上限、取消、错误分别保留自己的结束原因。":"Completion, token limits, cancellation, and errors preserve distinct end reasons.","收尾也有明确边界，出错时仍需要记录发生了什么。":"Finalization has a boundary too; failures still need a recorded outcome.","右侧“运行记录”可以载入 SessionEvent 数据；动画本身没有调用 DSH。":"The Run logs tab can load SessionEvent data. The animation itself does not invoke DSH.","没有答复者也不会默许，接口会返回 unavailable。":"With no answerer, the interface returns unavailable instead of implicitly allowing the call.","下方执行层保持熄灭，表示这一分支没有执行工具本体。":"The execution layer stays inactive because this branch never dispatches the tool body.","界面中的条形长度用于解释，未读取真实 token 数。":"Bar lengths are illustrative; they do not reflect measured token counts.","当前上下文变短，追加式日志继续保留历史。":"The current context gets shorter while the append-only log retains its history.","压缩与重试都有触发条件，每次任务的实际路径可能不同。":"Compaction and retry have specific triggers; the actual path differs between tasks.","父任务与子任务有各自的生命周期，子任务内部也有模型—工具循环。":"Parent and child have separate lifecycles. A child also runs a model–tool loop.","进程内、外部进程和远端通道的隔离条件不同，不能只凭一个“子 Agent”标签判断。":"In-process, external-process, and remote providers have different isolation properties.","委派结果和完整子会话轨迹需要分开查看。":"The delegation result and full child-session trace should be inspected separately.","程序内部调用的记录与顶层返回值分层展示，避免把它们当成平铺的独立模型调用。":"Nested calls and the top-level return value are shown separately, rather than as independent model calls.","用户提交任务，会话入口找到对应工作区和 Agent。界面、命令行等入口可以不同，随后进入会话与 Agent 的执行流程。":"The session entry point associates the submitted task with a workspace and agent. Different clients feed the same session and agent lifecycle.","创建或恢复 Agent，按会话预设挂载插件。工具、提示词和具体提供方由配置决定。":"Create or resume an agent and mount its session preset. Configuration determines the tools, prompts, and providers.","执行循环写入 turn/start。一个用户任务可以经历多个 step，每一步对应一次模型交互和随后的工具处理。":"The loop records turn/start. A task can span multiple steps, each with model interaction and subsequent tool handling.","每一步重新收集提示词片段与可见工具定义，再经过 agent/pre-step 检查。这里使用本次任务需要的上下文。":"Each step collects prompt sections and visible tool schemas again, then runs agent/pre-step checks using this task's context.","执行循环派生当前消息，调用已准备的适配器，或走统一 llm.stream()。适配器负责模型协议和流式回复。":"The loop derives current messages and invokes a prepared adapter or the shared llm.stream(). The adapter owns provider protocol and streaming.","助手消息先写入会话。模型提出读取源码和测试文件的操作，执行循环将它们交给工具调度器。":"The assistant message is committed first. Its proposed reads are then passed to the tool scheduler.","工具调用依次经过前置策略与守卫。策略可能允许、拒绝或请求人工批准，然后才进入执行包装和工具本体。":"Calls pass pre-policy and guards before execution wrappers and the tool body. Policy can allow, deny, or ask for human approval.","文件工具调用 ctx.fs，实际提供方读取文件。此教学场景选择 fs-local；沙箱和云端实现也在官方表中。":"The file tool calls ctx.fs and its provider reads the file. This example uses fs-local; sandboxed and cloud implementations are also listed.","支持并行的调用进入有上限的滚动池，结果按模型给出的调用顺序提交。后完成的前序调用，会让后序结果等待写回。":"Parallel calls enter a bounded rolling pool. Results commit in model order, so a later result may wait for an earlier call to finish.","工具结果写入会话，附加上下文进入下一步的收件箱。循环重新组装提示词，再让模型根据读到的内容决定后续动作。":"Results enter the session and additional context enters the next-step inbox. The loop assembles a new prompt so the model can choose the next action.","此场景假设修改得到策略允许。工具通过文件接口写入；受限提供方还会检查工作区边界，观察策略可以参与文件事件检查。":"This scenario assumes policy allows the edit. The file provider writes it; a confining provider also checks the workspace boundary, and observation policy can add event-gate checks.","命令工具使用 shell，执行器再通过 subprocess 启动进程。受限执行器还会使用 sandbox 及共享的隔离策略。":"The command tool calls shell, whose executor uses subprocess. Sandboxed executors also use sandbox and a shared isolation policy.","执行包装返回标准化结果，后置策略可以接受、替换、补充或阻断结果。最终结果观察使用冻结后的快照。":"Execution wrappers return normalized results. Post-policy can accept, replace, enrich, or block them. Final observers receive a frozen snapshot.","工具结果再次进入模型请求。助手正常完成且没有新的工具调用时，这一步返回 completed。":"Results enter another model request. If the assistant completes without further tool calls, the step returns completed.","执行循环在 finally 中写入 turn/end，保存本轮的结束原因。仍有排队输入时，可以继续打开下一轮。":"The loop writes turn/end in finally, recording the outcome. Queued input can open another turn.","会话提交后的 session/event 可被持久化插件观察；session/flush 等待各持久化监听方完成。写入事件贯穿全程，刷写是另一个检查点。":"Persistence plugins observe post-commit session/event notifications. session/flush awaits durability listeners. Events are appended throughout; flushing is a separate checkpoint.","前置策略返回 ask，批准接口寻找一次性答复。此教学分支选择“拒绝”。":"Pre-policy returns ask and the approval interface seeks a one-shot answer. This example chooses Deny.","未获允许的工具不进入实际文件或进程操作。调用以相应结果结束，模型可以解释限制或选择其他可用路径。":"A denied tool never performs the file or process operation. The model receives the outcome and can explain the restriction or choose another path.","压缩基础实现响应步骤后的压力或请求错误恢复。先考虑裁剪过大的工具结果，再在需要时进行摘要压缩。":"The basic compaction implementation reacts to post-step pressure or request-error recovery. It considers pruning oversized tool results before summary compaction.","压缩生成新的可见内容，并通过消息 surface 的替换机制记录。旧日志保留，因此仍能追溯被替代的来源事件。":"Compaction creates new model-visible content using surface replacement. Earlier log events remain available for provenance.","请求错误处理器可以返回 retry，让循环重新构造请求。未经恢复的错误会保留结构化失败信息。":"A request-error handler can return retry so the loop rebuilds the request. Unrecovered errors preserve structured failure details.","委派工具选择提供方：进程内 spawn、fork 或外部 Agent 通道。此场景演示 spawn，创建子任务的独立会话。":"The delegation tool selects a provider such as in-process spawn, fork, or an external agent. This example uses spawn to create a separate child session.","子任务加载自己的组合并执行工作。可继续的委派与一次性委派有不同控制方式；页面用第二条小轨道帮助区分。":"The child loads its own composition and runs its work. One-shot and continuable delegation have different controls; a second track identifies the child.","结果回到委派工具，再经过主任务的工具结果处理。主任务继续自己的下一步，不会自动把子会话的全部事件当成普通消息合并。":"Findings return through the parent's tool-result pipeline. The parent continues its next step without automatically merging every child event into normal messages.","在 PTC 模式中，tools 负责模型可见的调用形式，ptcRuntime 运行程序，并通过主机绑定调用其他工具。":"In PTC mode, tools owns the model-facing invocation form. ptcRuntime runs the program, which reaches other tools through host bindings.","跳到文字说明":"Skip to text explanation","DSH Inside 首页":"DSH Inside home","主导航":"Main navigation","任务导览":"Task journey","接口图鉴":"Seam atlas","运行记录":"Run logs","源码对照":"Source-linked","使用说明":"Help","关于与来源":"About & sources","导览与服务目录":"Journey and service directory","可旋转的三维 Harness 架构。也可通过接口图鉴访问全部服务。":"Rotatable 3D Harness view. All services are also available in the Seam atlas.","按职责展开，只追踪此刻相关的连接。":"Open the system. Follow only the connections that matter now.","教学演示":"Teaching demo","视图控制":"View controls","总览":"Overview","剖面":"Focus","切换整体架构":"Show the whole system","独立查看当前服务":"Inspect the selected service","复位视角":"Reset camera","俯视":"Top view","切换俯视视角":"Toggle top view","展开层级":"Layer spacing","三维层级展开程度":"3D layer separation","← 调用方":"Consumers →","接口 / 服务":"Interface / service","实现方 →":"→ Implementations","拖动旋转":"Drag to rotate","滚轮缩放":"Scroll to zoom","点击组件":"Click a component","减少动态":"Reduce motion","恢复动态":"Restore motion","当前步骤与接口说明":"Current step and service details","播放与步骤控制":"Playback and step controls","本地运行 · 无模型调用 · 日志不上传":"Local only · No model calls · No log uploads","概念分组 ≠ 固定执行顺序":"Visual groups ≠ fixed execution order","可替换能力接口":"Replaceable capability seam","核心服务":"Core service","组合点":"Composition point","任务入口":"Task entry","执行调度":"Orchestration","会话记录":"Session events","上下文准备":"Context assembly","模型交互":"Model interaction","执行边界":"Execution boundary","工具执行":"Tool execution","并行与顺序":"Concurrency & order","拒绝分支":"Denied branch","子任务":"Child task","日志原文":"Raw event","暂停，看看这一步":"Pause and inspect","开始任务导览":"Play this task","导览结束。你可以选择另一个场景，或独立查看接口。":"Journey complete. Choose another task or inspect a service.","接口图鉴，可以按中文名称或 ctx key 搜索。":"Seam atlas. Search by name, ctx key, or package.","运行记录，仅在本地读取文件。":"Run logs. Files are read locally only.","看见任务":"Follow a task.","如何完成。":"See it happen.","一个具体问题，一条清晰的执行路径。":"A concrete question. A visible path to the answer.","选择一个任务场景":"Choose a task scenario","选择任务场景":"Choose a task scenario","输入提示词":"Input prompt","复制当前语言的提示词":"Cop
